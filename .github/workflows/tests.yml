# Tests fuer jeden Push ausserhalb von main und fuer Pull Requests --
# Rueckmeldung, bevor etwas auf main (= Veroeffentlichung) landet.
# Derselbe Aufruf wie im Veroeffentlichen-Lauf: npm test.
name: Tests

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Testbericht aufheben
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-ergebnis
          path: test-ergebnis.json
          if-no-files-found: warn
