# Live-Preise fuer CrankScore.
#
# Alle sechs Stunden: Produktfeeds der Partnershops laden, jede Zeile einem
# Teil aus dem Katalog zuordnen, preise.json und preisverlauf.json schreiben
# und veroeffentlichen. Die App holt sich die Dateien beim Start.
#
# Die Feed-Adressen stehen im Repository-Secret PREIS_FEEDS, eine je Zeile:
#   bike-components|https://productdata.awin.com/datafeed/download/apikey/.../
# Sie enthalten den persoenlichen API-Schluessel -- deshalb nur im Secret,
# nie in einer Datei. Ohne Secret laeuft die Action durch und aendert nichts.
name: Live-Preise

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live-preise
  cancel-in-progress: false

jobs:
  preise:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Feeds lesen, Preise zuordnen
        env:
          PREIS_FEEDS: ${{ secrets.PREIS_FEEDS }}
        run: python tools/preise.py

      - name: Neue Preise hochladen
        id: hoch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- preise.json preisverlauf.json)" ]; then
            echo "Keine neuen Preise."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preise.json preisverlauf.json
          git commit -q -m "Live-Preise $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q origin main
          git push -q origin HEAD:main
          echo "neu=ja" >> "$GITHUB_OUTPUT"

      # Pages-Quelle "GitHub Actions": nicht main ausliefern (koennte
      # ungetesteten App-Code enthalten), sondern den zuletzt geprueften,
      # veroeffentlichten Stand (Tag "veroeffentlicht") mit den neuen Preisen.
      - name: Pages-Quelle
        id: quelle
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "typ=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo unbekannt)" >> "$GITHUB_OUTPUT"

      - name: Pages neu bauen (Branch-Quelle)
        if: steps.hoch.outputs.neu == 'ja' && steps.quelle.outputs.typ != 'workflow'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api -X POST "repos/${{ github.repository }}/pages/builds" > /dev/null 2> fehler.txt; then
            echo "::warning::Pages-Bau liess sich nicht anstossen: $(cat fehler.txt)"
          fi

      - name: Seite aus dem veroeffentlichten Stand plus neue Preise
        if: steps.hoch.outputs.neu == 'ja' && steps.quelle.outputs.typ == 'workflow'
        run: |
          git fetch -q origin "refs/tags/veroeffentlicht:refs/tags/veroeffentlicht"
          mkdir _site
          git archive veroeffentlicht index.html mtb-sw.js manifest.webmanifest links.json fonts docs $(git ls-tree --name-only veroeffentlicht | grep '^icon-') | tar -x -C _site
          for f in preise.json preisverlauf.json; do [ -f "$f" ] && cp "$f" _site/ || true; done
      - uses: actions/configure-pages@v5
        if: steps.hoch.outputs.neu == 'ja' && steps.quelle.outputs.typ == 'workflow'
      - uses: actions/upload-pages-artifact@v3
        if: steps.hoch.outputs.neu == 'ja' && steps.quelle.outputs.typ == 'workflow'
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        if: steps.hoch.outputs.neu == 'ja' && steps.quelle.outputs.typ == 'workflow'
