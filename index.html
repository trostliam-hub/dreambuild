}
function schliesse(){ $("modal").innerHTML = ""; document.body.style.overflow = ""; }
const zuBtn = `<button class="iconbtn" data-zu="1" aria-label="Schließen">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>`;

function oeffneSlot(slotKey){
  const s = slotOf(slotKey);
  if(!s) return;
  offenerSlot = slotKey;
  const basis = bewerte(build);
  const wunsch = markenWunsch(slotKey);
  const karten = K[quelleOf(s)].map(t => {
    const probe = {...build}; probe[slotKey] = t.id;
    const pr = bewerte(probe);
    const eigene = pr.funde.filter(f => f.slots.indexOf(slotKey) >= 0);
    const fehler = eigene.filter(f => f.level === "fehler");
    const warn = eigene.filter(f => f.level === "warnung");
    const d = pr.gesamt - basis.gesamt;
    const istSel = t.id === build[slotKey];
    const tag = fehler.length ? `<span class="tag no">passt nicht</span>`
              : warn.length   ? `<span class="tag w">mit Abstrich</span>` : `<span class="tag ok">passt</span>`;
    const dtag = istSel ? `<span class="tag n">verbaut</span>`
               : d > 0 ? `<span class="tag ok">+${d}</span>` : d < 0 ? `<span class="tag no">${d}</span>` : "";
    const mtag = (wunsch && t.m === wunsch) ? `<span class="tag m">${esc(wunsch)}</span>` : "";
    const gruende = fehler.concat(warn).slice(0,2).map(f =>
      `<div class="why ${f.level === "warnung" ? "w" : ""}"><b>${esc(f.titel)}.</b> ${f.text}</div>`).join("");
    return {gut:!fehler.length, sel:istSel, sort:[fehler.length ? 2 : warn.length ? 1 : 0, -d], html:`
      <div class="opt ${istSel ? "sel" : ""}">
        <div><div class="opt-n">${(() => { const fe = feedEintrag(t);
            return fe && fe.bild ? `<img class="feedbild" src="${esc(fe.bild)}" alt="" loading="lazy">` : ""; })()}${esc(t.n)} ${tag} ${dtag} ${mtag}</div>
          <div class="specs">${specsVon(slotKey, t).map(c => `<span class="chip">${esc(c)}</span>`).join("")}</div></div>
        <div class="opt-r">${(() => { const fe = feedEintrag(t);
            return fe && fe.preis != null
              ? `<span class="opt-p livepreis">${eur(fe.preis)}</span>`
              : `<span class="opt-p">${eur(t.p)}</span>`; })()}<span class="opt-g">${t.g} g</span>
          <button class="btn ghost sm" data-detail="${slotKey}|${t.id}">Ansehen</button>
          ${istSel ? "" : `<button class="btn sm" data-einbau="${slotKey}|${t.id}">Einbauen</button>`}</div>
        ${gruende}
        ${affHtml(t)}
      </div>`};
  });
  karten.sort((a,b) => a.sort[0] - b.sort[0] || a.sort[1] - b.sort[1]);
  const passend = karten.filter(k => k.gut || k.sel);
  const zeige = (nurPassende && passend.length) ? passend : karten;
  const drin = build[slotKey] ? findeTeil(slotKey, build[slotKey]) : null;
  zeigeSheet(`
    <div class="sheet-h"><h3><span class="sub">Bauteil wählen</span>${s.label}</h3>
      ${build[slotKey] ? `<button class="btn ghost sm" data-leeren="${slotKey}">Leeren</button>` : ""}${zuBtn}</div>
    <div class="sheet-b">
      ${(() => {
        const g = guenstigere(slotKey, build);
        if(!g.length) return "";
        const top3 = g.slice(0, 3);
        return `<div class="sparkasten" style="margin-bottom:4px">
          <b>${eur(top3[0].spart)} günstiger bei gleichem Maß.</b>
          <p>${top3.map(x => esc(x.teil.n) + " — " + eur(preisVon(x.teil)) +
              (x.ab.length ? " (" + esc(x.ab.join(", ")) + ")" : "")).join("<br>")}</p>
        </div>`;
      })()}
      <div class="filt">
        <button data-filt="1" aria-pressed="${nurPassende}">Nur passende · ${passend.length}</button>
        <button data-filt="0" aria-pressed="${!nurPassende}">Alle · ${karten.length}</button>
      </div>${zeige.map(k => k.html).join("")}
    </div>`);
}

  else if(step === 2){
    body = `<p class="q">Wie schwer bist du?</p>

  else if(step === 3){
    const reihe = (key, cfg, val) => `<div class="mrow"><label>${cfg.label}</label><div class="mchips">

    body = `<p class="q">Hast du Markenwünsche?</p>
      <p class="qs">„Egal“ lässt dem Assistenten freie Hand — meist das beste Ergebnis pro Euro. Ein Wunsch wird stark gewichtet, aber niemals gegen die Kompatibilität durchgedrückt.</p>

      ${reihe("mBrems", MARKEN.brems, plan.mBrems)}
      ${reihe("mFed", MARKEN.fed, plan.mFed)}
      <p class="hint">Shimano fährt Micro Spline, SRAM fährt XD — das legt indirekt den Laufradsatz fest. Der Assistent berücksichtigt das automatisch.</p>`;
  }
  else if(step === 4){
    body = `<p class="q">Worauf kommt es dir an?</p>
      <p class="qs">Entscheidet, wohin überschüssiges Budget fließt.</p>
      <div class="qgrid" style="grid-template-columns:1fr">
        ${PRIOS.map(p => `<button class="qopt" data-prio="${p.v}" aria-pressed="${plan.prio === p.v}" style="align-items:flex-start;text-align:left">
          ${p.n}<small>${p.s}</small></button>`).join("")}</div>`;
    weiter = "Aufbau rechnen";
  }
  else {
    const b = wizErgebnis || (wizErgebnis = generiere());
    const r = bewerte(b);
    const zeilen = SLOTS.filter(s => !entfaellt(b, s.k)).map(s => {
      const t = b[s.k] ? findeTeil(s.k, b[s.k]) : null;
      return `<div class="erg"><span class="k">${s.label}</span>
        <span class="n">${t ? esc(t.n) : "—"}</span>
        <span class="p">${t ? eur(preisVon(t)) : "—"}</span></div>`;
    }).join("");
    const uebrig = plan.budget - r.preis;
    body = `<p class="q">Dein Aufbau</p>
      <p class="qs">${selNamen()} · ${plan.prio === "pl" ? "Preis-Leistung" : plan.prio === "leicht" ? "leicht" : "robust"}
        ${plan.mSchalt || plan.mBrems || plan.mFed ? "· " + [plan.mSchalt, plan.mBrems, plan.mFed].filter(Boolean).join(", ") : ""}</p>
      <div class="sumbox">
        <div><b style="color:${ampel(r.gesamt)}">${r.gesamt}</b><span>Score</span></div>
        <div><b>${eur(r.preis)}</b><span>${uebrig >= 0 ? eur(uebrig) + " frei" : eur(-uebrig) + " drüber"}</span></div>
        <div><b>${kg(r.gewicht)}</b><span>Gewicht</span></div>
      </div>
      ${zeilen}
      ${uebrig < 0 ? `<div class="mixbox w" style="margin-top:12px"><b>Das Budget trägt diese Disziplin nicht.</b>

          das, was Rahmen, Fahrwerk und Bremsen dort kosten. Der Aufbau bleibt richtig, statt auf
          billigere Teile auszuweichen, die nicht zur Disziplin passen.</div>` : ""}
      ${r.funde.filter(f => f.level === "fehler").length
        ? `<div class="mixbox no" style="margin-top:12px"><b>Mit Konflikt.</b> Der Katalog hat für diese Kombination aus Disziplin, Budget und Marken kein sauberes Teil. Nach dem Übernehmen siehst du im Reiter Befunde genau welches.</div>`
        : `<div class="mixbox ok" style="margin-top:12px"><b>Ohne harte Konflikte.</b> Alle Maße passen zueinander.</div>`}`;
    weiter = "Übernehmen";
  }

  zeigeSheet(`
    <div class="sheet-h"><h3><span class="sub">Dreambuild-Assistent</span>Schritt ${step+1} von ${N}</h3>${zuBtn}</div>
    ${bahn}
    <div class="sheet-b">${body}</div>
    <div class="sheet-f">
      ${step > 0 ? `<button class="btn ghost" data-wiz="${step-1}">Zurück</button>` : ""}
      ${step === 5 ? `<button class="btn ghost" data-wizneu="1">Nochmal</button>` : ""}
      <button class="btn wide" style="flex:1" ${kannWeiter ? "" : "disabled"}
        data-${step === 5 ? "wizfertig" : "wiz"}="${step === 5 ? "1" : step+1}">${weiter}</button>
    </div>`);
}

/* Foto verkleinern, bevor es in den Gerätespeicher geht. Ein Handyfoto hat
   schnell 4 MB; der Browser gibt einer Seite insgesamt nur etwa 5 MB. */
function fotoAufnehmen(datei, ziel){
  if(!datei) return;
  const wohin = ziel || {art:"rad"};
  const leser = new FileReader();
  leser.onload = function(ev){
    const bild = new Image();
    bild.onload = function(){
      const max = 1000;
      const f = Math.min(1, max / Math.max(bild.width, bild.height));
      const c = document.createElement("canvas");
      c.width = Math.round(bild.width * f); c.height = Math.round(bild.height * f);
      c.getContext("2d").drawImage(bild, 0, 0, c.width, c.height);
      let daten = c.toDataURL("image/jpeg", 0.72);
      if(daten.length > 1400000) daten = c.toDataURL("image/jpeg", 0.5);
      fotos[modus] = daten;
      sichern();
      /* Beides neu zeichnen: die Schublade zeigt das Bild, die Liste dahinter
         das Vorschaubild in der Zeile. Vorher blieb die Liste stehen. */
      zeichne();
    };
    bild.onerror = function(){ alert("Das Bild ließ sich nicht lesen. Versuch ein anderes Format."); };
    bild.src = ev.target.result;
  };
  leser.readAsDataURL(datei);
}

document.addEventListener("click", e => {
  const T = q => e.target.closest(q);
  if(T("[data-zu]") || (e.target.classList && e.target.classList.contains("scrim"))){ schliesse(); return; }

  const dt = T("[data-detail]");
  if(dt){ const q = dt.dataset.detail.split("|"); oeffneDetail(q[0], q[1]); return; }

  const ein = T("[data-einbau]");
  if(ein){
    const p = ein.dataset.einbau.split("|");
    build[p[0]] = p[1];
    if(p[0] === "rahmen") for(const s of SLOTS) if(entfaellt(build, s.k)) build[s.k] = null;
    sichern(); schliesse(); zeichne(); return;
  }
  const le = T("[data-leeren]");
  if(le){ build[le.dataset.leeren] = null; sichern(); schliesse(); zeichne(); return; }

  const fi = T("[data-filt]");
  if(fi){ nurPassende = fi.dataset.filt === "1"; if(offenerSlot) oeffneSlot(offenerSlot); return; }

  const th = T("[data-thema]");
  if(th){
    const n = th.dataset.thema;
    if(zuGeklappt[n]) delete zuGeklappt[n]; else zuGeklappt[n] = 1;
    sichern(); zeichne(); return;
  }

  const sl = T("[data-slot]");
  if(sl){ oeffneSlot(sl.dataset.slot); return; }

  const d = T("[data-d]");
  if(d){
    const id = d.dataset.d, i = sel.indexOf(id);
    if(i >= 0){ if(sel.length > 1) sel.splice(i, 1); } else sel.push(id);
    sel.sort((a,b) => DID.indexOf(a) - DID.indexOf(b));
    sichern(); zeichne();
    if(wizOffen()) oeffneWiz(0); else oeffneDisz();
    return;
  }
  const bd = T("[data-budget]");
  if(bd){ plan.budget = +bd.dataset.budget; sichern(); oeffneWiz(1); return; }
  const fa = T("[data-fahrer]");
  if(fa){ plan.fahrer = +fa.dataset.fahrer; sichern(); oeffneWiz(2); return; }
  const mk = T("[data-marke]");
  if(mk){ const p = mk.dataset.marke.split("|"); plan[p[0]] = p[1] || ""; sichern(); oeffneWiz(3); return; }
  const pr = T("[data-prio]");
  if(pr){ plan.prio = pr.dataset.prio; sichern(); oeffneWiz(4); return; }

  const wz = T("[data-wiz]");
  if(wz){ const n = +wz.dataset.wiz; if(n === 5) wizErgebnis = null; oeffneWiz(n); return; }
  if(T("[data-wizneu]")){ wizErgebnis = null; oeffneWiz(5); return; }
  if(T("[data-wizfertig]")){
    if(wizErgebnis) setzeBau({...wizErgebnis});
    wizErgebnis = null; view = "aufbau"; sichern(); schliesse(); zeichne();
    window.scrollTo({top:0, behavior:"smooth"}); return;
  }



  const al = T("[data-alter]");
  if(al){ markt.alter = parseFloat(al.dataset.alter); sichern(); zeichne(); return; }
  const zu2 = T("[data-zustand]");
  if(zu2){ markt.zustand = zu2.dataset.zustand; sichern(); zeichne(); return; }
  const vs = T("[data-vs]");
  if(vs){
    const k = vs.dataset.vs;
    if(markt.verschleiss[k]) delete markt.verschleiss[k]; else markt.verschleiss[k] = 1;
    sichern(); zeichne(); return;
  }

  const md = T("[data-modus]");
  if(md){
    if(md.dataset.modus !== modus){ wechsle(md.dataset.modus); view = "aufbau"; sichern(); zeichne(); }
    return;
  }
  if(T("[data-fotowahl]")){ fotoZiel = {art:"rad"}; const i = $("foto-in"); if(i) i.click(); return; }

  if(T("[data-feedwahl]")){ const i = $("feed-in"); if(i) i.click(); return; }
  if(T("[data-feedweg]")){ feed = {treffer:{}, stand:0, quelle:"", zeilen:0}; sichern(); zeichne(); oeffneMenu(); return; }
  const sa = T("[data-shopan]");
  if(sa){ aff.an[sa.dataset.shopan] = !aff.an[sa.dataset.shopan]; sichern(); zeichne(); oeffneMenu(); return; }
  if(T("[data-fotoweg]")){ fotos[modus] = null; sichern(); zeichne(); return; }
  if(T("[data-spick]")){ oeffneSpick(); return; }

  const v = T("[data-view]");
  if(v){ view = v.dataset.view; zeichne(); window.scrollTo({top:0, behavior:"smooth"}); return; }
  if(T("[data-reset]")){
    setzeBau(modus === "real" ? leerBau() : {...START});
    fotos[modus] = null; sel = ["trail"]; plan = {...PLAN_START};
    sichern(); schliesse(); zeichne(); return;
  }
});
const wizOffen = () => !!$("modal").querySelector(".steps");

document.addEventListener("input", e => {

  if(mp){
    const v = parseInt(mp.value, 10);
    markt.preis = isNaN(v) || v < 0 ? 0 : v;
    sichern();
    /* Nur die Bewertung neu zeichnen waere schoener, aber zeichne() setzt das
       Feld neu und der Fokus ginge verloren. Deshalb gezielt aktualisieren. */
    const k = document.querySelector(".urteil");

  if(pl){
    const v = parseInt(pl.value, 10);
    plan[pl.dataset.plan] = isNaN(v) || v < 0 ? 0 : v;

});

/* ═══════════ 12 · Selbstaktualisierung ═══════════
   Die App soll sich ohne Zutun erneuern. Dafuer greifen drei Dinge ineinander:

   1. updateViaCache:"none" — der Browser darf das Worker-Skript selbst nie aus
      seinem HTTP-Cache beantworten, sonst merkt er eine neue Fassung tagelang nicht.
   2. Der Worker ruft skipWaiting(). Eine neue Fassung wartet also nicht, bis alle
      Tabs zu sind, sondern uebernimmt sofort.
   3. Die Uebernahme loest controllerchange aus -> wir laden die Seite einmal neu.
      Die Bedingung hatteController schliesst die Erstinstallation aus: dort
      wechselt der Controller von "keiner" auf "einer", und ein Neuladen waere
      nur ein Flackern ohne Grund.

   Geprueft wird beim Start, bei jeder Rueckkehr in die App und stuendlich. */
try{
  if("serviceWorker" in navigator && window.top === window.self
     && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")
     && document.querySelector('link[rel="manifest"]')){

    var hatteController = !!navigator.serviceWorker.controller;
    var laedtNeu = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(!hatteController || laedtNeu) return;
      laedtNeu = true;
      location.reload();
    });

    window.addEventListener("load", function(){
      navigator.serviceWorker.register("mtb-sw.js", {updateViaCache:"none"}).then(function(reg){
        var schau = function(){ try{ reg.update(); }catch(e){} };
        schau();
        document.addEventListener("visibilitychange", function(){
          if(document.visibilityState === "visible") schau();
        });
        setInterval(schau, 3600000);
      }).catch(function(){});
    });
  }
}catch(e){}
