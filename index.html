<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="MTB-Konfigurator: Traumaufbauten bauen, Kompatibilitaet pruefen, Upgrades finden.">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b6e79">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dreambuild">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" sizes="192x192">
<title>Dreambuild</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#e9ecef; --surface:#ffffff; --surface-2:#f3f5f7; --sunk:#dfe4e8;
  --ink:#10161b; --ink-2:#48555f; --ink-3:#7c8996;
  --line:#d3dade; --line-soft:#e4e9ec;
  --anod:#0b6e79; --anod-2:#0a5a63; --anod-soft:#dceff0; --on-anod:#ffffff;
  --gut:#1b7a4b; --gut-soft:#dcf0e5;
  --warn:#9a6205; --warn-soft:#faedd4;
  --bad:#b32828; --bad-soft:#fae0e0;
  --shadow:0 1px 2px rgba(16,22,27,.06),0 10px 30px -14px rgba(16,22,27,.22);
  --r:11px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0e1418; --surface:#161e23; --surface-2:#1c262c; --sunk:#0b1014;
    --ink:#e8eef1; --ink-2:#a2b0b8; --ink-3:#71828c;
    --line:#2b373e; --line-soft:#222d33;
    --anod:#3fb3c0; --anod-2:#63c8d3; --anod-soft:#10333a; --on-anod:#06181b;
    --gut:#4fc184; --gut-soft:#10301f;
    --warn:#e0a53c; --warn-soft:#332614;
    --bad:#f0736c; --bad-soft:#3a1a19;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0e1418; --surface:#161e23; --surface-2:#1c262c; --sunk:#0b1014;
  --ink:#e8eef1; --ink-2:#a2b0b8; --ink-3:#71828c;
  --line:#2b373e; --line-soft:#222d33;
  --anod:#3fb3c0; --anod-2:#63c8d3; --anod-soft:#10333a; --on-anod:#06181b;
  --gut:#4fc184; --gut-soft:#10301f;
  --warn:#e0a53c; --warn-soft:#332614;
  --bad:#f0736c; --bad-soft:#3a1a19;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:Archivo,-apple-system,system-ui,sans-serif;margin:0;letter-spacing:-.015em;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;-webkit-appearance:none}
:focus-visible{outline:2px solid var(--anod);outline-offset:2px;border-radius:5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:9px 14px;display:flex;align-items:center;gap:8px}
.brand{font-family:Archivo;font-weight:700;font-size:16.5px;letter-spacing:-.025em;margin-right:auto;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dchip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;
  padding:5px 11px 5px 9px;font-size:12.5px;font-weight:600;max-width:50vw;flex:none}
.dchip:hover{border-color:var(--anod);color:var(--anod)}
.dchip .dn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;background:var(--anod);flex:none}
.iconbtn{width:36px;height:36px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.iconbtn:hover{border-color:var(--anod);color:var(--anod)}

.bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 55px);z-index:35;
  background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding:10px 14px;display:grid;gap:9px;
  grid-template-columns:auto minmax(0,1fr) auto;align-items:center}
.ring-wrap{position:relative;width:50px;height:50px;flex:none}
.ring-wrap .v{position:absolute;inset:0;display:grid;place-items:center;
  font-family:Archivo;font-weight:700;font-size:16px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.verdict{font-size:13px;color:var(--ink-2);line-height:1.35;min-width:0}
.verdict b{color:var(--ink)}
.tot2{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex:none}
.tot2 b{font-family:"IBM Plex Mono",monospace;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.tot2 span{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3)}
.tot2 b.ueber{color:var(--bad)}
.bars{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr;gap:7px 14px}
.bar-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:7px}
.bar-row .lbl{color:var(--ink-3);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:9.5px}
.track{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden}
.fill{height:100%;border-radius:3px;transition:width .3s ease}
.bar-row .num{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:11px;min-width:18px;text-align:right}
@media (min-width:820px){
  .bar-in{grid-template-columns:auto minmax(0,1fr) 300px auto;gap:14px}
  .bars{grid-column:auto;grid-template-columns:1fr;gap:6px}
}

.wrap{max-width:1180px;margin:0 auto;padding:14px 14px 100px;display:grid;gap:16px}
@media (min-width:820px){.wrap{grid-template-columns:minmax(0,1fr) 336px;align-items:start;padding-bottom:40px}}

/* Einstieg in den Assistenten */
.wiz-cta{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:11px;align-items:center;
  width:100%;text-align:left;background:var(--anod);color:var(--on-anod);border-radius:var(--r);
  padding:12px 13px;margin-bottom:14px}
.wiz-cta:hover{background:var(--anod-2)}
.wiz-cta .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  background:rgba(255,255,255,.17)}
.wiz-cta b{font-family:Archivo;font-size:14.5px;font-weight:700;display:block;letter-spacing:-.01em}
.wiz-cta span{font-size:11.5px;opacity:.85;display:block;margin-top:1px;line-height:1.35}

.grp-h{display:flex;align-items:center;gap:9px;margin:0 2px 7px}
.grp-h h2{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.grp-h .rule{flex:1;height:1px;background:var(--line-soft)}
.grp-h .n{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3)}
.slots{display:flex;flex-direction:column;gap:6px}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;
  padding:10px 12px;text-align:left;width:100%;min-height:58px;align-items:center;transition:border-color .12s}
.slot:hover{border-color:var(--anod)}
.slot.fehler{border-color:var(--bad)}
.slot.warnung{border-color:var(--warn)}
.slot-k{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;
  grid-column:1;display:flex;align-items:center;gap:5px}
.slot-k .mark{width:6px;height:6px;border-radius:50%;flex:none}
.slot.fehler .mark{background:var(--bad)} .slot.warnung .mark{background:var(--warn)}
.slot-n{font-weight:600;font-size:14px;letter-spacing:-.005em;grid-column:1;line-height:1.25;overflow-wrap:anywhere}
.slot-n.empty{color:var(--ink-3);font-weight:500}
.slot-r{grid-column:2;grid-row:1 / span 2;text-align:right;display:flex;flex-direction:column;
  align-items:flex-end;justify-content:center;gap:1px;flex:none}
.slot-r .p{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.slot-r .g{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3)}
.specs{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;grid-column:1}
.chip{font-family:"IBM Plex Mono",monospace;font-size:10px;padding:2px 5px;border-radius:4px;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-soft);white-space:nowrap}
.slot .specs .chip:nth-child(n+4){display:none}
@media (min-width:560px){.slot .specs .chip:nth-child(n+4){display:inline-block}}
.slot.leer{opacity:.5;cursor:default;min-height:44px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px}
.panel{display:flex;flex-direction:column;gap:14px}
@media (min-width:820px){.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 138px)}}

.find{border-left:3px solid var(--line);padding:9px 0 9px 11px;display:flex;flex-direction:column;gap:4px}
.find + .find{border-top:1px solid var(--line-soft)}
.find.fehler{border-left-color:var(--bad)}
.find.warnung{border-left-color:var(--warn)}
.find.hinweis{border-left-color:var(--anod)}
.find-t{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13.5px;line-height:1.3;flex-wrap:wrap}
.pill{font-size:9px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;padding:2px 6px;border-radius:4px;flex:none}
.find.fehler .pill{background:var(--bad-soft);color:var(--bad)}
.find.warnung .pill{background:var(--warn-soft);color:var(--warn)}
.find.hinweis .pill{background:var(--anod-soft);color:var(--anod)}
.find p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.45;overflow-wrap:anywhere}
.find code{font-family:"IBM Plex Mono",monospace;font-size:11px;background:var(--surface-2);
  padding:1px 4px;border-radius:3px;color:var(--ink)}
.clean{display:flex;align-items:center;gap:9px;color:var(--gut);font-size:13px;font-weight:600;padding:8px 0}

.up{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:10px 0;border-top:1px solid var(--line-soft)}
.up:first-child{border-top:none;padding-top:3px}
.up-n{font-size:13px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.up-s{font-size:11px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;margin-top:3px}
.delta{color:var(--gut);font-weight:700;font-family:"IBM Plex Mono",monospace;font-size:12px}
.btn{background:var(--anod);color:var(--on-anod);border-radius:8px;padding:8px 14px;font-size:12.5px;
  font-weight:600;white-space:nowrap;min-height:36px}
.btn:hover{background:var(--anod-2)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--anod);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--anod);background:var(--anod-soft)}
.btn.sm{padding:5px 10px;font-size:11.5px;min-height:30px}
.btn.wide{width:100%;justify-content:center;text-align:center}
.empty-note{font-size:12.5px;color:var(--ink-3);line-height:1.5;padding:4px 0;margin:0}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{padding:11px 4px 12px;display:flex;align-items:center;justify-content:center;gap:5px;
  font-size:11.5px;font-weight:600;color:var(--ink-3)}
.tabs button[aria-selected="true"]{color:var(--anod)}
.badge{font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:700;padding:1px 5px;
  border-radius:999px;background:var(--sunk);color:var(--ink-2)}
.tabs button[aria-selected="true"] .badge{background:var(--anod-soft);color:var(--anod)}
.badge.rot{background:var(--bad);color:#fff}
@media (min-width:820px){.tabs{display:none}}
@media (max-width:819px){
  body[data-view="aufbau"]   #panel{display:none}
  body[data-view="befunde"]  #aufbau,body[data-view="befunde"]  #c-up,body[data-view="befunde"] #c-spar{display:none}
  body[data-view="upgrades"] #aufbau,body[data-view="upgrades"] #c-find{display:none}
}

.scrim{position:fixed;inset:0;background:rgba(8,12,15,.6);z-index:60;display:grid;place-items:end center}
.sheet{background:var(--surface);width:100%;max-width:820px;max-height:92dvh;
  border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:var(--shadow);animation:rise .18s ease}
@keyframes rise{from{transform:translateY(20px);opacity:.5}to{transform:none;opacity:1}}
@media (min-width:821px){.scrim{place-items:center}.sheet{border-radius:14px;max-height:86dvh}}
.sheet-h{padding:13px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex:none}
.sheet-h h3{font-size:16.5px;font-weight:700;margin-right:auto;min-width:0;line-height:1.2}
.sheet-h .sub{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;display:block;margin-bottom:2px}
.sheet-b{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px calc(20px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:7px}
.sheet-f{flex:none;border-top:1px solid var(--line);padding:11px 14px calc(11px + env(safe-area-inset-bottom,0px));
  display:flex;gap:9px;align-items:center;background:var(--surface)}
.filt{display:flex;gap:6px;padding:0 0 3px}
.filt button{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:11.5px;
  font-weight:600;color:var(--ink-2);white-space:nowrap}
.filt button[aria-pressed="true"]{border-color:var(--anod);background:var(--anod-soft);color:var(--anod)}

.opt{border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:start}
.opt.sel{border-color:var(--anod);background:var(--anod-soft)}
.opt-n{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  line-height:1.3;overflow-wrap:anywhere}
.opt-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.opt-p{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px}
.opt-g{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3)}
.why{grid-column:1 / -1;font-size:11.5px;line-height:1.45;padding:6px 9px;border-radius:7px;
  color:var(--bad);background:var(--bad-soft);overflow-wrap:anywhere}
.why.w{color:var(--warn);background:var(--warn-soft)}
.why code{font-family:"IBM Plex Mono",monospace;font-size:10.5px}
.aff{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;
  color:var(--anod);text-decoration:none;white-space:nowrap}
.aff:hover{text-decoration:underline}
.tag{font-size:9px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;padding:2px 5px;border-radius:4px;flex:none}
.tag.ok{background:var(--gut-soft);color:var(--gut)}
.tag.no{background:var(--bad-soft);color:var(--bad)}
.tag.w{background:var(--warn-soft);color:var(--warn)}
.tag.n{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line-soft)}
.tag.m{background:var(--anod-soft);color:var(--anod)}

.dis{border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;display:grid;
  grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;text-align:left;width:100%}
.dis[aria-pressed="true"]{border-color:var(--anod);background:var(--anod-soft)}
.box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;
  margin-top:1px;color:transparent}
.dis[aria-pressed="true"] .box{background:var(--anod);border-color:var(--anod);color:var(--on-anod)}
.dis-n{font-weight:700;font-size:14px;font-family:Archivo;letter-spacing:-.01em;display:block}
.dis-t{font-size:12px;color:var(--ink-2);line-height:1.4;margin-top:2px;display:block}
.mixbox{font-size:12.5px;line-height:1.5;padding:10px 12px;border-radius:9px;margin-top:2px}
.mixbox.ok{background:var(--gut-soft);color:var(--gut)}
.mixbox.w{background:var(--warn-soft);color:var(--warn)}
.mixbox.no{background:var(--bad-soft);color:var(--bad)}
.mixbox b{font-weight:700}

/* Assistent */
.steps{display:flex;gap:4px;flex:none;padding:0 14px 10px}
.steps i{height:3px;flex:1;border-radius:2px;background:var(--sunk)}
.steps i.on{background:var(--anod)}
.q{font-family:Archivo;font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.25;margin:0 0 3px}
.qs{font-size:12.5px;color:var(--ink-3);line-height:1.45;margin:0 0 12px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:7px}
.qopt{border:1px solid var(--line);border-radius:10px;padding:11px 10px;text-align:center;
  font-weight:600;font-size:13.5px;min-height:48px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;line-height:1.2}
.qopt small{font-size:10.5px;color:var(--ink-3);font-weight:500;display:block}
.qopt[aria-pressed="true"]{border-color:var(--anod);background:var(--anod-soft);color:var(--anod)}
.qopt[aria-pressed="true"] small{color:var(--anod)}
.mrow{margin-bottom:14px}
.mrow > label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;display:block;margin-bottom:6px}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchips button{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12.5px;
  font-weight:600;color:var(--ink-2);min-height:34px}
.mchips button[aria-pressed="true"]{border-color:var(--anod);background:var(--anod-soft);color:var(--anod)}
.erg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;padding:8px 0;
  border-bottom:1px solid var(--line-soft);align-items:center}
.erg .k{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;grid-column:1}
.erg .n{font-size:13px;font-weight:600;grid-column:1;line-height:1.25;overflow-wrap:anywhere}
.erg .p{grid-column:2;grid-row:1 / span 2;font-family:"IBM Plex Mono",monospace;font-size:12.5px;
  font-weight:600;text-align:right;align-self:center}
.sumbox{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line-soft);
  border:1px solid var(--line-soft);border-radius:10px;overflow:hidden;margin:12px 0 4px}
.sumbox div{background:var(--surface);padding:9px 8px;text-align:center}
.sumbox b{display:block;font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;letter-spacing:-.02em}
.sumbox span{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}


/* ── Umschalter Traumrad / Mein Rad ── */
.modus{position:sticky;top:calc(env(safe-area-inset-top,0px) + 55px);z-index:36;
  background:var(--surface);border-bottom:1px solid var(--line);padding:7px 14px}
.modus-in{max-width:1180px;margin:0 auto;display:flex;background:var(--sunk);border-radius:9px;padding:3px;gap:3px}
.modus-in button{flex:1;padding:7px 8px;border-radius:7px;font-size:12.5px;font-weight:600;
  color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px;min-height:34px}
.modus-in button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.16)}
.bar{top:calc(env(safe-area-inset-top,0px) + 104px)}

/* Ein Thema je Baugruppe, mit einem Satz dazu, was es am Rad entscheidet.
   Vorher lagen Rahmen, Gabel und Daempfer unter einer Ueberschrift -- drei
   Dinge, die nichts miteinander zu tun haben ausser der Nachbarschaft. */
const GRUPPEN = [
  {n:"Rahmen",    t:"Legt Laufradgröße, Achsmaße und Tretlager fest — und damit fast alles andere."},
  {n:"Fahrwerk",  t:"Federweg vorn und hinten. Muss zur Freigabe des Rahmens passen."},
  {n:"Laufräder", t:"Freilauf, Maulweite und Systemgewicht."},
  {n:"Reifen",    t:"Breite, Grip und Freiraum im Rahmen."},
  {n:"Antrieb",   t:"Schaltung und Kurbel — Freilauftyp und Kettenlinie müssen stimmen."},
  {n:"Bremsen",   t:"Kolbenzahl und Scheibengröße."},
  {n:"Cockpit",   t:"Lenker und Vorbau. Die Klemmung muss zueinander passen."},
  {n:"Sitz",      t:"Sattelstütze und Sattel."}
];
const quelleOf = s => s.quelle || s.k;
const slotOf = k => SLOTS.find(x => x.k === k);
const findeTeil = (slotKey, id) => {
  const s = slotOf(slotKey);
  if(!s) return null;
  return K[quelleOf(s)].find(t => t.id === id) || null;
};
function entfaellt(b, slotKey){
  const r = b.rahmen ? findeTeil("rahmen", b.rahmen) : null;
  if(r && r.ohne && r.ohne.indexOf(slotKey) >= 0) return true;
  /* Singlespeed und Trial fahren eine feste Uebersetzung -- Hebel und
     Schaltwerk gibt es dort schlicht nicht. */
  if(slotKey === "schalthebel" || slotKey === "schaltwerk"){
    const ka = b.kassette ? findeTeil("kassette", b.kassette) : null;
    if(ka && ka.gaenge === 1) return true;
  }
  return false;
}

  bremsen:"b-xt", lenker:"l-race", vorbau:"v-race", stuetze:"s-fox349", sattel:"sa-ergon"
};
const PLAN_START = {budget:0, fahrer:0, mSchalt:"", mBrems:"", mFed:"", prio:"pl"};
/* Was ein gebrauchtes Rad wert ist, haengt an vier Dingen: was neu drin steckt,
   wie alt es ist, in welchem Zustand, und was an Verschleiss sofort faellig wird. */
const MARKT_START = {alter:3, zustand:"gepflegt", verschleiss:{}, preis:0};
const ALTERSSTUFEN = [
  {v:0,   l:"Neu"},      {v:1, l:"1 Jahr"},   {v:2, l:"2 Jahre"}, {v:3, l:"3 Jahre"},
  {v:4.5, l:"4–5 Jahre"},{v:7, l:"6–8 Jahre"},{v:10, l:"9 Jahre +"}
];
const ZUSTAENDE = [
  {v:"neuwertig",  l:"Neuwertig",  f:1.12, t:"kaum Spuren, alles läuft"},
  {v:"gepflegt",   l:"Gepflegt",   f:1.00, t:"normale Spuren, gewartet"},
  {v:"gebraucht",  l:"Gebraucht",  f:0.85, t:"sichtbar gefahren, Kleinigkeiten"},
  {v:"abgeritten", l:"Abgeritten", f:0.65, t:"deutliche Spuren, Service überfällig"}
];
const VERSCHLEISS = [
  {k:"antrieb", l:"Kette und Kassette fällig",     kosten:150},
  {k:"reifen",  l:"Reifen abgefahren",             kosten:150},
  {k:"belaege", l:"Bremsbeläge und Scheiben runter", kosten:90},
  {k:"service", l:"Gabel- oder Dämpferservice fällig", kosten:240},
  {k:"lager",   l:"Lager haben Spiel",             kosten:160}
];
/* Die Shops mit ihrer echten Suchadresse und dem Netzwerk, ueber das sie
   abgerechnet werden. Die Advertiser-Kennung traegt der Nutzer ein -- sie steht
   in seinem Netzwerkkonto beim jeweiligen Partnerprogramm. Erfinden waere
   fatal: eine falsche Kennung fuehrt ins Leere oder schreibt den Umsatz einem
   fremden Konto gut. */
const SHOPS = [
  {id:"bc",   name:"bike-components", netz:"awin",   suche:"https://www.bike-components.de/de/s/?keywords={q}"},
  {id:"b24",  name:"Bike24",          netz:"awin",   suche:"https://www.bike24.de/search?q={q}"},
  {id:"bd",   name:"Bike-Discount",   netz:"awin",   suche:"https://www.bike-discount.de/de/search?sSearch={q}"},
  {id:"rose", name:"Rose Bikes",      netz:"awin",   suche:"https://www.rosebikes.de/search?q={q}"},
  {id:"amz",  name:"Amazon.de",       netz:"amazon", suche:"https://www.amazon.de/s?k={q}"}
];
const AFF_START = {
  awinId: "",                                   /* Publisher-ID bei Awin */
  amazonTag: "",                                /* PartnerNet-Tag */
  mid: {},                                      /* Shop -> Advertiser-ID */
  an: {bc:true, b24:true, bd:false, rose:false, amz:false}
};

/* Zwei Raeder nebeneinander: das Traumrad, das man sich zusammenstellt, und das
   echte, das in der Garage steht. Beide durchlaufen dieselbe Engine -- nur die
   Frage ist eine andere: "Was baue ich?" gegen "Was habe ich und was lohnt sich?" */
const leerBau = () => { const o = {}; for(const s of SLOTS) o[s.k] = null; return o; };
let builds = {traum:{...START}, real:leerBau(), markt:leerBau()};
let modus = "traum";
let zuGeklappt = {};   /* Themen, die der Nutzer eingeklappt hat */
let fotoZiel = null;   /* worauf sich die naechste Dateiauswahl bezieht */
/* Produktfeed des Partnerprogramms: Bild-URL, Preis und Direktlink je Teil.
   Diese Bilder sind zur Anzeige freigegeben -- anders als Fotos, die man sich
   von einer Shopseite zieht. Gespeichert wird nur, was zu unseren Teilen passt:
   rund neunzig Zeilen statt hunderttausend. */
let feed = {treffer:{}, stand:0, quelle:"", zeilen:0};
let fotos = {traum:null, real:null, markt:null};
let build = builds[modus];
const setzeBau = o => { builds[modus] = o; build = o; };
function wechsle(m){ builds[modus] = build; modus = m; build = builds[modus]; }
let sel = ["trail"];
let plan = {...PLAN_START};
let markt = {...MARKT_START};
let aff = JSON.parse(JSON.stringify(AFF_START));
let view = "aufbau";
let nurPassende = true;
let offenerSlot = null;

function laden(){
  try{
    const bs = localStorage.getItem("mtb.builds");
    if(bs){
      const p = JSON.parse(bs);
      if(p && p.traum) builds.traum = {...START, ...p.traum};
      if(p && p.real)  builds.real  = {...leerBau(), ...p.real};
      if(p && p.markt) builds.markt = {...leerBau(), ...p.markt};
    } else {
      const alt1 = localStorage.getItem("mtb.build");   /* Fassung vor dem Umbau */
      if(alt1){ const p = JSON.parse(alt1); if(p && typeof p === "object") builds.traum = {...START, ...p}; }
    }
    const md = localStorage.getItem("mtb.modus");
    if(md === "real" || md === "traum" || md === "markt") modus = md;
    const zg = localStorage.getItem("mtb.zu");
    if(zg){ const q = JSON.parse(zg); if(q && typeof q === "object") zuGeklappt = q; }
    const fd = localStorage.getItem("mtb.feed");
    if(fd){ const q = JSON.parse(fd); if(q && q.treffer) feed = q; }
    const ft = localStorage.getItem("mtb.fotos");
    if(ft){ const p = JSON.parse(ft); if(p && typeof p === "object") fotos = {traum:p.traum||null, real:p.real||null}; }
    build = builds[modus];
    const s = localStorage.getItem("mtb.sel");
    if(s){ const p = JSON.parse(s); if(Array.isArray(p)) sel = p.filter(x => DID.indexOf(x) >= 0); }
    if(!sel.length) sel = ["trail"];
    const mk = localStorage.getItem("mtb.markt");
    if(mk){ const q = JSON.parse(mk); if(q && typeof q === "object") markt = {...MARKT_START, ...q, verschleiss:{...(q.verschleiss||{})}}; }
    const pl = localStorage.getItem("mtb.plan");
    if(pl){ const p = JSON.parse(pl); if(p && typeof p === "object") plan = {...PLAN_START, ...p}; }
    const a = localStorage.getItem("mtb.aff");
    if(a){
      const q = JSON.parse(a);
      if(q && !Array.isArray(q) && typeof q === "object")
        aff = {...AFF_START, ...q, mid:{...(q.mid||{})}, an:{...AFF_START.an, ...(q.an||{})}};
    }
  }catch(e){ /* privates Fenster oder blockierter Speicher */ }
}
function sichern(){
  try{
    builds[modus] = build;
    localStorage.setItem("mtb.builds", JSON.stringify(builds));
    localStorage.setItem("mtb.modus", modus);
    localStorage.setItem("mtb.feed", JSON.stringify(feed));
    localStorage.setItem("mtb.zu", JSON.stringify(zuGeklappt));
    localStorage.setItem("mtb.sel", JSON.stringify(sel));
    localStorage.setItem("mtb.plan", JSON.stringify(plan));
    localStorage.setItem("mtb.markt", JSON.stringify(markt));
    localStorage.setItem("mtb.aff", JSON.stringify(aff));
  }catch(e){}
  try{
    localStorage.setItem("mtb.fotos", JSON.stringify(fotos));
  }catch(e){
    /* Bilderspeicher voll: lieber das Foto verwerfen als den ganzen Aufbau verlieren */
    fotos[modus] = null;
    try{ localStorage.setItem("mtb.fotos", JSON.stringify(fotos)); }catch(e2){}
  }
}

/* ═══════════ 5 · Engine ═══════════ */

const F = (t,x,sl,txt) => ({level:"fehler",  titel:t, text:txt, slots:sl, fixSlot:x});
const W = (t,x,sl,txt) => ({level:"warnung", titel:t, text:txt, slots:sl, fixSlot:x});
const H = (t,x,sl,txt) => ({level:"hinweis", titel:t, text:txt, slots:sl, fixSlot:x});
const hat = d => sel.indexOf(d) >= 0;
const selNamen = () => sel.map(dLang).join(" + ");

function sollKettenlinie(rahmen, schaltwerk){
  if(!rahmen) return null;
  if(rahmen.klSoll != null) return rahmen.klSoll;
  if(rahmen.ha === "157x12") return 56.5;
  if(rahmen.ha === "142x12") return 49;
  if(rahmen.ha === "135x10") return 47;
  return schaltwerk && schaltwerk.iface === "T-Type" ? 55 : 52;
}

function pruefe(b){
  const t = {};
  for(const s of SLOTS) t[s.k] = b[s.k] ? findeTeil(s.k, b[s.k]) : null;
  const out = [];
  const rahmen = t.rahmen, gabel = t.gabel, daempfer = t.daempfer, laufraeder = t.laufraeder,
        reifenVR = t.reifenVR, reifenHR = t.reifenHR, kurbel = t.kurbel,
        schalthebel = t.schalthebel, schaltwerk = t.schaltwerk, kassette = t.kassette, kette = t.kette,
        bremsen = t.bremsen, lenker = t.lenker, vorbau = t.vorbau, stuetze = t.stuetze;

  if(sel.length > 1){
    const mp = mixPaar(sel);
    if(mp.min < .15) out.push(F("Diese Mischung gibt es nicht als ein Rad","",[],
      `<code>${dLang(mp.paar[0])}</code> und <code>${dLang(mp.paar[1])}</code> teilen sich praktisch kein Bauteil — andere Laufradgröße, anderer Federweg, andere Sitzposition. Zwei Räder, kein Kompromiss.`));
    else if(mp.min < .40) out.push(W("Weiter Spagat zwischen den Disziplinen","",[],
      `<code>${dLang(mp.paar[0])}</code> und <code>${dLang(mp.paar[1])}</code> ziehen stark auseinander. Machbar, aber jedes Teil wird ein Kompromiss — der Charakter-Wert wird nie hoch. Das ist kein Fehler im Aufbau, sondern im Plan.`));
  }

  if(rahmen && gabel){
    if(gabel.schaft !== rahmen.schaft){
      const nm = x => x === "tapered" ? "konisch (tapered)" : x === "gerade" ? "1 1/8″ gerade" : "Doppelbrücke";
      out.push(F("Gabelschaft passt nicht ins Steuerrohr","gabel",["rahmen","gabel"],
        `Rahmen <code>${nm(rahmen.schaft)}</code>, Gabel <code>${nm(gabel.schaft)}</code>. ${gabel.schaft === "dc" ? "Eine Doppelbrückengabel braucht einen Rahmen mit DH-Freigabe — kein Adapterfall." : rahmen.schaft === "tapered" ? "Ein gerader Schaft lässt sich mit passendem Steuersatz-Unterteil oft fahren, aber nicht mit jedem Rahmen. Beim Hersteller prüfen." : "Ein konischer Schaft passt nicht in ein gerades Steuerrohr."}`));
    }
    if(rahmen.maxGabel === 0 && gabel.travel > 0){
      out.push(F("Dieser Rahmen ist für eine Starrgabel gebaut","gabel",["rahmen","gabel"],
        `<code>${rahmen.n}</code> hat keine Federgabelfreigabe. ${gabel.travel} mm verändern Lenkwinkel und Tretlagerhöhe so stark, dass das Rad seine Eigenschaft verliert — bei Trial ist genau die der Zweck.`));
    } else if(gabel.travel > rahmen.maxGabel){
      out.push(F("Zu viel Federweg für die Rahmenfreigabe","gabel",["rahmen","gabel"],
        `Freigegeben <code>${rahmen.maxGabel} mm</code>, verbaut <code>${gabel.travel} mm</code> — ${gabel.travel - rahmen.maxGabel} mm zu viel. Der Lenkwinkel flacht um rund ${((gabel.travel - rahmen.maxGabel)/20*0.5).toFixed(1)}° ab, das Steuerrohr sieht höhere Hebelkräfte, und die Garantie ist weg.`));
    } else if(rahmen.maxGabel > 0 && rahmen.maxGabel - gabel.travel >= 20){
      out.push(H("Federweg unter der Rahmenfreigabe","gabel",["rahmen","gabel"],
        `Der Rahmen kann <code>${rahmen.maxGabel} mm</code>, verbaut sind <code>${gabel.travel} mm</code>. Funktioniert, macht die Geometrie aber steiler und kürzer als gedacht.`));
    }
    if(!gabel.lr.includes(rahmen.lrV)) out.push(F("Gabel nicht für diese Laufradgröße","gabel",["rahmen","gabel"],
      `Vorn läuft <code>${rahmen.lrV}″</code>, die Gabel ist für <code>${gabel.lr.join("″ / ")}″</code> freigegeben.`));
  }

  if(rahmen){
    if(!rahmen.daempfer && daempfer) out.push(F("Dieser Rahmen hat keine Dämpferaufnahme","daempfer",["rahmen","daempfer"],
      `<code>${rahmen.n}</code> ist hinten ungefedert. Den Dämpfer aus dem Aufbau nehmen.`));
    else if(rahmen.daempfer && !daempfer) out.push(F("Dämpfer fehlt","daempfer",["daempfer"],
      `Der Rahmen braucht <code>${rahmen.daempfer.el} × ${rahmen.daempfer.hub} mm</code> in <code>${rahmen.daempfer.typ}</code>-Aufnahme.`));
    else if(rahmen.daempfer && daempfer){
      if(daempfer.el !== rahmen.daempfer.el || daempfer.typ !== rahmen.daempfer.typ)
        out.push(F("Dämpfer-Einbaumaß passt nicht","daempfer",["rahmen","daempfer"],
          `Der Rahmen verlangt <code>${rahmen.daempfer.el} × ${rahmen.daempfer.hub} mm ${rahmen.daempfer.typ}</code>, der Dämpfer liefert <code>${daempfer.el} × ${daempfer.hub} mm ${daempfer.typ}</code>. Einbaulänge und Aufnahmeart sind beide hart.`));
      else if(daempfer.hub !== rahmen.daempfer.hub)
        out.push(W("Abweichender Hub","daempfer",["rahmen","daempfer"],
          `Einbaulänge stimmt, der Hub weicht ab: <code>${rahmen.daempfer.hub} mm</code> gegen <code>${daempfer.hub} mm</code>. Bei mehr Hub schlägt der Hinterbau womöglich am Sitzrohr an, bei weniger fehlt Federweg.`));
    }
  }

  if(rahmen && laufraeder){
    if(laufraeder.lrV !== rahmen.lrV || laufraeder.lrH !== rahmen.lrH)
      out.push(F("Laufradgrößen passen nicht zum Rahmen","laufraeder",["rahmen","laufraeder"],
        `Der Rahmen ist auf <code>${rahmen.lrV}″ vorn / ${rahmen.lrH}″ hinten</code> ausgelegt, der Satz bringt <code>${laufraeder.lrV}″ / ${laufraeder.lrH}″</code>.`));
    if(laufraeder.ha !== rahmen.ha)
      out.push(F("Hinterachse passt nicht","laufraeder",["rahmen","laufraeder"],
        `Rahmen <code>${rahmen.ha}</code> gegen Laufrad <code>${laufraeder.ha}</code>. Einbaubreite ist ein hartes Maß — das bräuchte eine andere Nabe, nicht nur Endkappen.`));
  }
  if(gabel && laufraeder && laufraeder.va !== gabel.va)
    out.push(F("Vorderachse passt nicht","laufraeder",["gabel","laufraeder"],
      `Gabel <code>${gabel.va}</code> gegen Vorderrad <code>${laufraeder.va}</code>. Endkappen lassen sich manchmal tauschen, der Achsdurchmesser nie.`));
  if(kassette && laufraeder && laufraeder.freilauf !== kassette.freilauf){
    const tr = kassette.freilauf.indexOf("Trial") === 0 || laufraeder.freilauf.indexOf("Trial") === 0;
    out.push(F("Freilaufkörper passt nicht zur Kassette","laufraeder",["laufraeder","kassette"],
      `Der Laufradsatz hat <code>${laufraeder.freilauf}</code>, die Kassette braucht <code>${kassette.freilauf}</code>. ${tr ? "Bei Trial sitzt der Freilauf in der Kurbel, die Nabe trägt ein festes Ritzel — anderes Bauprinzip, kein Tauschteil." : "Bei DT Swiss, Hope und Newmen ist der Freilaufkörper einzeln tauschbar (60–110 €) — muss aber bewusst mitbestellt werden."}`));
  }
  if(laufraeder && (hat("enduro") || hat("dh") || hat("dirt") || hat("slope")) && laufraeder.maxSys < 120)
    out.push(W("Laufradsatz nicht für diesen Einsatz freigegeben","laufraeder",["laufraeder"],
      `Systemgewicht <code>${laufraeder.maxSys} kg</code>, keine Gravity-Freigabe. Für ${selNamen()} ist das zu wenig Felge — Speichenbrüche und Dellen sind dann keine Pechsträhne, sondern Statistik.`));
  if(laufraeder && plan.fahrer > 0){
    let radG = 0;
    for(const s of SLOTS){ const x = t[s.k]; if(x) radG += x.g || 0; }
    const rad = Math.round(radG/1000) + 2;
    const sys = plan.fahrer + rad + 3;
    if(sys > laufraeder.maxSys)
      out.push(F("Systemgewicht über der Laufrad-Freigabe","laufraeder",["laufraeder"],
        `Bei <code>${plan.fahrer} kg</code> Fahrergewicht plus rund <code>${rad} kg</code> Rad und 3 kg Ausrüstung liegst du bei <code>${sys} kg</code> — freigegeben sind <code>${laufraeder.maxSys} kg</code>. Das ist der häufigste Grund für gerissene Speichennippel, und im Garantiefall schaut der Hersteller genau hier hin.`));
  }

  const rc = (reifen, pos, slotKey, groesse, maxBreite, quelle) => {
    if(!reifen || !groesse) return;
    if(!reifen.groessen.includes(groesse))
      out.push(F(`Reifen ${pos} in ${groesse}″ nicht lieferbar`, slotKey, [slotKey, quelle],
        `Das Modell gibt es in <code>${reifen.groessen.join("″, ")}″</code>, gebraucht wird <code>${groesse}″</code>.`));
    if(maxBreite != null && maxBreite > 0){
      if(reifen.breite > maxBreite)
        out.push(F(`Reifen ${pos} zu breit`, slotKey, [slotKey, quelle],
          `<code>${reifen.breite} mm</code> auf <code>max. ${maxBreite} mm</code> Freiraum. Bei Einfederung und Schlamm schleift das — im Hinterbau bremst es dich schlagartig aus.`));
      else if(maxBreite - reifen.breite < 3)
        out.push(W(`Wenig Freiraum am Reifen ${pos}`, slotKey, [slotKey, quelle],
          `<code>${reifen.breite} mm</code> bei <code>${maxBreite} mm</code> Freigabe lassen ${maxBreite - reifen.breite} mm Luft. Trocken geht das, bei Matsch setzt es sich zu.`));
    }
    if(laufraeder && (laufraeder.iw < reifen.iw[0] || laufraeder.iw > reifen.iw[1]))
      out.push(W(`Felgenmaulweite passt nicht zum Reifen ${pos}`, slotKey, [slotKey,"laufraeder"],
        `Empfohlen <code>${reifen.iw[0]}–${reifen.iw[1]} mm</code> Innenweite, die Felge hat <code>${laufraeder.iw} mm</code>. ${laufraeder.iw < reifen.iw[0] ? "Zu schmal heißt: der Reifen wird glühbirnenförmig und walkt in Kurven weg." : "Zu breit heißt: flaches Profil, die Seitenstollen greifen zu spät."}`));
  };
  rc(reifenVR, "vorn", "reifenVR", rahmen ? rahmen.lrV : null, gabel ? gabel.maxReifen : null, "gabel");
  rc(reifenHR, "hinten", "reifenHR", rahmen ? rahmen.lrH : null, rahmen ? rahmen.maxReifen : null, "rahmen");
  if(reifenVR && reifenHR && !hat("trial") && reifenVR.grip < reifenHR.grip - 0.4)
    out.push(W("Vorderreifen greift schwächer als der hintere","reifenVR",["reifenVR","reifenHR"],
      `Vorn <code>${reifenVR.n}</code>, hinten <code>${reifenHR.n}</code>. Wegrutschen vorn endet im Sturz, hinten nur im Drift — deshalb gehört der griffigere Reifen nach vorn.`));

  if(rahmen && schaltwerk && schaltwerk.udhPflicht && !rahmen.udh)
    out.push(F("Transmission braucht ein UDH-Ausfallende","schaltwerk",["rahmen","schaltwerk"],
      `SRAM Transmission wird direkt am Rahmen verschraubt und setzt <code>UDH</code> voraus. <code>${rahmen.n}</code> hat keines — auch nicht mit Adapter.`));

  /* Schalthebel und Schaltwerk muessen aus einem System stammen: Shimano und
     SRAM ziehen pro Klick unterschiedlich viel Seil. Gemischt trifft kein
     einziger Gang sauber -- das laesst sich auch nicht einstellen. */
  if(schalthebel && schaltwerk && schalthebel.iface !== schaltwerk.iface)
    out.push(F("Schalthebel und Schaltwerk aus verschiedenen Systemen","schaltwerk",["schalthebel","schaltwerk"],
      `Hebel <code>${schalthebel.iface}</code>, Schaltwerk <code>${schaltwerk.iface}</code>. Das Zugverhältnis ist je System anders — die Gänge lassen sich nicht sauber einstellen, egal wie lange man dreht.${schalthebel.iface === "T-Type" || schaltwerk.iface === "T-Type" ? " Transmission schaltet ohnehin elektronisch und nur mit dem eigenen Bedienteil." : ""}`));

  /* Gaenge quer durch den Antrieb */
  const gTeile = [["schalthebel", schalthebel, "Schalthebel"], ["schaltwerk", schaltwerk, "Schaltwerk"],
                  ["kassette", kassette, "Kassette"], ["kette", kette, "Kette"]]
                 .filter(x => x[1] && !entfaellt(b, x[0]));
  if(gTeile.length > 1){
    const gs = [...new Set(gTeile.map(x => x[1].gaenge))];
    if(gs.length > 1)
      out.push(F("Gangzahlen passen nicht zusammen","kassette", gTeile.map(x => x[0]),
        `${gTeile.map(x => x[2] + " <code>" + (x[1].gaenge === 1 ? "Singlespeed" : x[1].gaenge + "-fach") + "</code>").join(", ")}. Ritzelabstand und Kettenbreite sind je Gangzahl anders — das schaltet nicht, das rasselt.`));
  }
  if(schaltwerk && kassette && kassette.spanne[1] > schaltwerk.maxRitzel)
    out.push(F("Schaltwerk reicht nicht über die Kassette","schaltwerk",["schaltwerk","kassette"],
      `Das Schaltwerk ist bis <code>${schaltwerk.maxRitzel} Zähne</code> freigegeben, die Kassette hat <code>${kassette.spanne[1]}</code>. Auf dem größten Ritzel schlägt das Schaltwerk an oder reißt ab.`));
  if(kette && schaltwerk && kette.iface && kette.iface !== schaltwerk.iface)
    out.push(F("Kette passt nicht zum Schaltwerk","kette",["kette","schaltwerk"],
      `<code>${kette.n}</code> ist eine Flattop-Kette und läuft nur in einer Transmission. Am <code>${schaltwerk.iface}</code>-Schaltwerk hat sie die falsche Form.`));
  if(kette && schaltwerk && !kette.iface && schaltwerk.iface === "T-Type")
    out.push(F("Transmission braucht die Flattop-Kette","kette",["kette","schaltwerk"],
      `SRAM Transmission läuft ausschließlich mit der eigenen Flattop-Kette. Eine normale 12-fach-Kette greift in die Ritzel nicht richtig ein.`));

  if(kassette && kurbel && kassette.gaenge !== kurbel.gaenge)
    out.push(W("Kurbel und Kassette aus verschiedenen Welten","kurbel",["kassette","kurbel"],
      `Kassette <code>${kassette.gaenge === 1 ? "Singlespeed" : kassette.gaenge + "-fach"}</code>, Kurbel für <code>${kurbel.gaenge === 1 ? "Singlespeed" : kurbel.gaenge + "-fach"}</code>. Die Zahnprofile sind auf andere Kettenbreiten optimiert — mehr Verschleiß und Abwurf unter Last.`));
  if(schaltwerk && kurbel && kurbel.kb > schaltwerk.maxKB)
    out.push(W("Kettenblatt größer als vom Schaltwerk verdaut","kurbel",["schaltwerk","kurbel"],
      `<code>${kurbel.kb} Zähne</code> bei einer Freigabe von <code>${schaltwerk.maxKB}</code>. Auf dem größten Ritzel wird die Kette knapp und das Schaltwerk steht auf Anschlag.`));
  if(rahmen && kurbel){
    const soll = sollKettenlinie(rahmen, schaltwerk);
    if(soll != null && Math.abs(kurbel.kl - soll) > 1.5){
      const lvl = Math.abs(kurbel.kl - soll) > 3 ? F : W;
      out.push(lvl("Kettenlinie stimmt nicht","kurbel",["rahmen","kurbel","schaltwerk"],
        `Der Hinterbau <code>${rahmen.ha}</code>${schaltwerk && schaltwerk.iface === "T-Type" ? " mit Transmission" : ""} verlangt <code>${soll} mm</code> Kettenlinie, die Kurbel liefert <code>${kurbel.kl} mm</code>. Die Kette läuft dauerhaft schräg: Rasseln, Abwurf, sichtbarer Verschleiß nach wenigen hundert Kilometern.`));
    }
    const bbTxt = {BSA73:"BSA 73 mm (geschraubt)", BSA68:"BSA 68 mm (geschraubt)", PF92:"PressFit 92 mm (eingepresst)"}[rahmen.bb] || rahmen.bb;
    out.push(H("Passendes Innenlager mitbestellen","kurbel",["rahmen","kurbel"],
      `<code>${bbTxt}</code> trifft auf eine <code>${kurbel.iface}</code>-Welle. Passt zusammen, aber nur mit dem richtigen Lager — und das liegt bei den meisten Kurbeln nicht bei (25–90 €).`));
  }
  if(hat("trial") && sel.length === 1 && kassette && kassette.gaenge > 1)
    out.push(W("Kein Trial-Antrieb","kassette",["kassette"],
      `Trial fährt eine feste Übersetzung um <code>18:12</code> mit dem Freilauf in der Kurbel — das erlaubt Kurbelstellung halten und Rückwärtstreten. Ein Schaltwerk ist dort Ballast und bricht beim ersten Pedal Kick.`));

  if(bremsen){
    if(bremsen.mount === "Felge"){
      if(rahmen && !rahmen.felgenbremse) out.push(F("Rahmen hat keine Bremssockel","bremsen",["rahmen","bremsen"],
        `Eine Felgenbremse braucht Sockel am Hinterbau. <code>${rahmen.n}</code> ist nur für Scheibenbremsen gebaut.`));
      if(laufraeder && !laufraeder.felgenbremse) out.push(F("Felgen ohne Bremsflanke","bremsen",["laufraeder","bremsen"],
        `<code>${laufraeder.n}</code> hat keine Bremsflanke. Trial-Felgenbremsen brauchen zusätzlich eine gezahnte oder gefräste Flanke, sonst fehlt der Biss.`));
    } else {
      if(rahmen && bremsen.sH > rahmen.maxScheibeHR) out.push(F("Bremsscheibe hinten zu groß","bremsen",["rahmen","bremsen"],
        `Der Rahmen ist bis <code>${rahmen.maxScheibeHR} mm</code> freigegeben, die Bremse kommt mit <code>${bremsen.sH} mm</code>. Größere Scheiben hebeln am Hinterbau.`));
      if(gabel && bremsen.sV > gabel.maxScheibeVR) out.push(F("Bremsscheibe vorn zu groß für die Gabel","bremsen",["gabel","bremsen"],
        `Gabelfreigabe <code>${gabel.maxScheibeVR} mm</code>, montiert werden sollen <code>${bremsen.sV} mm</code>.`));
      if(laufraeder && laufraeder.naben !== bremsen.mount) out.push(H("Scheibenaufnahme abweichend","bremsen",["laufraeder","bremsen"],
        `Naben in <code>${laufraeder.naben}</code>, die Bremse kommt üblich mit <code>${bremsen.mount}</code>-Scheiben. Kein Problem — du brauchst nur Scheiben in der passenden Aufnahme (25–60 € je Scheibe).`));
    }
    if((hat("enduro") || hat("dh")) && bremsen.kolben === 2)
      out.push(W("Zwei Kolben für diesen Einsatz","bremsen",["bremsen"],
        `Bei ${selNamen()} fadet eine 2-Kolben-Bremse auf langen Abfahrten spürbar. Kein Montagefehler, aber die erste Stelle, an der es unangenehm wird.`));
  }

  if(lenker && vorbau && lenker.klemm !== vorbau.klemm)
    out.push(F("Lenkerklemmung passt nicht zum Vorbau","vorbau",["lenker","vorbau"],
      `Lenker <code>${lenker.klemm} mm</code>, Vorbau <code>${vorbau.klemm} mm</code>. Ein 35er Lenker geht nicht in eine 31,8er Klemmung, und andersherum reißt es den Lenker heraus.`));
  if(gabel && vorbau && gabel.schaft === "dc" && vorbau.laenge > 60)
    out.push(H("Doppelbrücke mit langem Vorbau","vorbau",["gabel","vorbau"],
      `Doppelbrückengabeln werden mit kurzen Direktmontage-Vorbauten gefahren. Alles über 60 mm macht das Vorderrad träge und den Fahrer kopflastig.`));
  if((hat("enduro") || hat("dh")) && vorbau && vorbau.laenge >= 60)
    out.push(H("Langer Vorbau für den Einsatzzweck","vorbau",["vorbau"],
      `<code>${vorbau.laenge} mm</code> schieben das Gewicht nach vorn. Im steilen Gelände willst du hinter dem Lenker stehen, nicht darüber.`));
  if(hat("xc") && sel.length === 1 && lenker && lenker.breite >= 790)
    out.push(H("Sehr breiter Lenker für XC","lenker",["lenker"],
      `<code>${lenker.breite} mm</code> geben Kontrolle, kosten Aerodynamik und passen nicht durch enge Waldpassagen.`));

  if(rahmen && stuetze && rahmen.stuetze != null){
    if(parseFloat(stuetze.d) !== rahmen.stuetze)
      out.push(F("Stützendurchmesser passt nicht","stuetze",["rahmen","stuetze"],
        `Sitzrohr <code>${rahmen.stuetze} mm</code>, Stütze <code>${stuetze.d} mm</code>. ${parseFloat(stuetze.d) < rahmen.stuetze ? "Eine Reduzierhülse gibt es, bei Dropperposts führt sie aber regelmäßig zu Verdrehen und Klemmen." : "Zu dick geht gar nicht — die Stütze passt schlicht nicht ins Rohr."}`));
    if(stuetze.einbau > rahmen.einsteck)
      out.push(F("Stütze lässt sich nicht weit genug versenken","stuetze",["rahmen","stuetze"],
        `Sie braucht <code>${stuetze.einbau} mm</code> Einstecktiefe, das Sitzrohr gibt <code>${rahmen.einsteck} mm</code> her — ${stuetze.einbau - rahmen.einsteck} mm zu wenig. ${stuetze.hub > 0 ? "Kürzerer Hub oder eine Stütze mit externer Verstellung." : "Eine kürzere Stütze nehmen."}`));
    else if(stuetze.hub > 0 && rahmen.einsteck - stuetze.einbau > 45){
      const mehr = Math.floor((rahmen.einsteck - stuetze.einbau)/30)*30;
      out.push(H("Mehr Hub wäre möglich","stuetze",["rahmen","stuetze"],
        `Es bleiben <code>${rahmen.einsteck - stuetze.einbau} mm</code> Reserve im Sitzrohr. Rechnerisch passt eine Stütze mit rund <code>${stuetze.hub + mehr} mm</code> Hub — mehr Absenkung kostet nichts an Fahrbarkeit.`));
    }
    if(stuetze.hub === 0 && (hat("trail") || hat("enduro")))
      out.push(W("Starre Stütze","stuetze",["stuetze"],
        `Bei ${selNamen()} ist eine versenkbare Stütze das wirksamste Bauteil pro Euro. Alles andere vorher zu optimieren ist die falsche Reihenfolge.`));
    if(stuetze.hub > 0 && (hat("dirt") || hat("slope")) && !hat("trail") && !hat("enduro"))
      out.push(W("Dropper im Dirtpark","stuetze",["stuetze"],
        `Im Dirt und Slopestyle fährst du die Stütze ganz unten und nie wieder hoch. Eine Dropper ist dort rund ${Math.max(0, stuetze.g - 190)} g Ballast, ein Hebel mehr am Lenker und ein Bauteil, das beim Sturz bricht.`));
  }

  const fehlend = SLOTS.filter(s => !b[s.k] && !entfaellt(b, s.k));
  const garNichts = fehlend.length === SLOTS.filter(s => !entfaellt(b, s.k)).length;
  if(fehlend.length && !garNichts) out.push(W("Aufbau unvollständig","",fehlend.map(s => s.k),
    `Offen: ${fehlend.map(s => "<code>" + s.label + "</code>").join(", ")}. Bewertet wird nur, was drin ist.`));
  return out;
}

/* ═══════════ 6 · Bewertung ═══════════ */

const ABZUG = {fehler:26, warnung:9, hinweis:2};
const eignung = t => { if(!t || !t.e) return 0; let s = 0; for(const d of sel) s += t.e[d] || 0; return s/sel.length; };

function bewerte(b){
  const funde = pruefe(b);
  let tech = 100;
  for(const f of funde) tech -= ABZUG[f.level];
  tech = Math.max(0, Math.min(100, tech));

  let sum = 0, gew = 0, schwach = null, schwachV = 99;
  let gewicht = 0, preis = 0, teile = 0, moeglich = 0;
  for(const s of SLOTS){
    if(entfaellt(b, s.k)) continue;
    moeglich++;
    const teil = b[s.k] ? findeTeil(s.k, b[s.k]) : null;
    if(!teil) continue;
    teile++; gewicht += teil.g || 0; preis += preisVon(teil);
    if(!teil.e) continue;
    const eig = eignung(teil);
    sum += eig * s.gew; gew += s.gew;
    if(eig < schwachV){ schwachV = eig; schwach = {slot:s, teil:teil, eig:eig}; }
  }
  const chara = gew ? Math.max(0, Math.round(sum/gew/5*100)) : 0;
  return {funde:funde, tech:Math.round(tech), chara:chara,
          gesamt:Math.round(tech*0.62 + chara*0.38),
          gewicht:gewicht, preis:preis, teile:teile, moeglich:moeglich, schwach:schwach};
}
const harteFehler = b => pruefe(b).filter(f => f.level === "fehler").length;
function echteFehler(b){
  return pruefe(b).filter(f => f.level === "fehler" &&
    f.slots.every(k => !SLOTS.some(s => s.k === k) || b[k] || entfaellt(b, k))).length;
}

function urteil(r){
  const zn = selNamen();
  /* Ein leeres Rad hat keinen Zustand, ueber den sich urteilen liesse. Vorher
     stand hier "Sauberer Aufbau" neben null Teilen -- eine Note fuer nichts. */
  if(r.teile === 0) return modus === "real"
    ? `Noch nichts eingetragen. <b>Fang beim Rahmen an.</b>`
    : `Noch keine Teile gewählt.`;
  const fehler = r.funde.filter(f => f.level === "fehler").length;
  if(fehler > 1) return `<b>${fehler} Teile passen nicht zusammen.</b> So fährt das Rad nicht.`;
  if(fehler === 1) return `<b>Ein harter Konflikt.</b> Der muss weg, bevor du bestellst.`;
  if(plan.budget > 0 && r.preis > plan.budget) return `<b>${eur(r.preis - plan.budget)} über Budget.</b> Technisch sauber, aber zu teuer.`;
  if(r.chara < 55 && r.schwach) return `Technisch sauber, aber uneinig: <b>${r.schwach.slot.label}</b> zieht in eine andere Richtung als ${zn}.`;
  if(r.tech < 90) return `Fahrbar, mit Kompromissen. Die Befunde sagen welche.`;
  if(r.chara >= 85) return `<b>Stimmig.</b> Alles zieht in Richtung ${zn}.`;
  return `Sauberer Aufbau für ${zn}.`;
}

/* ═══════════ Gebrauchtwert ═══════════
   Ein Rad ist gebraucht selten mehr wert als die Summe seiner Teile, abgezinst
   um das Alter, korrigiert um den Zustand, minus dem, was der Käufer sofort
   nachkaufen muss. Genau so wird hier gerechnet -- kein Bauchgefühl, sondern
   die Teilepreise, die ohnehin im Katalog stehen.

   Die Kurve 0,13 + 0,72 · 0,76^Jahre bildet ab, was am Gebrauchtmarkt passiert:
   im ersten Jahr bricht rund ein Drittel weg, danach flacht es ab, und unter
   etwa 13 Prozent des Neupreises fällt ein fahrbares Rad praktisch nie. */
const restwertFaktor = a => 0.13 + 0.72 * Math.pow(0.76, a);
/* Die Summe der Einzelpreise ist NICHT der Preis eines Komplettrads. Hersteller
   zahlen fuer dieselben Teile als Erstausruestung einen Bruchteil des
   Ladenpreises und geben das weiter -- ein Rad, dessen Teile einzeln 6.500 Euro
   kosten, steht als Komplettrad fuer gut 4.500 im Laden. Ohne diesen Faktor
   haette die App jedes Angebot zu positiv bewertet. */
const KOMPLETTRAD = 0.72;

function marktWert(b){
  const r = bewerte(b);
  if(!r.teile) return null;
  const teileEinzeln = r.preis;
  const neu = Math.round(teileEinzeln * KOMPLETTRAD);
  const rw = restwertFaktor(markt.alter);
  const z = (ZUSTAENDE.find(x => x.v === markt.zustand) || ZUSTAENDE[1]).f;

  /* Veraltete Standards kosten am Gebrauchtmarkt mehr als ihr technischer
     Nachteil: wer kauft, denkt schon an die nächsten Ersatzteile. */
  const f = b.rahmen ? findeTeil("rahmen", b.rahmen) : null;
  const abzuege = [];
  if(f){
    const sportlich = (f.e.xc + f.e.trail + f.e.enduro + f.e.dh) > 0;
    if(sportlich && (f.lrV === "26" || f.lrH === "26"))
      abzuege.push({t:"26 Zoll", f:0.12, g:"Für 26″ gibt es kaum noch Gabeln und Auswahl bei Reifen."});
    if(sportlich && (f.ha === "142x12" || f.ha === "135x10"))
      abzuege.push({t:"kein Boost", f:0.08, g:"Vor-Boost-Hinterbau: aktuelle Laufräder und Kurbeln passen nicht ohne Weiteres."});
    if(sportlich && f.schaft === "gerade" && f.maxGabel > 0)
      abzuege.push({t:"gerades Steuerrohr", f:0.05, g:"Aktuelle Federgabeln haben konische Schäfte."});
  }
  let stdF = 1;
  for(const a of abzuege) stdF *= (1 - a.f);

  let vsRoh = 0; const vsListe = [];
  for(const v of VERSCHLEISS) if(markt.verschleiss[v.k]){ vsRoh += v.kosten; vsListe.push(v); }

  const basis = neu * rw * z * stdF;
  /* Verschleiss wird gedeckelt. In ein sieben Jahre altes Rad baut niemand
     Neuteile zum Ladenpreis -- ungedeckelt kam hier rechnerisch ein Wert von
     null heraus, obwohl das Rad faehrt und allein die Teile noch Geld bringen.
     Darunter liegt ein Boden: ein komplettes, rollendes Rad ist nie wertlos. */
  const deckel = basis * 0.45;
  const vs = Math.min(vsRoh, deckel);
  const gedeckelt = vsRoh > deckel;
  const wert = Math.max(Math.round(neu * 0.08), Math.round(basis - vs));
  return {teileEinzeln:teileEinzeln, neu:neu, rw:rw, z:z, stdF:stdF, gedeckelt:gedeckelt,
          abzuege:abzuege, vs:Math.round(vs), vsRoh:vsRoh, vsListe:vsListe,
          basis:Math.round(basis), wert:wert,
          unten:Math.round(wert*0.85), oben:Math.round(wert*1.15), befunde:r.funde};
}

function preisUrteil(preis, m){
  const q = m.wert > 0 ? preis / m.wert : 99;
  if(q <= 0.70) return {k:"schnaeppchen", kopf:"Schnäppchen",
    txt:"Deutlich unter dem, was die Teile gebraucht wert sind. Wenn der Zustand stimmt, zuschlagen — aber vorher ansehen."};
  if(q <= 0.88) return {k:"gut", kopf:"Guter Preis",
    txt:"Unter Marktwert. Bei dem Preis lohnt sich die Anfahrt."};
  if(q <= 1.12) return {k:"fair", kopf:"Marktüblich",
    txt:"Im normalen Rahmen. Handeln kann sich lohnen, ein Schnäppchen ist es nicht."};
  if(q <= 1.35) return {k:"teuer", kopf:"Zu teuer",
    txt:"Über dem, was die Teile hergeben. Entweder runterhandeln oder weitersuchen."};
  return {k:"schlecht", kopf:"Deutlich überteuert",
    txt:"Der Preis hat mit dem Wert der Teile nichts mehr zu tun. Finger weg oder hart verhandeln."};
}

/* ═══════════ Gleiche Maße, weniger Geld ═══════════
   Was an einem Bauteil das Maß ist, haengt vom Bauteil ab. Bei einem Vorbau
   sind es Klemmung und Laenge, bei einem Daempfer Einbaulaenge und Hub, bei
   einem Laufradsatz Achsen und Freilauf. "hart" muss exakt stimmen, sonst passt
   es schlicht nicht. "weich" darf abweichen -- 20 mm Lenkerbreite merkt man,
   aber sie machen das Teil nicht unbrauchbar. Jede weiche Abweichung wird
   angezeigt, damit niemand blind tauscht. */
const MASSE = {
  rahmen:     {hart:["lrV","lrH","schaft","ha","bb","stuetze","udh"], weich:{maxGabel:["mm Gabelfreigabe",10], einsteck:["mm Einstecktiefe",15]}},
  gabel:      {hart:["schaft","va"], weich:{travel:["mm Federweg",10], offset:["mm Offset",6]}},
  daempfer:   {hart:["el","hub","typ"], weich:{}},
  laufraeder: {hart:["lrV","lrH","va","ha","freilauf"], weich:{iw:["mm Maulweite",2]}},
  reifenVR:   {hart:[], weich:{breite:["mm Breite",3], grip:["Grip",1]}},
  reifenHR:   {hart:[], weich:{breite:["mm Breite",3], grip:["Grip",1]}},
  schalthebel:{hart:["iface","gaenge"], weich:{}},
  schaltwerk: {hart:["iface","gaenge","udhPflicht"], weich:{maxRitzel:["Z. max.",2], maxKB:["Z. vorn",4]}},
  kassette:   {hart:["freilauf","gaenge"], weich:{}},
  kette:      {hart:["gaenge","iface"], weich:{}},
  kurbel:     {hart:["kl","gaenge","iface"], weich:{kb:["Zähne",2], laenge:["mm Länge",5]}},
  bremsen:    {hart:["mount","kolben"], weich:{sV:["mm Scheibe vorn",23], sH:["mm Scheibe hinten",23]}},
  lenker:     {hart:["klemm"], weich:{breite:["mm Breite",20], rise:["mm Rise",10]}},
  vorbau:     {hart:["klemm"], weich:{laenge:["mm Länge",10]}},
  stuetze:    {hart:["d","hub"], weich:{einbau:["mm Einstecktiefe",15]}},
  sattel:     {hart:[], weich:{}}
};

/* Liefert null, wenn das Teil nicht als Ersatz taugt -- sonst die Liste der
   weichen Abweichungen (leer = wirklich dasselbe Mass). */
function massGleich(slotKey, jetzt, kand){
  const m = MASSE[slotKey];
  if(!m) return null;
  for(const f of m.hart) if(String(jetzt[f]) !== String(kand[f])) return null;
  const ab = [];
  for(const f in m.weich){
    const [txt, tol] = m.weich[f];
    const d = (kand[f] || 0) - (jetzt[f] || 0);
    if(Math.abs(d) > tol) return null;
    if(d) ab.push((d > 0 ? "+" : "−") + Math.abs(d) + " " + txt);
  }
  return ab;
}

/* Guenstigere Teile, die dasselbe Mass halten und keinen neuen Konflikt bringen. */
function guenstigere(slotKey, b){
  const jetzt = b[slotKey] ? findeTeil(slotKey, b[slotKey]) : null;
  if(!jetzt || entfaellt(b, slotKey)) return [];
  const basis = harteFehler(b), preis = preisVon(jetzt);
  const out = [];
  for(const kand of K[quelleOf(slotOf(slotKey))]){
    if(kand.id === jetzt.id) continue;
    const spart = preis - preisVon(kand);
    if(spart < Math.max(8, preis * 0.05)) continue;      /* unter 5 % lohnt der Tausch nicht */
    const ab = massGleich(slotKey, jetzt, kand);
    if(!ab) continue;
    const dEig = eignung(jetzt) - eignung(kand);
    if(dEig > 1.5) continue;                             /* anderes Teil, kein Ersatz */
    if(dEig >= 0.5) ab.push("einfacher für " + selNamen());
    const probe = {...b}; probe[slotKey] = kand.id;
    if(harteFehler(probe) > basis) continue;
    out.push({teil:kand, spart:spart, ab:ab, gd:(kand.g||0) - (jetzt.g||0)});
  }
  return out.sort((a, c) => c.spart - a.spart);
}

/* Ueber den ganzen Aufbau: wo liegt Geld, ohne dass sich am Mass etwas aendert. */
function sparPlan(b){
  const out = [];
  for(const sl of SLOTS){
    const g = guenstigere(sl.k, b);
    if(g.length) out.push({slot:sl, ...g[0], anzahl:g.length});
  }
  return out.sort((a, c) => c.spart - a.spart);
}

/* ═══════════ 7 · Dreambuild-Generator ═══════════ */

const MARKEN = {
  schalt:{slots:["schalthebel","schaltwerk","kassette","kette","kurbel"], opts:["Shimano","SRAM"], label:"Schaltung & Kurbel"},
  brems: {slots:["bremsen"],          opts:["Shimano","SRAM","Magura","Hope","TRP"], label:"Bremsen"},
  fed:   {slots:["gabel","daempfer"], opts:["RockShox","Fox","Marzocchi"], label:"Federung"}
};
function markenWunsch(slotKey){
  if(MARKEN.schalt.slots.indexOf(slotKey) >= 0) return plan.mSchalt;
  if(MARKEN.brems.slots.indexOf(slotKey)  >= 0) return plan.mBrems;
  if(MARKEN.fed.slots.indexOf(slotKey)    >= 0) return plan.mFed;
  return "";
}
/* Robustheit: je Slot das, was den Aufbau wirklich haltbar macht */
function robustN(t, slotKey, gMin, gMax){
  if(slotKey === "laufraeder") return Math.min(1, Math.max(0, (t.maxSys - 105)/50));
  if(slotKey === "bremsen")    return Math.min(1, (t.kolben === 4 ? .6 : .1) + (t.sV >= 200 ? .4 : t.sV >= 180 ? .2 : 0));
  if(slotKey === "reifenVR" || slotKey === "reifenHR") return Math.min(1, t.grip/5);
  return gMax > gMin ? ((t.g||0) - gMin)/(gMax - gMin) : .5;  /* schwerer = meist stabiler */
}
/* Qualität eines Teils ohne Preisbezug — Grundlage aller Tauschentscheidungen */
function qualMap(slotKey){
  const liste = K[quelleOf(slotOf(slotKey))];
  let gMin = Infinity, gMax = 0, pMin = Infinity, pMax = 0;
  for(const t of liste){
    gMin = Math.min(gMin, t.g||0); gMax = Math.max(gMax, t.g||0);
    pMin = Math.min(pMin, t.p||0); pMax = Math.max(pMax, t.p||0);
  }
  const wunsch = markenWunsch(slotKey), m = {};
  for(const t of liste){
    let q = eignung(t) * 20;
    if(wunsch) q += (t.m === wunsch) ? 30 : -18;
    const gN = gMax > gMin ? (gMax - (t.g||0))/(gMax - gMin) : .5;
    const pN = pMax > pMin ? (pMax - (t.p||0))/(pMax - pMin) : .5;
    if(plan.prio === "leicht") q += gN * 22;
    if(plan.prio === "pl")     q += pN * 22;
    if(plan.prio === "robust") q += robustN(t, slotKey, gMin, gMax) * 22;
    m[t.id] = q;
  }
  return m;
}

/* Reihenfolge nach Abhängigkeit: erst was andere Teile festlegt. */
const BAUFOLGE = ["rahmen","daempfer","gabel","kassette","schaltwerk","schalthebel","kette","kurbel","laufraeder",
                  "reifenVR","reifenHR","bremsen","lenker","vorbau","stuetze","sattel"];

function generiere(){
  const b = {};
  for(const s of SLOTS) b[s.k] = null;
  const budget = plan.budget > 0 ? plan.budget : 3500;
  const quals = {};
  for(const s of SLOTS) quals[s.k] = qualMap(s.k);

  /* Anteil neu verteilen, wenn Slots am Rahmen entfallen */
  const anteilVon = k => {
    let rest = 0, mein = slotOf(k).anteil;
    for(const s of SLOTS) if(entfaellt(b, s.k)) rest += s.anteil;
    return rest > 0 && rest < 1 ? mein / (1 - rest) : mein;
  };

  for(const k of BAUFOLGE){
    if(entfaellt(b, k)) continue;
    const s = slotOf(k), ziel = budget * anteilVon(k);
    const vorher = echteFehler(b);
    let beste = null, besteS = -1e9, ersatz = null, ersatzS = -1e9;
    for(const t of K[quelleOf(s)]){
      const probe = {...b}; probe[k] = t.id;
      const neu = echteFehler(probe);
      let score = quals[k][t.id];
      if(ziel > 0 && t.p){
        const q = t.p / ziel;
        score += q > 1 ? -Math.min(50, (q-1)*60) : -Math.min(12, (1-q)*18);
      }
      if(neu <= vorher){ if(score > besteS){ besteS = score; beste = t; } }
      else if(score - (neu - vorher)*40 > ersatzS){ ersatzS = score - (neu - vorher)*40; ersatz = t; }
    }
    b[k] = (beste || ersatz || K[quelleOf(s)][0]).id;
    if(k === "rahmen") for(const s2 of SLOTS) if(entfaellt(b, s2.k)) b[s2.k] = null;
  }

  budgetPass(b, budget, quals);
  return b;
}

const summe = b => { let p = 0; for(const s of SLOTS){ if(entfaellt(b,s.k)) continue;
  const t = b[s.k] ? findeTeil(s.k, b[s.k]) : null; if(t) p += preisVon(t); } return p; };

function budgetPass(b, budget, quals){
  let wache = 0;
  /* zu teuer: den Tausch nehmen, der pro gespartem Euro am wenigsten Qualität kostet */
  while(summe(b) > budget && wache++ < 80){
    const basis = echteFehler(b);
    let best = null, bestKosten = Infinity;
    for(const s of SLOTS){
      if(entfaellt(b, s.k) || !b[s.k]) continue;
      const jetzt = findeTeil(s.k, b[s.k]);
      for(const t of K[quelleOf(s)]){
        if(t.id === jetzt.id || (t.p||0) >= (jetzt.p||0)) continue;
        if(eignung(jetzt) - eignung(t) > 1.5) continue;   /* keine Disziplin verraten */
        const probe = {...b}; probe[s.k] = t.id;
        if(echteFehler(probe) > basis) continue;
        const spart = preisVon(jetzt) - preisVon(t);
        const kosten = (quals[s.k][jetzt.id] - quals[s.k][t.id]) / spart;
        if(kosten < bestKosten){ bestKosten = kosten; best = {k:s.k, id:t.id}; }
      }
    }
    if(!best) break;
    b[best.k] = best.id;
  }
  /* Luft übrig: den Tausch nehmen, der pro Euro am meisten bringt */
  wache = 0;
  while(summe(b) < budget * 0.93 && wache++ < 80){
    const basis = echteFehler(b), rest = budget - summe(b);
    let best = null, bestNutzen = 0;
    for(const s of SLOTS){
      if(entfaellt(b, s.k) || !b[s.k]) continue;
      const jetzt = findeTeil(s.k, b[s.k]);
      for(const t of K[quelleOf(s)]){
        if(t.id === jetzt.id) continue;
        const mehr = preisVon(t) - preisVon(jetzt);
        if(mehr <= 0 || mehr > rest) continue;
        const probe = {...b}; probe[s.k] = t.id;
        if(echteFehler(probe) > basis) continue;
        const gewinn = quals[s.k][t.id] - quals[s.k][jetzt.id];
        if(gewinn <= 0) continue;
        const nutzen = gewinn / mehr;
        if(nutzen > bestNutzen){ bestNutzen = nutzen; best = {k:s.k, id:t.id}; }
      }
    }
    if(!best) break;
    b[best.k] = best.id;
  }
}

/* Ein Affiliate-Link ist kein Suchlink mit angehaengtem Namen. Er laeuft ueber
   das Netzwerk: dort wird der Klick gezaehlt, das Cookie gesetzt und erst dann
   auf das Ziel weitergeleitet. Fehlt dieser Umweg, gibt es keine Provision --
   der Link funktioniert, verdient aber nichts. */
/* Der Anzeigename traegt oft einen erklaerenden Zusatz hinter einem Mittelpunkt
   -- "Shimano Deore M6120 · 4 Kolben". Der gehoert nicht zum Produktnamen und
   laesst die Shopsuche ins Leere laufen. Fuer die Suche bleibt der Teil davor. */
function suchName(teil){
  let n = String(teil.n).split(" · ")[0].trim();
  n = n.replace(/\s*\((?:Mullet|Hardtail[^)]*|Dirt|Doppelbr[^)]*)\)\s*/gi, " ");
  return n.replace(/\s+/g, " ").trim();
}
function shopLink(shop, teil){
  const ziel = shop.suche.replace(/\{q\}/g, encodeURIComponent(suchName(teil)));
  if(shop.netz === "amazon")
    return aff.amazonTag ? ziel + "&tag=" + encodeURIComponent(aff.amazonTag) : ziel;
  const mid = (aff.mid || {})[shop.id];
  if(shop.netz === "awin" && aff.awinId && mid)
    return "https://www.awin1.com/cread.php?awinmid=" + encodeURIComponent(mid) +
           "&awinaffid=" + encodeURIComponent(aff.awinId) +
           "&ued=" + encodeURIComponent(ziel);
  return ziel;                                  /* unkonfiguriert: ehrlicher Direktlink */
}
const shopVerdient = sh => sh.netz === "amazon"
  ? !!aff.amazonTag : !!(aff.awinId && (aff.mid || {})[sh.id]);
const shopsAn = () => SHOPS.filter(sh => aff.an[sh.id]);

function affHtml(teil, kompakt){
  const liste = shopsAn();
  const fe = feedEintrag(teil);
  /* Der Feed liefert den fertigen Deeplink auf das Produkt selbst. Der ist
     jeder Suchseite ueberlegen: er landet direkt auf dem Artikel und traegt
     die Provisionskennung bereits. */
  const direkt = fe && fe.url
    ? `<a class="shop bez" href="${esc(fe.url)}" target="_blank" rel="sponsored nofollow noopener"><span class="pkt"></span>Zum Produkt</a>`
    : "";
  if(!liste.length) return direkt ? `<span class="shops"><span class="werbung">Anzeige</span>${direkt}</span>` : "";
  const bezahlt = liste.some(shopVerdient);
  if(kompakt){
    if(direkt) return direkt;
    const sh = liste[0];
    return `<a class="shop${shopVerdient(sh) ? " bez" : ""}" href="${shopLink(sh, teil)}"
      target="_blank" rel="sponsored nofollow noopener">${shopVerdient(sh) ? '<span class="pkt"></span>' : ""}${esc(sh.name)}</a>`;
  }
  return `<span class="shops">
    ${(bezahlt || direkt) ? `<span class="werbung" title="Provisions-Link">Anzeige</span>` : ""}
    ${direkt}
    ${liste.map(sh => `<a class="shop${shopVerdient(sh) ? " bez" : ""}" href="${shopLink(sh, teil)}"
      target="_blank" rel="sponsored nofollow noopener">${shopVerdient(sh) ? '<span class="pkt"></span>' : ""}${esc(sh.name)}</a>`).join("")}
  </span>`;
}

/* ═══════════ Produktfeed ═══════════
   Der Feed kommt als CSV aus dem Partnerkonto. Er ist zu gross fuer den
   Geraetespeicher -- bike-components allein liefert sechsstellig viele Zeilen.
   Deshalb wird die Datei in Stuecken gelesen, jede Zeile sofort gegen unsere
   rund neunzig Teilenamen geprueft und nur der beste Treffer behalten.
   Am Ende stehen neunzig Eintraege im Speicher, nicht hunderttausend. */

const feedEintrag = teil => feed.treffer[teil.id] || null;
const preisVon = teil => { const f = feedEintrag(teil); return (f && f.preis != null) ? f.preis : (teil.p || 0); };

function normal(x){
  return String(x).toLowerCase()
    .replace(/[×x]\s?(\d)/g, " $1").replace(/[^a-z0-9äöüß]+/g, " ").replace(/\s+/g, " ").trim();
}
function alleTeile(){
  const out = [];
  for(const k in K) for(const t of K[k]) out.push(t);
  return out;
}
/* Zerlegt eine CSV-Zeile und achtet dabei auf Anfuehrungszeichen -- Produktnamen
   enthalten regelmaessig Kommas und Semikolons. */
function csvZeile(z, tr){
  const out = []; let f = "", inQ = false;
  for(let i = 0; i < z.length; i++){
    const c = z[i];
    if(c === '"'){ if(inQ && z[i+1] === '"'){ f += '"'; i++; } else inQ = !inQ; }
    else if(c === tr && !inQ){ out.push(f); f = ""; }
    else f += c;
  }
  out.push(f);
  return out;
}
const SPALTEN = {
  name:  ["product_name","merchant_product_name","productname","name","title"],
  bild:  ["merchant_image_url","aw_image_url","image_url","large_image","merchant_thumb_url"],
  preis: ["search_price","display_price","price","store_price","aw_price"],
  link:  ["aw_deep_link","merchant_deep_link","deep_link","aw_product_link","product_url"]
};
function spalteFinden(kopf, kandidaten){
  for(const k of kandidaten){ const i = kopf.indexOf(k); if(i >= 0) return i; }
  return -1;
}

function feedEinlesen(datei, fertig){
  const ziele = alleTeile().map(t => {
    const w = normal(suchName(t)).split(" ").filter(x => x.length >= 3);
    return {id:t.id, w:w, name:suchName(t)};
  }).filter(z => z.w.length);
  const beste = {};
  let rest = "", kopf = null, tr = ",", iN = -1, iB = -1, iP = -1, iL = -1, zeilen = 0, pos = 0;
  const STUECK = 4 * 1024 * 1024;
  const balken = document.getElementById("feed-balken");

  function stueck(){
    if(pos >= datei.size){ return abschluss(); }
    const leser = new FileReader();
    leser.onload = function(ev){
      const text = rest + ev.target.result;
      const zs = text.split(/\r?\n/);
      rest = zs.pop();
      for(const z of zs) verarbeite(z);
      pos += STUECK;
      if(balken) balken.style.width = Math.min(100, Math.round(pos/datei.size*100)) + "%";
      setTimeout(stueck, 0);                      /* Oberflaeche zwischendurch atmen lassen */
    };
    leser.onerror = function(){ fertig({fehler:"Datei ließ sich nicht lesen."}); };
    leser.readAsText(datei.slice(pos, pos + STUECK));
  }
  function verarbeite(z){
    if(!z) return;
    if(!kopf){
      tr = (z.split("\t").length > z.split(",").length) ? "\t"
         : (z.split(";").length > z.split(",").length) ? ";" : ",";
      kopf = csvZeile(z, tr).map(x => x.replace(/^\ufeff/, "").trim().toLowerCase());
      iN = spalteFinden(kopf, SPALTEN.name); iB = spalteFinden(kopf, SPALTEN.bild);
      iP = spalteFinden(kopf, SPALTEN.preis); iL = spalteFinden(kopf, SPALTEN.link);
      return;
    }
    zeilen++;
    const f = csvZeile(z, tr);
    const nm = iN >= 0 ? f[iN] : "";
    if(!nm) return;
    const n = normal(nm);
    for(const zi of ziele){
      let passt = true;
      for(const w of zi.w) if(n.indexOf(w) < 0){ passt = false; break; }
      if(!passt) continue;
      /* Bei mehreren Treffern den kuerzesten Namen nehmen: das ist meist das
         Produkt selbst und nicht ein Set oder Zubehoer dazu. */
      const alt = beste[zi.id];
      if(alt && alt.len <= nm.length) continue;
      beste[zi.id] = {
        len: nm.length, name: nm,
        bild: iB >= 0 ? (f[iB]||"").trim() : "",
        preis: iP >= 0 ? parseFloat(String(f[iP]).replace(",", ".")) : NaN,
        url: iL >= 0 ? (f[iL]||"").trim() : ""
      };
    }
  }
  function abschluss(){
    if(rest) verarbeite(rest);
    const treffer = {};
    for(const id in beste){
      const b = beste[id];
      if(!/^https:\/\//i.test(b.bild || "")) b.bild = "";      /* nur sichere Bildquellen */
      if(!/^https?:\/\//i.test(b.url || "")) b.url = "";
      treffer[id] = {bild:b.bild, preis:isNaN(b.preis)?null:b.preis, url:b.url, name:b.name};
    }
    feed = {treffer:treffer, stand:Date.now(), quelle:datei.name, zeilen:zeilen};
    sichern();
    fertig({anzahl:Object.keys(treffer).length, zeilen:zeilen, spalten:{name:iN>=0, bild:iB>=0, preis:iP>=0, link:iL>=0}});
  }
  stueck();
}

/* ═══════════ Bauteil-Detailansicht ═══════════
   Gezeigt wird ein echtes Produktbild aus dem Partner-Feed -- oder keins.
   Selbst gezeichnete Ersatzgrafiken gibt es hier bewusst nicht: sie sehen
   nach etwas aus, das sie nicht sind, und beantworten die Frage "wie sieht
   das Teil aus" gerade nicht. */
function oeffneDetail(slotKey, teilId){
  const t = findeTeil(slotKey, teilId);
  if(!t) return;
  const fe = feedEintrag(t);
  const specs = specsVon(slotKey, t);
  zeigeSheet(`
    <div class="sheet-h"><h3><span class="sub">${slotOf(slotKey).label}</span>${esc(t.n)}</h3>${zuBtn}</div>
    <div class="sheet-b">
      ${fe && fe.bild
        ? `<img class="feed-gross" src="${esc(fe.bild)}" alt="${esc(t.n)}" loading="lazy">
           <p class="hint" style="margin:8px 0 12px">Produktbild aus deinem Partner-Feed${fe.preis != null
             ? ` · <span class="livepreis">${eur(fe.preis)}</span> beim Shop` : ""}.</p>`
        : `<p class="hint" style="margin:0 0 12px">Kein Produktbild — dieses Teil steckt noch nicht in
           deinem Produktfeed. Über die Shoplinks unten siehst du es beim Händler.</p>`}
      <dl style="margin:0 0 4px">
        <div class="dspec"><dt>Daten</dt><dd>
          <span class="specs" style="margin-top:0">${specs.map(c => `<span class="chip">${esc(c)}</span>`).join("")}</span>
        </dd></div>
        <div class="dspec"><dt>Gewicht</dt><dd>${t.g} g</dd></div>
        <div class="dspec"><dt>${fe && fe.preis != null ? "Preis" : "Richtpreis"}</dt>
          <dd${fe && fe.preis != null ? ' class="livepreis"' : ""}>${eur(preisVon(t))}</dd></div>
        ${t.m ? `<div class="dspec"><dt>Marke</dt><dd>${esc(t.m)}</dd></div>` : ""}
      </dl>
      <p class="hint" style="margin:10px 0 0">Beim Shop ansehen:</p>
      ${affHtml(t)}
      ${build[slotKey] === t.id ? "" :
        `<div style="margin-top:12px"><button class="btn wide" data-einbau="${slotKey}|${t.id}">Einbauen</button></div>`}
    </div>`);
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur = n => n.toLocaleString("de-DE", {maximumFractionDigits:0}) + " €";
const kg  = g => (g/1000).toLocaleString("de-DE", {minimumFractionDigits:2, maximumFractionDigits:2}) + " kg";
const ampel = v => v >= 85 ? "var(--gut)" : v >= 60 ? "var(--warn)" : "var(--bad)";


function specsVon(slotKey, t){
  const c = [];
  switch(slotKey){
    case "rahmen": c.push(t.lrV === t.lrH ? t.lrV + "″" : t.lrV + "/" + t.lrH + "″",
      t.maxGabel ? "Gabel bis " + t.maxGabel : "Starrgabel",
      t.daempfer ? t.daempfer.el + "×" + t.daempfer.hub + " " + t.daempfer.typ : "ungefedert hinten",
      t.ha, t.bb, t.stuetze ? "Stütze " + t.stuetze : "ohne Stütze", t.udh ? "UDH" : null,
      t.felgenbremse ? "Bremssockel" : null); break;
    case "gabel": c.push(t.travel ? t.travel + " mm" : "starr", t.lr.join("/") + "″", t.va,
      t.schaft === "dc" ? "Doppelbrücke" : t.schaft === "gerade" ? "1 1/8″" : "tapered", "Offset " + t.offset); break;
    case "daempfer": c.push(t.el + " × " + t.hub + " mm", t.typ); break;
    case "laufraeder": c.push(t.lrV === t.lrH ? t.lrV + "″" : t.lrV + "/" + t.lrH + "″",
      "Maulweite " + t.iw, t.freilauf, t.ha, t.va, t.naben, "max. " + t.maxSys + " kg"); break;
    case "reifenVR": case "reifenHR": c.push(t.groessen.join("/") + "″", t.breite + " mm",
      "Felge " + t.iw[0] + "–" + t.iw[1], "Grip " + t.grip + "/5"); break;
    case "schalthebel": c.push(t.gaenge + "-fach", t.iface); break;
    case "schaltwerk": c.push(t.gaenge + "-fach", t.iface, "bis " + t.maxRitzel + " Z.",
      "max. " + t.maxKB + " Z. vorn", t.udhPflicht ? "UDH nötig" : null); break;
    case "kassette": c.push(t.gaenge === 1 ? "Singlespeed" : t.gaenge + "-fach",
      t.spanne[0] + "–" + t.spanne[1] + " Z.", t.freilauf); break;
    case "kette": c.push(t.gaenge === 1 ? "Singlespeed" : t.gaenge + "-fach", t.iface || "Standard"); break;
    case "kurbel": c.push(t.iface, "Kettenlinie " + t.kl, t.kb + " Z.", t.laenge + " mm"); break;
    case "bremsen": c.push(t.mount === "Felge" ? "Felgenbremse" : t.kolben + " Kolben",
      t.mount === "Felge" ? "beidseitig" : t.sV + "/" + t.sH + " mm", t.mount); break;
    case "lenker": c.push(t.klemm + " mm Klemmung", t.breite + " mm", t.rise + " mm Rise"); break;
    case "vorbau": c.push(t.klemm + " mm Klemmung", t.laenge + " mm"); break;
    case "stuetze": c.push(t.d + " mm", t.hub ? t.hub + " mm Hub" : "starr", "Einbau " + t.einbau + " mm"); break;
    default: break;
  }
  return c.filter(Boolean);
}
function slotLevel(funde, slotKey){
  let lvl = null;
  for(const f of funde){
    if(f.slots.indexOf(slotKey) < 0) continue;
    if(f.level === "fehler") return "fehler";
    if(f.level === "warnung") lvl = "warnung";
  }
  return lvl;
}

        <span class="slot-n ${t ? "" : "empty"}">${t ? esc(t.n) : "Teil wählen …"}</span>
        ${chips ? `<span class="specs">${chips}</span>` : ""}
        <span class="slot-r">${t ? `<span class="p">${eur(preisVon(t))}</span><span class="g">${t.g} g</span>` : `<span class="g">offen</span>`}</span>

    for(const sl of meine){

  const top = upgrades(r);
  $("upgrades").innerHTML = top.length ? top.map(v => `
    <div class="up">
      <div><div class="up-n">${esc(v.teil.n)}</div>
        <div class="up-s">${v.slot.label} · ${v.mehr >= 0 ? "+" : "−"}${Math.abs(v.mehr)} € · ${v.gd >= 0 ? "+" : "−"}${Math.abs(v.gd)} g</div></div>

        <span class="delta">+${v.d}</span>

    ? `<div class="sparkasten"><b>${eur(gesamtSpar)} liegen hier.</b>

      + spar.map(v => `<div class="spar">
          <div>
            <div class="spar-n">${esc(v.teil.n)}</div>
            <div class="spar-s">${v.slot.label} · ${eur(preisVon(v.teil))} statt ${eur(preisVon(findeTeil(v.slot.k, build[v.slot.k])))} · ${v.gd >= 0 ? "+" : "−"}${Math.abs(v.gd)} g</div>
            ${v.ab.length ? `<div class="spar-ab">${esc(v.ab.join(" · "))}</div>` : ""}
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">
            <span class="minus">−${eur(v.spart)}</span>

            ${affHtml(v.teil, true)}
          </div>
        </div>`).join("")
    : `<p class="empty-note">Kein Teil lässt sich bei gleichen Maßen günstiger ersetzen. Der Aufbau
       ist preislich schon sauber.</p>`;

  $("b-auf").textContent = r.teile + "/" + r.moeglich;

  document.body.dataset.view = view;
  Array.prototype.forEach.call(document.querySelectorAll(".tabs button"),

function upgrades(r){
  const vor = [];
  for(const s of SLOTS){
    if(entfaellt(build, s.k)) continue;
    const jetzt = build[s.k] ? findeTeil(s.k, build[s.k]) : null;
    for(const kand of K[quelleOf(s)]){
      if(jetzt && kand.id === jetzt.id) continue;
      const probe = {...build}; probe[s.k] = kand.id;
      const pr = bewerte(probe);
      const d = pr.gesamt - r.gesamt;
      if(d <= 0) continue;
      if(plan.budget > 0 && pr.preis > plan.budget && pr.preis > r.preis) continue;
      vor.push({slot:s, teil:kand, d:d, mehr:preisVon(kand) - (jetzt ? preisVon(jetzt) : 0),
                gd:(kand.g||0) - (jetzt ? jetzt.g||0 : 0)});
    }
  }
  vor.sort((a,b) => b.d - a.d || a.mehr - b.mehr);
  const gesehen = {}, top = [];
  for(const v of vor){ if(gesehen[v.slot.k]) continue; gesehen[v.slot.k] = 1; top.push(v); if(top.length === 5) break; }
  return top;
}
