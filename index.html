<script>
"use strict";

/* ═══════════ Sprache ═══════════
   Deutsch und Englisch (Liams Wunsch 2026-09-27). Jeder sichtbare Text steht
   als Paar im Code, tx("Deutsch", "English") -- so bleibt die Uebersetzung
   dort, wo der Text gebraucht wird. Beim ersten Start entscheidet die Sprache
   des Geraets, umschalten geht im Onboarding und unter dem Menue. Impressum
   und Datenschutz bleiben deutsch: sie gelten nach deutschem Recht. */
let sprache = "de";
try{
  const s = localStorage.getItem("mtb.sprache");
  sprache = s === "en" || s === "de" ? s : (/^de\b/i.test(navigator.language || "de") ? "de" : "en");
}catch(e){}
const tx = (de, en) => sprache === "en" ? en : de;
const ortsform = () => sprache === "en" ? "en-GB" : "de-DE";
document.documentElement.lang = sprache;

/* ═══════════ 1 · Disziplinen ═══════════ */

const DID = ["xc","trail","enduro","dh","dirt","slope","trial"];
const E = (...v) => { const o = {}; DID.forEach((d,i) => o[d] = v[i] || 0); return o; };

const DISZ = [
 {id:"xc",     n:"XC",         lang:"Cross Country", de:"100–120 mm, leicht, effizient. Das Rennen wird bergauf entschieden.",
  en:"100–120 mm, light, efficient. The race is won on the climbs."},
 {id:"trail",  n:"Trail",      lang:"Trail",         de:"130–150 mm, Dropper, Allrounder. Hoch aus eigener Kraft, runter mit Spaß.",
  en:"130–150 mm, dropper, all-rounder. Pedal up under your own steam, ride down for fun."},
 {id:"enduro", n:"Enduro",     lang:"Enduro",        de:"160–180 mm, Gravity-Laufräder, vier Kolben. Bergab auf Zeit.",
  en:"160–180 mm, gravity wheels, four pistons. Timed downhill stages."},
 {id:"dh",     n:"Downhill",   lang:"Downhill",      de:"200 mm, Doppelbrücke, 157er Hinterbau. Kein Meter bergauf.",
  en:"200 mm, dual crown, 157 mm rear end. Not a metre uphill."},
 {id:"dirt",   n:"Dirt",       lang:"Dirtjump",      en_lang:"Dirt jump", de:"26″, 100 mm straffe Gabel, Singlespeed, kurze starre Stütze.",
  en:"26″, firm 100 mm fork, singlespeed, short rigid seatpost."},
 {id:"slope",  n:"Slopestyle", lang:"Slopestyle",    de:"Dirt mit Federung hinten: 26″, ~140 mm, aber immer noch kein Dropper.",
  en:"Dirt jump with rear suspension: 26″, ~140 mm, still no dropper."},
 {id:"trial",  n:"Trial",      lang:"Trial",         en_lang:"Trials", de:"Kein Sattel, starre Gabel, 18 Zähne, Felgenbremse. Eine eigene Welt.",
  en:"No saddle, rigid fork, 18 teeth, rim brakes. A world of its own."}
].map(d => Object.defineProperty(d, "txt", {get(){ return tx(this.de, this.en); }}));
const dLang = id => { const d = DISZ.find(x => x.id === id) || {}; return (sprache === "en" && d.en_lang) || d.lang || id; };
const dName = id => (DISZ.find(d => d.id === id) || {}).n || id;

const MIX = {
 xc:     {xc:1,    trail:.80, enduro:.40, dh:.05, dirt:.05, slope:.05, trial:.02},
 trail:  {xc:.80,  trail:1,   enduro:.85, dh:.30, dirt:.15, slope:.12, trial:.05},
 enduro: {xc:.40,  trail:.85, enduro:1,   dh:.70, dirt:.10, slope:.10, trial:.04},
 dh:     {xc:.05,  trail:.30, enduro:.70, dh:1,   dirt:.15, slope:.25, trial:.03},
 dirt:   {xc:.05,  trail:.15, enduro:.10, dh:.15, dirt:1,   slope:.88, trial:.35},
 slope:  {xc:.05,  trail:.12, enduro:.10, dh:.25, dirt:.88, slope:1,   trial:.20},
 trial:  {xc:.02,  trail:.05, enduro:.04, dh:.03, dirt:.35, slope:.20, trial:1}
};
function mixPaar(s){
  let min = 1, paar = null;
  for(let i = 0; i < s.length; i++)
    for(let j = i+1; j < s.length; j++){
      const v = MIX[s[i]][s[j]];
      if(v < min){ min = v; paar = [s[i], s[j]]; }
    }
  return {min:min, paar:paar};
}

/* ═══════════ 2a · Ausführungen ═══════════
   Ein Modell steht einmal im Katalog. Was es davon zu kaufen gibt -- Federweg,
   Kartusche, Einbaumaß, Freilauf, Scheiben, Durchmesser, Hub, Rise, Länge --
   hängt als Dimension daran und wird an der Kachel gewählt. So stehen nicht
   zwölf fast gleiche Einträge untereinander, und trotzdem ist jede echte
   Kombination wählbar.

   Preis und Gewicht eines Eintrags gelten für seine Grundausführung; eine
   Option trägt nur den Abstand dazu (p in €, g in Gramm). Bei Kartusche und
   Ausführung ist die Grundausführung die erste Option, sonst die Vorgabe. */
/* Texte einer Option duerfen ein Paar [Deutsch, Englisch] sein -- gelesen
   wird immer in der aktuellen Sprache */
const sp2 = v => Array.isArray(v) ? tx(v[0], v[1]) : v;
const o_ = (w, n, s, x) => Object.defineProperties({w:w, s:s || null, p:(x && x.p) || 0, g:(x && x.g) || 0,
  _n:n, _h:(x && x.h) || "", _k:(x && x.kurz) || ""}, {
  n:{get(){ return sp2(this._n); }, enumerable:true}, h:{get(){ return sp2(this._h); }, enumerable:true},
  kurz:{get(){ return sp2(this._k); }, enumerable:true}});
const DIM_EN = {"Federweg":"Travel", "Kartusche":"Damper", "Ausführung":"Version", "Einbaumaß":"Eye-to-eye × stroke",
  "Freilauf":"Freehub", "Scheiben":"Rotors", "Durchmesser":"Diameter", "Hub":"Drop", "Rise":"Rise", "Klemmung":"Clamp",
  "Länge":"Length", "Kurbellänge":"Crank length", "Nabenbreite":"Hub width", "Steuerrohr":"Head tube", "Vorderachse":"Front axle",
  "Kettenblatt":"Chainring", "Gehäuse":"Shell"};
const dimName = k => tx(k, DIM_EN[k] || k);
const dezimal = v => [String(v).replace(".", ","), String(v)];
const dim = (k, o, std) => { const i = o.findIndex(x => x.w === std); return {k:k, o:o, d:i < 0 ? 0 : i}; };

function FW(wege, std){ return dim("Federweg", wege.map(x => o_(x, x + " mm", {travel:x})), std); }
function KA(liste, std){ return dim("Kartusche", liste.map(([n, h, p, g]) => o_(n, n, null, {p:p, g:g, h:[h, kartEn(h)]})), std == null ? liste[0][0] : std); }
/* Die Kartuschen-Hinweise sind kurze Formeln -- ein paar Ersetzungen reichen */
function kartEn(h){
  return String(h).replace(/ab Modelljahr/g, "from model year").replace(/bis Modelljahr/g, "up to model year").replace(/Modelljahr/g, "Model year")
    .replace("neues Chassis mit LinearXL-Luftfeder und einstellbarem Durchschlagschutz (ABO)", "new chassis with LinearXL air spring and adjustable bottom-out (ABO)")

const slug = x => String(x).toLowerCase().replace(/\+/g, "plus").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9.]+/g, "");
const slugAlt = x => String(x).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9.]+/g, "");
/* Gespeicherte Aufbauten aus der Zeit davor: ein mehrdeutiger alter Kurzname

function kurznamenUmstellen(){
  for(const bau of alleBauten()) for(const k in bau){
    const id = bau[k], s = slotOf(k);
    if(typeof id !== "string" || id.indexOf("|") < 0 || !s) continue;
    const teile = id.split("|"), sl = teile[1].split("~");
    const basis = K[quelleOf(s)] && K[quelleOf(s)].find(t => t.id === teile[0]);
    if(!basis || !basis.v) continue;
    let neu = false;
    basis.v.forEach((d, i) => {
      if(sl[i] == null) return;
      const alt = d.o.filter(o => slugAlt(o.w) === sl[i]);
      if(alt.length && slug(alt[0].w) !== sl[i]){ sl[i] = slug(alt[0].w); neu = true; }
    });
    if(neu) bau[k] = teile[0] + "|" + sl.join("~");
  }
}

  const id = basis.id + "|" + basis.v.map((d, i) => slug(d.o[w[i]].w)).join("~");
  let t = VARIANTEN.get(id);
  if(t) return t;
  t = {...basis, id:id, basisId:basis.id, wahl:w};
  const zus = [];
  basis.v.forEach((d, i) => {

function aliasId(id){

      const bid = ALIAS_ROH[alt][0], w = ALIAS_ROH[alt][1];
      let basis = null;

      ALIAS[alt] = (!basis || !basis.v) ? bid : bid + "|" + basis.v.map(d => {
        const o = d.o.find(x => String(x.w) === String(w[d.k])) || d.o[d.d];

/* Passt eine Option zum restlichen Aufbau? true / false, null = keine Aussage */
function optionPasst(slotKey, d, o, b){
  const s = o.s;
  if(!s) return null;
  const r = b.rahmen ? findeTeil("rahmen", b.rahmen) : null;
  switch(d.k){
    case "Federweg": return r && r.maxGabel > 0 ? s.travel <= r.maxGabel : null;
    case "Einbaumaß": return r && r.daempfer ? s.el === r.daempfer.el && s.hub === r.daempfer.hub && s.typ === r.daempfer.typ : null;
    case "Freilauf": {
      const ka = b.kassette && !entfaellt(b, "kassette") ? findeTeil("kassette", b.kassette) : null;
      return ka ? s.freilauf === ka.freilauf : null;
    }
    case "Scheiben": {
      const g = b.gabel ? findeTeil("gabel", b.gabel) : null;
      if(!g && !r) return null;
      return (!g || s.sV <= g.maxScheibeVR) && (!r || s.sH <= r.maxScheibeHR);
    }
    case "Durchmesser": return r && r.stuetze ? parseFloat(s.d) === r.stuetze : null;
    case "Nabenbreite": return r ? s.ha === r.ha : null;
    case "Vorderachse": { const g = b.gabel ? findeTeil("gabel", b.gabel) : null; return g ? s.va === g.va : null; }
    case "Steuerrohr": return r ? s.schaft === r.schaft : null;
    case "Hub": return r && r.einsteck > 0 ? s.einbau <= r.einsteck : null;
    case "Gehäuse": return r && r.bb ? s.gehaeuse.indexOf(r.bb) >= 0 : null;
    case "Klemmung": {
      const x = slotKey === "lenker" ? (b.vorbau ? findeTeil("vorbau", b.vorbau) : null)
                                     : (b.lenker ? findeTeil("lenker", b.lenker) : null);

    }

}

   bei Federweg, Hub und Scheiben die groesste passende, sonst die erste. */
const GROESSTE = {Federweg:"travel", Hub:"hub", Scheiben:"sV"};
function besteVariante(slotKey, basis, b){
  return varianteNachIndex(basis, basis.v.map(d => {
    if(d.o.length < 2 || optionPasst(slotKey, d, d.o[d.d], b) !== false) return d.d;
    let best = -1;
    d.o.forEach((o, j) => {
      if(optionPasst(slotKey, d, o, b) !== true) return;
      const f = GROESSTE[d.k];
      if(best < 0 || (f && o.s[f] > d.o[best].s[f])) best = j;
    });
    return best < 0 ? d.d : best;
  }));
}

const fotoFach = id => "mtb.foto." + id;
/* Arbeitskopie -> Profil */
function profilZurueck(m){
  m = m || modus;
  const p = aktivesProfil(m);
  if(!p) return;
  p.build = m === modus ? build : builds[m];
  p.jahr = jahrWahl[m];
  if(m === modus){
    p.sel = sel.slice();
    const {fahrer, ...rest} = plan;                /* Fahrergewicht gehoert keinem Rad */
    p.plan = rest;
    if(m === "markt") p.markt = JSON.parse(JSON.stringify(markt));
  }
}
/* Profil -> Arbeitskopie */
function profilHolen(m){
  m = m || modus;
  const p = aktivesProfil(m);
  aktivId[m] = p.id;
  builds[m] = {...leerBau(), ...(p.build || {})};
  p.build = builds[m];
  jahrWahl[m] = p.jahr || jahrStart(m);
  let f = null;
  try{ f = localStorage.getItem(fotoFach(p.id)); }catch(e){}
  fotos[m] = f || null;
  if(m === modus){
    build = builds[m];
    sel = (Array.isArray(p.sel) ? p.sel : []).filter(x => DID.indexOf(x) >= 0);
    if(!sel.length) sel = ["trail"];
    plan = {...PLAN_START, ...(p.plan || {}), fahrer:plan.fahrer || 0};
    if(m === "markt") markt = {...MARKT_START, ...(p.markt || {}), verschleiss:{...((p.markt || {}).verschleiss || {})}};
  }
}
function wechsle(m){
  builds[modus] = build;
  profilZurueck(modus);
  modus = m;
  profilHolen(m);
}
function profilWechseln(id){
  if(id === aktivId[modus]) return;
  profilZurueck(modus);
  aktivId[modus] = id;
  profilHolen(modus);
  view = "aufbau";
  sichern(); zeichne();
}
function profilNeu(kopieVon){
  profilZurueck(modus);
  const q = kopieVon ? profile[modus].find(x => x.id === kopieVon) : null;
  const p = q ? JSON.parse(JSON.stringify({...q, id:neueId(), name:q.name ? q.name + tx(" (Kopie)", " (copy)") : ""})) : profilLeer(modus);
  if(q){ try{ const f = localStorage.getItem(fotoFach(q.id)); if(f) localStorage.setItem(fotoFach(p.id), f); }catch(e){} }
  profile[modus].push(p);
  aktivId[modus] = p.id;
  profilHolen(modus);
  view = "aufbau";
  sichern(); zeichne();
}
function profilLoeschen(id){
  if(profile[modus].length < 2) return;
  profilZurueck(modus);
  profile[modus] = profile[modus].filter(x => x.id !== id);
  try{ localStorage.removeItem(fotoFach(id)); ["gabel", "daempfer"].forEach(k => localStorage.removeItem("mtb.topcap." + id + "." + k)); }catch(e){}
  if(aktivId[modus] === id) aktivId[modus] = profile[modus][0].id;
  profilHolen(modus);
  sichern(); zeichne();
}
/* Anzeigename: selbst vergeben, sonst Rahmen, sonst Disziplin */
function profilName(p, m){
  if(p.name) return p.name;
  const r = p.build && p.build.rahmen ? findeTeil("rahmen", p.build.rahmen) : null;
  if(r) return String(r.n).split(" · ")[0];
  const d = (p.sel || []).filter(x => DID.indexOf(x) >= 0);
  const leer = !p.build || !Object.keys(p.build).some(k => p.build[k]);
  return leer ? (m === "markt" ? tx("Neues Angebot", "New listing") : tx("Neues Rad", "New bike")) : d.map(dName).join(" + ") || MODUS_NAME[m];
}
/* Alle Aufbauten aller Profile -- fuer Umstellungen, die ueberall greifen muessen */
function alleBauten(){
  const out = [];
  for(const m of MODI){ for(const p of profile[m]) if(p.build) out.push(p.build); if(builds[m]) out.push(builds[m]); }
  if(build) out.push(build);
  return [...new Set(out)];
}
/* Aus der Zeit vor den Profilen: ein Aufbau je Modus, Disziplinen fuer alle
   gemeinsam. Mein Rad und Angebot bekommen die Disziplin, fuer die ihr Rahmen
   gebaut ist -- sonst stuende dort weiter die des Traumrads. */
function profileAusAlt(altSel, altPlan, altFotos){
  for(const m of MODI){
    const p = profilLeer(m);
    p.build = {...leerBau(), ...(builds[m] || {})};
    p.jahr = jahrWahl[m] || jahrStart(m);
    /* Budget und Markenwuensche kamen aus dem Traumrad-Assistenten -- sie
       bleiben beim Traumrad. Die anderen Raeder fangen davon frei an. */
    const {fahrer, ...rest} = altPlan;
    p.sel = m === "traum" ? altSel.slice() : ["trail"];
    p.plan = m === "traum" ? rest : {...PLAN_START, fahrer:undefined};
    delete p.plan.fahrer;
    if(m === "markt") p.markt = JSON.parse(JSON.stringify(markt));
    if(m !== "traum" && p.build.rahmen){
      const r = findeTeil("rahmen", p.build.rahmen);
      if(r && r.e) p.sel = [DID.slice().sort((a, b) => (r.e[b] || 0) - (r.e[a] || 0))[0]];
    }
    if(altFotos && altFotos[m]){ try{ localStorage.setItem(fotoFach(p.id), altFotos[m]); }catch(e){} }
    profile[m] = [p];
    aktivId[m] = p.id;
  }
}
let sel = ["trail"];
let plan = {...PLAN_START};
let markt = {...MARKT_START};
let aff = JSON.parse(JSON.stringify(AFF_START));
let view = "aufbau";
let nurPassende = true;
let offenerSlot = null;

function laden(){
  try{
    const bs = localStorage.getItem("mtb.builds");
    if(bs){
      const p = JSON.parse(bs);
      if(p && p.traum) builds.traum = {...START, ...p.traum};
      if(p && p.real)  builds.real  = {...leerBau(), ...p.real};
      if(p && p.markt) builds.markt = {...leerBau(), ...p.markt};
    } else {
      const alt1 = localStorage.getItem("mtb.build");   /* Fassung vor dem Umbau */
      if(alt1){ const p = JSON.parse(alt1); if(p && typeof p === "object") builds.traum = {...START, ...p}; }
    }
    const md = localStorage.getItem("mtb.modus");
    if(md === "real" || md === "traum" || md === "markt") modus = md;
    const jw = localStorage.getItem("mtb.jahr");
    if(jw){ const q = JSON.parse(jw); if(q && typeof q === "object") jahrWahl = {...jahrWahl, ...q}; }
    else {
      /* Vor dem Modelljahr gab es im Angebotsmodus nur ein Alter in Jahren */
      const alt = localStorage.getItem("mtb.markt");
      if(alt){ const q = JSON.parse(alt); if(q && typeof q.alter === "number") jahrWahl.markt = AKTUELL - Math.round(q.alter); }
    }
    if(localStorage.getItem("mtb.slugv") !== "2"){ kurznamenUmstellen(); localStorage.setItem("mtb.slugv", "2"); }
    const eg = localStorage.getItem("mtb.eigene");
    if(eg){ const q = JSON.parse(eg); if(q && typeof q === "object" && !Array.isArray(q)) eigene = q; INDEX = {}; }
    const zg = localStorage.getItem("mtb.zu");
    if(zg){ const q = JSON.parse(zg); if(q && typeof q === "object") zuGeklappt = q; }
    const lk = localStorage.getItem("mtb.links");
    if(lk){ const q = JSON.parse(lk); if(q && q.teile && typeof q.teile === "object") linksLokal = {teile:q.teile}; }
    linkVerwaltung = localStorage.getItem("mtb.linkadmin") === "1";
    const bt = localStorage.getItem("mtb.betreiber");
    if(bt){ const q = JSON.parse(bt); if(q && typeof q === "object") betreiberLokal = q; }
    const fd = localStorage.getItem("mtb.feed");
    if(fd){ const q = JSON.parse(fd); if(q && q.treffer) feed = q; }
    const ft = localStorage.getItem("mtb.fotos");
    if(ft){ const p = JSON.parse(ft); if(p && typeof p === "object") fotos = {traum:p.traum||null, real:p.real||null, markt:p.markt||null}; }
    build = builds[modus];
    const s = localStorage.getItem("mtb.sel");
    if(s){ const p = JSON.parse(s); if(Array.isArray(p)) sel = p.filter(x => DID.indexOf(x) >= 0); }
    if(!sel.length) sel = ["trail"];
    const mk = localStorage.getItem("mtb.markt");
    if(mk){ const q = JSON.parse(mk); if(q && typeof q === "object") markt = {...MARKT_START, ...q, verschleiss:{...(q.verschleiss||{})}}; }
    const pl = localStorage.getItem("mtb.plan");
    if(pl){ const p = JSON.parse(pl); if(p && typeof p === "object") plan = {...PLAN_START, ...p}; }
    const fa = localStorage.getItem("mtb.fahrer");
    if(fa != null && !isNaN(+fa)) plan.fahrer = +fa;
    /* Profile: vorhanden -> laden, sonst aus den alten Einzelwerten anlegen */
    const pr = localStorage.getItem("mtb.profile");
    const q = pr ? JSON.parse(pr) : null;
    if(q && q.liste && MODI.every(m => Array.isArray(q.liste[m]) && q.liste[m].length)){
      for(const m of MODI) profile[m] = q.liste[m].filter(x => x && x.id).map(x => ({...profilLeer(m), ...x}));
      for(const m of MODI) aktivId[m] = (q.aktiv && q.aktiv[m]) || profile[m][0].id;
      if(MODI.indexOf(q.modus) >= 0) modus = q.modus;
    } else {
      profileAusAlt(sel, plan, fotos);
      try{ localStorage.removeItem("mtb.fotos"); }catch(e){}
    }
    for(const m of MODI) if(m !== modus) profilHolen(m);
    profilHolen(modus);
    const a = localStorage.getItem("mtb.aff");
    if(a){
      const q = JSON.parse(a);
      if(q && !Array.isArray(q) && typeof q === "object")
        aff = {...AFF_START, ...q, mid:{...(q.mid||{})}, an:{...AFF_START.an, ...(q.an||{})}};
    }
  }catch(e){ /* privates Fenster oder blockierter Speicher */ }
  /* Ohne Speicher (oder bei kaputtem Stand) trotzdem mit Profilen starten */
  if(MODI.some(m => !profile[m].length)){
    profileAusAlt(sel, plan, null);
    for(const m of MODI) if(m !== modus) profilHolen(m);
    profilHolen(modus);
  }
}
function sichern(){
  try{
    builds[modus] = build;
    profilZurueck(modus);
    localStorage.setItem("mtb.profile", JSON.stringify({v:1, modus:modus, aktiv:aktivId, liste:profile}));
    localStorage.setItem("mtb.fahrer", String(plan.fahrer || 0));
    localStorage.setItem("mtb.builds", JSON.stringify(builds));
    localStorage.setItem("mtb.modus", modus);
    localStorage.setItem("mtb.feed", JSON.stringify(feed));
    localStorage.setItem("mtb.links", JSON.stringify(linksLokal));
    localStorage.setItem("mtb.linkadmin", linkVerwaltung ? "1" : "0");
    localStorage.setItem("mtb.betreiber", JSON.stringify(betreiberLokal));
    localStorage.setItem("mtb.zu", JSON.stringify(zuGeklappt));
    localStorage.setItem("mtb.eigene", JSON.stringify(eigene));
    localStorage.setItem("mtb.jahr", JSON.stringify(jahrWahl));
    localStorage.setItem("mtb.sel", JSON.stringify(sel));
    localStorage.setItem("mtb.plan", JSON.stringify(plan));
    localStorage.setItem("mtb.markt", JSON.stringify(markt));
    localStorage.setItem("mtb.aff", JSON.stringify(aff));
  }catch(e){}
  /* Fotos je Profil im eigenen Fach. Speicher voll: lieber das Foto verwerfen
     als den ganzen Aufbau verlieren. */
  for(const m of MODI){
    const p = aktivesProfil(m);
    if(!p) continue;
    try{
      if(fotos[m]) localStorage.setItem(fotoFach(p.id), fotos[m]);
      else localStorage.removeItem(fotoFach(p.id));
    }catch(e){
      fotos[m] = null;
      try{ localStorage.removeItem(fotoFach(p.id)); }catch(e2){}
    }
  }
}

/* ═══════════ 5 · Engine ═══════════ */

const F = (t,x,sl,txt) => ({level:"fehler",  titel:t, text:txt, slots:sl, fixSlot:x});
const W = (t,x,sl,txt) => ({level:"warnung", titel:t, text:txt, slots:sl, fixSlot:x});
const H = (t,x,sl,txt) => ({level:"hinweis", titel:t, text:txt, slots:sl, fixSlot:x});
const hat = d => sel.indexOf(d) >= 0;
const selNamen = () => sel.map(dLang).join(" + ");

/* Gibt es im Katalog ein Innenlager fuer diese Kurbelwelle in diesem Rahmen? */
const lagerDa = (kurbel, rahmen) => !rahmen || !rahmen.bb || K.innenlager.some(il => il.welle === kurbel.iface &&
  (il.v ? il.v[0].o.some(o => o.s.gehaeuse.indexOf(rahmen.bb) >= 0) : il.gehaeuse.indexOf(rahmen.bb) >= 0));

function sollKettenlinie(rahmen, schaltwerk){
  if(!rahmen) return null;
  if(rahmen.klSoll != null) return rahmen.klSoll;
  if(rahmen.ha === "157x12") return 56.5;
  if(rahmen.ha === "142x12") return 49;
  if(rahmen.ha === "135x10" || rahmen.ha === "135x12") return 47;
  if(rahmen.ha === "150x12") return null;              /* DH-Sondermass: keine belastbare Vorgabe */
  return schaltwerk && schaltwerk.iface === "T-Type" ? 55 : 52;
}

function pruefe(b){
  const t = {};
  for(const s of SLOTS) t[s.k] = b[s.k] ? findeTeil(s.k, b[s.k]) : null;
  const out = [];
  const rahmen = t.rahmen, gabel = t.gabel, daempfer = t.daempfer, laufraeder = t.laufraeder,
        reifenVR = t.reifenVR, reifenHR = t.reifenHR, kurbel = t.kurbel,
        schalthebel = t.schalthebel, schaltwerk = t.schaltwerk, kassette = t.kassette, kette = t.kette,
        bremsen = t.bremsen, lenker = t.lenker, vorbau = t.vorbau, stuetze = t.stuetze,
        innenlager = t.innenlager, sattel = t.sattel;
  const fach = g => g === 1 ? "Singlespeed" : g + tx("-fach", "-speed");

  if(sel.length > 1){
    const mp = mixPaar(sel);
    if(mp.min < .15) out.push(F(tx("Diese Mischung gibt es nicht als ein Rad", "This mix doesn't exist as one bike"),"",[],
      tx(`<code>${dLang(mp.paar[0])}</code> und <code>${dLang(mp.paar[1])}</code> teilen sich praktisch kein Bauteil — andere Laufradgröße, anderer Federweg, andere Sitzposition. Zwei Räder, kein Kompromiss.`,
         `<code>${dLang(mp.paar[0])}</code> and <code>${dLang(mp.paar[1])}</code> share practically no parts — different wheel size, different travel, different riding position. Two bikes, not a compromise.`)));
    else if(mp.min < .40) out.push(W(tx("Weiter Spagat zwischen den Disziplinen", "A wide split between the disciplines"),"",[],
      tx(`<code>${dLang(mp.paar[0])}</code> und <code>${dLang(mp.paar[1])}</code> ziehen stark auseinander. Machbar, aber jedes Teil wird ein Kompromiss — der Einsatz-Wert wird nie hoch. Das ist kein Fehler im Aufbau, sondern im Plan.`,
         `<code>${dLang(mp.paar[0])}</code> and <code>${dLang(mp.paar[1])}</code> pull hard in different directions. Doable, but every part becomes a compromise — the purpose score will never be high. That's not a flaw in the build but in the plan.`)));
  }

  if(rahmen && rahmen.seit && jahrAktiv() < rahmen.seit)
    out.push(Object.assign(W(tx("Modelljahr älter als diese Generation", "Model year older than this generation"),"rahmen",["rahmen"],
      tx(`Den <code>${rahmen.n}</code> gibt es in dieser Form erst seit etwa <code>${rahmen.seit}</code>. Ein ${jahrAktiv()}er ist die Vorgängergeneration — Achsmaße, Dämpfergröße und Geometrie können anders sein. Die Prüfung rechnet mit der aktuellen Generation; gleich die Maße am echten Rad ab.`,
         `The <code>${rahmen.n}</code> has only existed in this form since about <code>${rahmen.seit}</code>. A ${jahrAktiv()} model is the previous generation — axle standards, shock size and geometry may differ. The check uses the current generation; compare the numbers with the real bike.`)), {jahr:true}));

  if(rahmen && gabel){
    if(gabel.schaft !== rahmen.schaft){
      const nm = x => x === "tapered" ? tx("konisch (tapered)", "tapered") : x === "gerade" ? tx("1 1/8″ gerade", "1 1/8″ straight") : tx("Doppelbrücke", "dual crown");
      out.push(F(tx("Gabelschaft passt nicht ins Steuerrohr", "Fork steerer doesn't fit the head tube"),"gabel",["rahmen","gabel"],
        tx(`Rahmen <code>${nm(rahmen.schaft)}</code>, Gabel <code>${nm(gabel.schaft)}</code>. ${gabel.schaft === "dc" ? "Eine Doppelbrückengabel braucht einen Rahmen mit DH-Freigabe — kein Adapterfall." : rahmen.schaft === "tapered" ? "Ein gerader Schaft lässt sich mit passendem Steuersatz-Unterteil oft fahren, aber nicht mit jedem Rahmen. Beim Hersteller prüfen." : "Ein konischer Schaft passt nicht in ein gerades Steuerrohr."}`,
           `Frame <code>${nm(rahmen.schaft)}</code>, fork <code>${nm(gabel.schaft)}</code>. ${gabel.schaft === "dc" ? "A dual-crown fork needs a frame rated for DH — no adapter will fix that." : rahmen.schaft === "tapered" ? "A straight steerer often works with the right lower headset cup, but not with every frame. Check with the manufacturer." : "A tapered steerer won't fit a straight head tube."}`)));
    }
    if(rahmen.maxGabel === 0 && gabel.travel > 0){
      out.push(F(tx("Dieser Rahmen ist für eine Starrgabel gebaut", "This frame is built for a rigid fork"),"gabel",["rahmen","gabel"],
        tx(`<code>${rahmen.n}</code> hat keine Federgabelfreigabe. ${gabel.travel} mm verändern Lenkwinkel und Tretlagerhöhe so stark, dass das Rad seine Eigenschaft verliert — bei Trial ist genau die der Zweck.`,
           `<code>${rahmen.n}</code> isn't rated for a suspension fork. ${gabel.travel} mm change head angle and bottom bracket height so much that the bike loses its character — and in trials that character is the whole point.`)));
    } else if(gabel.travel > rahmen.maxGabel){
      out.push(F(tx("Zu viel Federweg für die Rahmenfreigabe", "Too much travel for the frame rating"),"gabel",["rahmen","gabel"],
        tx(`Freigegeben <code>${rahmen.maxGabel} mm</code>, verbaut <code>${gabel.travel} mm</code> — ${gabel.travel - rahmen.maxGabel} mm zu viel. Der Lenkwinkel flacht um rund ${((gabel.travel - rahmen.maxGabel)/20*0.5).toFixed(1)}° ab, das Steuerrohr sieht höhere Hebelkräfte, und die Garantie ist weg.`,
           `Rated for <code>${rahmen.maxGabel} mm</code>, fitted <code>${gabel.travel} mm</code> — ${gabel.travel - rahmen.maxGabel} mm too much. The head angle slackens by about ${((gabel.travel - rahmen.maxGabel)/20*0.5).toFixed(1)}°, the head tube sees higher leverage, and the warranty is gone.`)));
    } else if(rahmen.maxGabel > 0 && rahmen.maxGabel - gabel.travel >= 20){
      out.push(H(tx("Federweg unter der Rahmenfreigabe", "Travel below the frame rating"),"gabel",["rahmen","gabel"],
        tx(`Der Rahmen kann <code>${rahmen.maxGabel} mm</code>, verbaut sind <code>${gabel.travel} mm</code>. Funktioniert, macht die Geometrie aber steiler und kürzer als gedacht.`,
           `The frame takes <code>${rahmen.maxGabel} mm</code>, fitted is <code>${gabel.travel} mm</code>. Works, but makes the geometry steeper and shorter than intended.`)));
    }
    if(!gabel.lr.includes(rahmen.lrV)) out.push(F(tx("Gabel nicht für diese Laufradgröße", "Fork not made for this wheel size"),"gabel",["rahmen","gabel"],
      tx(`Vorn läuft <code>${rahmen.lrV}″</code>, die Gabel ist für <code>${gabel.lr.join("″ / ")}″</code> freigegeben.`,
         `The front wheel is <code>${rahmen.lrV}″</code>, the fork is rated for <code>${gabel.lr.join("″ / ")}″</code>.`)));
  }

  if(rahmen){
    if(!rahmen.daempfer && daempfer) out.push(F(tx("Dieser Rahmen hat keine Dämpferaufnahme", "This frame has no shock mount"),"daempfer",["rahmen","daempfer"],
      tx(`<code>${rahmen.n}</code> ist hinten ungefedert. Den Dämpfer aus dem Aufbau nehmen.`,
         `<code>${rahmen.n}</code> has no rear suspension. Remove the shock from the build.`)));
    /* Ein fehlender Daempfer ist kein Konflikt, nur noch nicht eingetragen --
       "Aufbau unvollstaendig" nennt ihn. Vorher stand beim eigenen Rad nach
       dem Rahmen sofort "Ein harter Konflikt" da. */
    else if(rahmen.daempfer && daempfer){
      if(daempfer.el !== rahmen.daempfer.el || daempfer.typ !== rahmen.daempfer.typ)
        out.push(F(tx("Dämpfer-Einbaumaß passt nicht", "Shock size doesn't fit"),"daempfer",["rahmen","daempfer"],
          tx(`Der Rahmen verlangt <code>${massTxt(rahmen.daempfer)}</code>, der Dämpfer liefert <code>${massTxt(daempfer)}</code>. ${rahmen.daempfer.typ === "IsoStrut" ? "Der IsoStrut ist Teil des Rahmens, ein normaler Dämpfer passt dort nicht." : "Einbaulänge und Aufnahmeart sind beide hart."}`,
             `The frame needs <code>${massTxt(rahmen.daempfer)}</code>, the shock is <code>${massTxt(daempfer)}</code>. ${rahmen.daempfer.typ === "IsoStrut" ? "The IsoStrut is part of the frame; a regular shock won't fit there." : "Eye-to-eye length and mount type are both non-negotiable."}`)));
      else if(daempfer.hub !== rahmen.daempfer.hub)
        out.push(W(tx("Abweichender Hub", "Different stroke"),"daempfer",["rahmen","daempfer"],
          tx(`Einbaulänge stimmt, der Hub weicht ab: <code>${rahmen.daempfer.hub} mm</code> gegen <code>${daempfer.hub} mm</code>. Bei mehr Hub schlägt der Hinterbau womöglich am Sitzrohr an, bei weniger fehlt Federweg.`,
             `Eye-to-eye matches, the stroke differs: <code>${rahmen.daempfer.hub} mm</code> vs <code>${daempfer.hub} mm</code>. With more stroke the rear end may hit the seat tube; with less you lose travel.`)));
    }
  }

  if(rahmen && laufraeder){
    if(laufraeder.lrV !== rahmen.lrV || laufraeder.lrH !== rahmen.lrH)
      out.push(F(tx("Laufradgrößen passen nicht zum Rahmen", "Wheel sizes don't match the frame"),"laufraeder",["rahmen","laufraeder"],
        tx(`Der Rahmen ist auf <code>${rahmen.lrV}″ vorn / ${rahmen.lrH}″ hinten</code> ausgelegt, der Satz bringt <code>${laufraeder.lrV}″ / ${laufraeder.lrH}″</code>.`,
           `The frame is designed for <code>${rahmen.lrV}″ front / ${rahmen.lrH}″ rear</code>, the wheelset is <code>${laufraeder.lrV}″ / ${laufraeder.lrH}″</code>.`)));
    if(laufraeder.ha !== rahmen.ha)

      out.push(H(tx("Wide-Spacer fürs DUB-Lager", "Wide spacers for the DUB bottom bracket"),"innenlager",["kurbel","innenlager"],
        tx(`Für die DUB-Wide-Kurbel im geschraubten Gehäuse bleibt das Lager dasselbe — SRAM liefert dafür ein eigenes Spacer-Kit (rund 5 €). Beim Einbau die Wide-Anordnung verwenden.`,
           `For the DUB Wide crank in a threaded shell the bearing stays the same — SRAM sells a dedicated spacer kit (about €5). Use the Wide spacer layout when fitting.`)));
  }
  if(hat("trial") && sel.length === 1 && kassette && kassette.gaenge > 1)
    out.push(W(tx("Kein Trial-Antrieb", "Not a trials drivetrain"),"kassette",["kassette"],
      tx(`Trial fährt eine feste Übersetzung um <code>18:12</code> mit dem Freilauf in der Kurbel — das erlaubt Kurbelstellung halten und Rückwärtstreten. Ein Schaltwerk ist dort Ballast und bricht beim ersten Pedal Kick.`,
         `Trials runs a fixed ratio around <code>18:12</code> with the freewheel in the crank — that lets you hold crank position and pedal backwards. A derailleur is dead weight there and breaks on the first pedal kick.`)));

  if(bremsen){
    if(bremsen.mount === "Felge"){
      if(rahmen && !rahmen.felgenbremse) out.push(F(tx("Rahmen hat keine Bremssockel", "Frame has no brake bosses"),"bremsen",["rahmen","bremsen"],
        tx(`Eine Felgenbremse braucht Sockel am Hinterbau. <code>${rahmen.n}</code> ist nur für Scheibenbremsen gebaut.`,
           `A rim brake needs bosses on the rear end. <code>${rahmen.n}</code> is built for disc brakes only.`)));
      if(laufraeder && !laufraeder.felgenbremse) out.push(F(tx("Felgen ohne Bremsflanke", "Rims without a braking surface"),"bremsen",["laufraeder","bremsen"],
        tx(`<code>${laufraeder.n}</code> hat keine Bremsflanke. Trial-Felgenbremsen brauchen zusätzlich eine gezahnte oder gefräste Flanke, sonst fehlt der Biss.`,
           `<code>${laufraeder.n}</code> has no braking surface. Trials rim brakes also need a serrated or ground sidewall, otherwise there's no bite.`)));
    } else {
      if(rahmen && bremsen.sH > rahmen.maxScheibeHR) out.push(F(tx("Bremsscheibe hinten zu groß", "Rear rotor too big"),"bremsen",["rahmen","bremsen"],
        tx(`Der Rahmen ist bis <code>${rahmen.maxScheibeHR} mm</code> freigegeben, die Bremse kommt mit <code>${bremsen.sH} mm</code>. Größere Scheiben hebeln am Hinterbau.`,
           `The frame is rated up to <code>${rahmen.maxScheibeHR} mm</code>, the brake comes with <code>${bremsen.sH} mm</code>. Bigger rotors put extra leverage on the rear end.`)));
      if(gabel && bremsen.sV > gabel.maxScheibeVR) out.push(F(tx("Bremsscheibe vorn zu groß für die Gabel", "Front rotor too big for the fork"),"bremsen",["gabel","bremsen"],
        tx(`Gabelfreigabe <code>${gabel.maxScheibeVR} mm</code>, montiert werden sollen <code>${bremsen.sV} mm</code>.`,
           `Fork rating <code>${gabel.maxScheibeVR} mm</code>, planned is <code>${bremsen.sV} mm</code>.`)));
      if(laufraeder && laufraeder.naben !== bremsen.mount) out.push(H(tx("Scheibenaufnahme abweichend", "Different rotor mount"),"bremsen",["laufraeder","bremsen"],
        tx(`Naben in <code>${laufraeder.naben}</code>, die Bremse kommt üblich mit <code>${bremsen.mount}</code>-Scheiben. Kein Problem — du brauchst nur Scheiben in der passenden Aufnahme (25–60 € je Scheibe).`,
           `Hubs are <code>${laufraeder.naben}</code>, the brake usually comes with <code>${bremsen.mount}</code> rotors. No problem — you just need rotors with the matching mount (€25–60 each).`)));
    }
    if((hat("enduro") || hat("dh")) && bremsen.kolben === 2)
      out.push(W(tx("Zwei Kolben für diesen Einsatz", "Two pistons for this kind of riding"),"bremsen",["bremsen"],
        tx(`Bei ${selNamen()} fadet eine 2-Kolben-Bremse auf langen Abfahrten spürbar. Kein Montagefehler, aber die erste Stelle, an der es unangenehm wird.`,
           `For ${selNamen()} a 2-piston brake fades noticeably on long descents. Not a fitting error, but the first place it gets uncomfortable.`)));
  }

  if(lenker && vorbau && lenker.klemm !== vorbau.klemm)
    out.push(F(tx("Lenkerklemmung passt nicht zum Vorbau", "Bar clamp doesn't match the stem"),"vorbau",["lenker","vorbau"],
      tx(`Lenker <code>${lenker.klemm} mm</code>, Vorbau <code>${vorbau.klemm} mm</code>. Ein 35er Lenker geht nicht in eine 31,8er Klemmung, und andersherum reißt es den Lenker heraus.`,
         `Bar <code>${lenker.klemm} mm</code>, stem <code>${vorbau.klemm} mm</code>. A 35 mm bar won't go into a 31.8 clamp, and the other way round the bar can rip out.`)));
  /* Direct-Mount-Vorbauten werden auf die obere Gabelbruecke geschraubt --

  if(gabel && vorbau && vorbau.dm && gabel.schaft !== "dc")
    out.push(F(tx("Direct-Mount-Vorbau braucht eine Doppelbrückengabel", "Direct-mount stem needs a dual-crown fork"),"vorbau",["gabel","vorbau"],
      tx(`<code>${vorbau.n}</code> wird auf die obere Gabelbrücke geschraubt. <code>${gabel.n}</code> hat nur eine Brücke — dafür braucht es einen Ahead-Vorbau, der den Gabelschaft klemmt.`,
         `<code>${vorbau.n}</code> bolts onto the upper crown. <code>${gabel.n}</code> has only one crown — it needs a threadless stem that clamps the steerer.`)));
  if(gabel && vorbau && !vorbau.dm && gabel.schaft === "dc")
    out.push(W(tx("Ahead-Vorbau an der Doppelbrücke", "Threadless stem on a dual crown"),"vorbau",["gabel","vorbau"],
      tx(`Doppelbrückengabeln werden mit Direct-Mount-Vorbau gefahren, der auf der oberen Brücke sitzt. Ein Ahead-Vorbau braucht Gabelschaft über der oberen Brücke — der ist bei DH-Gabeln meist bündig gekürzt.`,
         `Dual-crown forks run a direct-mount stem that sits on the upper crown. A threadless stem needs steerer above the upper crown — on DH forks that's usually cut flush.`)));
  if(sattel && sattel.oval)
    out.push(H(tx("Ovalstreben am Sattel", "Oval rails on the saddle"),"sattel",["sattel","stuetze"],
      tx(`<code>${sattel.n}</code> hat <code>${sattel.oval} mm</code> Ovalstreben und passt laut Hersteller auf Sattelstützen mit Klemmung von oben. Die Stütze braucht Klemmschalen für Ovalstreben — bei vielen Dropper-Posts liegen sie bei, sonst beim Hersteller nachkaufen.`,
         `<code>${sattel.n}</code> has <code>${sattel.oval} mm</code> oval rails and, per the maker, fits seatposts with top clamping. The post needs clamp cradles for oval rails — many droppers include them, otherwise order them from the manufacturer.`)));
  if(gabel && vorbau && gabel.schaft === "dc" && vorbau.laenge > 60)
    out.push(H(tx("Doppelbrücke mit langem Vorbau", "Dual crown with a long stem"),"vorbau",["gabel","vorbau"],
      tx(`Doppelbrückengabeln werden mit kurzen Direktmontage-Vorbauten gefahren. Alles über 60 mm macht das Vorderrad träge und den Fahrer kopflastig.`,
         `Dual-crown forks are run with short direct-mount stems. Anything over 60 mm makes the front wheel sluggish and puts the rider too far forward.`)));
  if((hat("enduro") || hat("dh")) && vorbau && vorbau.laenge >= 60)
    out.push(H(tx("Langer Vorbau für den Einsatzzweck", "Long stem for this kind of riding"),"vorbau",["vorbau"],
      tx(`<code>${vorbau.laenge} mm</code> schieben das Gewicht nach vorn. Im steilen Gelände willst du hinter dem Lenker stehen, nicht darüber.`,
         `<code>${vorbau.laenge} mm</code> push your weight forward. In steep terrain you want to be behind the bar, not over it.`)));
  if(hat("xc") && sel.length === 1 && lenker && lenker.breite >= 790)
    out.push(H(tx("Sehr breiter Lenker für XC", "Very wide bar for XC"),"lenker",["lenker"],
      tx(`<code>${lenker.breite} mm</code> geben Kontrolle, kosten Aerodynamik und passen nicht durch enge Waldpassagen.`,
         `<code>${lenker.breite} mm</code> give control, cost aerodynamics and don't fit through tight gaps between trees.`)));

  if(rahmen && stuetze && rahmen.stuetze != null){
    if(parseFloat(stuetze.d) !== rahmen.stuetze)
      out.push(F(tx("Stützendurchmesser passt nicht", "Seatpost diameter doesn't fit"),"stuetze",["rahmen","stuetze"],
        tx(`Sitzrohr <code>${rahmen.stuetze} mm</code>, Stütze <code>${stuetze.d} mm</code>. ${parseFloat(stuetze.d) < rahmen.stuetze ? "Eine Reduzierhülse gibt es, bei Dropperposts führt sie aber regelmäßig zu Verdrehen und Klemmen." : "Zu dick geht gar nicht — die Stütze passt schlicht nicht ins Rohr."}`,
           `Seat tube <code>${rahmen.stuetze} mm</code>, post <code>${stuetze.d} mm</code>. ${parseFloat(stuetze.d) < rahmen.stuetze ? "Shims exist, but with dropper posts they regularly cause twisting and sticking." : "Too thick simply won't work — the post won't go into the tube."}`)));
    if(stuetze.einbau > rahmen.einsteck)
      out.push(F(tx("Stütze lässt sich nicht weit genug versenken", "Seatpost can't be inserted far enough"),"stuetze",["rahmen","stuetze"],
        tx(`Sie braucht <code>${stuetze.einbau} mm</code> Einstecktiefe, das Sitzrohr gibt <code>${rahmen.einsteck} mm</code> her — ${stuetze.einbau - rahmen.einsteck} mm zu wenig. ${stuetze.hub > 0 ? "Kürzerer Hub oder eine Stütze mit externer Verstellung." : "Eine kürzere Stütze nehmen."}`,
           `It needs <code>${stuetze.einbau} mm</code> of insertion, the seat tube offers <code>${rahmen.einsteck} mm</code> — ${stuetze.einbau - rahmen.einsteck} mm short. ${stuetze.hub > 0 ? "Go for less drop or a post with external routing." : "Use a shorter post."}`)));
    else if(stuetze.hub > 0 && rahmen.einsteck - stuetze.einbau > 45){
      const mehr = Math.floor((rahmen.einsteck - stuetze.einbau)/30)*30;
      out.push(H(tx("Mehr Hub wäre möglich", "More drop would fit"),"stuetze",["rahmen","stuetze"],
        tx(`Es bleiben <code>${rahmen.einsteck - stuetze.einbau} mm</code> Reserve im Sitzrohr. Rechnerisch passt eine Stütze mit rund <code>${stuetze.hub + mehr} mm</code> Hub — mehr Absenkung kostet nichts an Fahrbarkeit.`,
           `There's <code>${rahmen.einsteck - stuetze.einbau} mm</code> left in the seat tube. On paper a post with about <code>${stuetze.hub + mehr} mm</code> of drop fits — more drop costs nothing in rideability.`)));
    }
    if(stuetze.hub === 0 && (hat("trail") || hat("enduro")))
      out.push(W(tx("Starre Stütze", "Rigid seatpost"),"stuetze",["stuetze"],
        tx(`Bei ${selNamen()} ist eine versenkbare Stütze das wirksamste Bauteil pro Euro. Alles andere vorher zu optimieren ist die falsche Reihenfolge.`,
           `For ${selNamen()} a dropper post is the most effective part per euro. Optimising anything else first is the wrong order.`)));
    if(stuetze.hub > 0 && (hat("dirt") || hat("slope")) && !hat("trail") && !hat("enduro"))
      out.push(W(tx("Dropper im Dirtpark", "Dropper at the dirt jumps"),"stuetze",["stuetze"],
        tx(`Im Dirt und Slopestyle fährst du die Stütze ganz unten und nie wieder hoch. Eine Dropper ist dort rund ${Math.max(0, stuetze.g - 190)} g Ballast, ein Hebel mehr am Lenker und ein Bauteil, das beim Sturz bricht.`,
           `On dirt jumps and slopestyle the post stays slammed and never comes back up. A dropper there is about ${Math.max(0, stuetze.g - 190)} g of dead weight, one more lever on the bar and a part that breaks in a crash.`)));
  }

  const fehlend = SLOTS.filter(s => !b[s.k] && !entfaellt(b, s.k));
  const garNichts = fehlend.length === SLOTS.filter(s => !entfaellt(b, s.k)).length;
  if(fehlend.length && !garNichts) out.push(W(tx("Aufbau unvollständig", "Build incomplete"),"",fehlend.map(s => s.k),
    tx("Offen: ", "Missing: ") + fehlend.map(s => "<code>" + s.label + "</code>").join(", ") + tx(". Bewertet wird nur, was drin ist.", ". Only what's in the build gets scored.")));
  return out;
}

/* ═══════════ 6 · Bewertung ═══════════ */

const ABZUG = {fehler:26, warnung:9, hinweis:2};
const eignung = t => { if(!t || !t.e) return 0; let s = 0; for(const d of sel) s += t.e[d] || 0; return s/sel.length; };

function bewerte(b){
  const funde = pruefe(b);
  let tech = 100;
  for(const f of funde) tech -= ABZUG[f.level];
  tech = Math.max(0, Math.min(100, tech));

  let sum = 0, gew = 0, schwach = null, schwachV = 99;
  let gewicht = 0, preis = 0, teile = 0, moeglich = 0;
  for(const s of SLOTS){
    if(entfaellt(b, s.k)) continue;
    moeglich++;
    const teil = b[s.k] ? findeTeil(s.k, b[s.k]) : null;
    if(!teil) continue;
    teile++; gewicht += teil.g || 0; preis += preisVon(teil);
    if(!teil.e || !s.gew) continue;                  /* Innenlager: zaehlt nicht zum Charakter */
    const eig = eignung(teil);
    sum += eig * s.gew; gew += s.gew;
    if(eig < schwachV){ schwachV = eig; schwach = {slot:s, teil:teil, eig:eig}; }
  }
  const chara = gew ? Math.max(0, Math.round(sum/gew/5*100)) : 0;
  return {funde:funde, tech:Math.round(tech), chara:chara,
          gesamt:Math.round(tech*0.62 + chara*0.38),
          gewicht:gewicht, preis:preis, teile:teile, moeglich:moeglich, schwach:schwach};
}
const harteFehler = b => pruefe(b).filter(f => f.level === "fehler").length;
function echteFehler(b){
  return pruefe(b).filter(f => f.level === "fehler" &&
    f.slots.every(k => !SLOTS.some(s => s.k === k) || b[k] || entfaellt(b, k))).length;
}

/* Klartext statt Fachwort an den Befunden */
const STUFE = zweisprachig({fehler:["passt nicht", "doesn't fit"], warnung:["Kompromiss", "compromise"], hinweis:["Tipp", "tip"]}, ["fehler", "warnung", "hinweis"]);
function urteil(r){
  const zn = selNamen();
  /* Ein leeres Rad hat keinen Zustand, ueber den sich urteilen liesse. Vorher
     stand hier "Sauberer Aufbau" neben null Teilen -- eine Note fuer nichts. */
  if(r.teile === 0) return modus === "real"
    ? tx(`Noch nichts eingetragen. <b>Fang beim Rahmen an.</b>`, `Nothing entered yet. <b>Start with the frame.</b>`)
    : tx(`Noch keine Teile gewählt.`, `No parts chosen yet.`);
  const fehler = r.funde.filter(f => f.level === "fehler").length;
  if(fehler > 1) return tx(`<b>${fehler} Teile passen nicht zusammen.</b> So fährt das Rad nicht.`, `<b>${fehler} parts don't fit together.</b> The bike won't ride like this.`);
  if(fehler === 1) return modus === "traum" ? tx(`<b>Ein harter Konflikt.</b> Der muss weg, bevor du bestellst.`, `<b>One hard conflict.</b> Fix it before you order.`)
    : tx(`<b>Ein harter Konflikt.</b> Prüf, ob das am Rad wirklich so verbaut ist.`, `<b>One hard conflict.</b> Check that it's really fitted like that on the bike.`);
  if(plan.budget > 0 && r.preis > plan.budget) return tx(`<b>${eur(r.preis - plan.budget)} über Budget.</b> Technisch sauber, aber zu teuer.`, `<b>${eur(r.preis - plan.budget)} over budget.</b> Technically clean, but too expensive.`);
  if(r.chara < 55 && r.schwach) return tx(`Technisch sauber, aber uneinig: <b>${r.schwach.slot.label}</b> zieht in eine andere Richtung als ${zn}.`,
    `Technically clean, but mixed: the <b>${r.schwach.slot.label.toLowerCase()}</b> pulls in a different direction than ${zn}.`);
  if(r.tech < 90) return tx(`Fahrbar, mit Kompromissen. Der Reiter Prüfung sagt, welche.`, `Rideable, with compromises. The Check tab tells you which.`);
  if(r.chara >= 85) return tx(`<b>Stimmig.</b> Alles zieht in Richtung ${zn}.`, `<b>Spot on.</b> Everything pulls towards ${zn}.`);
  return tx(`Sauberer Aufbau für ${zn}.`, `Clean build for ${zn}.`);
}

/* ═══════════ Gebrauchtwert ═══════════
   Ein Rad ist gebraucht selten mehr wert als die Summe seiner Teile, abgezinst
   um das Alter, korrigiert um den Zustand, minus dem, was der Käufer sofort
   nachkaufen muss. Genau so wird hier gerechnet -- kein Bauchgefühl, sondern
   die Teilepreise, die ohnehin im Katalog stehen.

   Die Kurve 0,13 + 0,72 · 0,76^Jahre bildet ab, was am Gebrauchtmarkt passiert:
   im ersten Jahr bricht rund ein Drittel weg, danach flacht es ab, und unter
   etwa 13 Prozent des Neupreises fällt ein fahrbares Rad praktisch nie. */
const restwertFaktor = a => 0.13 + 0.72 * Math.pow(0.76, a);
/* Die Summe der Einzelpreise ist NICHT der Preis eines Komplettrads. Hersteller
   zahlen fuer dieselben Teile als Erstausruestung einen Bruchteil des
   Ladenpreises und geben das weiter -- ein Rad, dessen Teile einzeln 6.500 Euro
   kosten, steht als Komplettrad fuer gut 4.500 im Laden. Ohne diesen Faktor
   haette die App jedes Angebot zu positiv bewertet. */
const KOMPLETTRAD = 0.72;

function marktWert(b){
  const r = bewerte(b);
  if(!r.teile) return null;
  const teileEinzeln = r.preis;
  const neu = Math.round(teileEinzeln * KOMPLETTRAD);
  const alter = Math.max(0, AKTUELL - jahrWahl.markt);
  const rw = restwertFaktor(alter);
  const z = (ZUSTAENDE.find(x => x.v === markt.zustand) || ZUSTAENDE[1]).f;

  /* Veraltete Standards kosten am Gebrauchtmarkt mehr als ihr technischer
     Nachteil: wer kauft, denkt schon an die nächsten Ersatzteile. */
  const f = b.rahmen ? findeTeil("rahmen", b.rahmen) : null;
  const abzuege = [];
  if(f){
    const sportlich = (f.e.xc + f.e.trail + f.e.enduro + f.e.dh) > 0;
    if(sportlich && (f.lrV === "26" || f.lrH === "26"))
      abzuege.push({t:tx("26 Zoll", "26 inch"), f:0.12, g:tx("Für 26″ gibt es kaum noch Gabeln und Auswahl bei Reifen.", "There are hardly any forks left for 26″, and little choice in tyres.")});
    if(sportlich && (f.ha === "142x12" || f.ha === "135x10"))
      abzuege.push({t:tx("kein Boost", "no Boost"), f:0.08, g:tx("Vor-Boost-Hinterbau: aktuelle Laufräder und Kurbeln passen nicht ohne Weiteres.", "Pre-Boost rear end: current wheels and cranks don't simply fit.")});
    if(sportlich && f.schaft === "gerade" && f.maxGabel > 0)
      abzuege.push({t:tx("gerades Steuerrohr", "straight head tube"), f:0.05, g:tx("Aktuelle Federgabeln haben konische Schäfte.", "Current suspension forks have tapered steerers.")});
  }
  let stdF = 1;
  for(const a of abzuege) stdF *= (1 - a.f);

  let vsRoh = 0; const vsListe = [];
  for(const v of VERSCHLEISS) if(markt.verschleiss[v.k]){ vsRoh += v.kosten; vsListe.push(v); }

  const basis = neu * rw * z * stdF;
  /* Verschleiss wird gedeckelt. In ein sieben Jahre altes Rad baut niemand
     Neuteile zum Ladenpreis -- ungedeckelt kam hier rechnerisch ein Wert von
     null heraus, obwohl das Rad faehrt und allein die Teile noch Geld bringen.
     Darunter liegt ein Boden: ein komplettes, rollendes Rad ist nie wertlos. */
  const deckel = basis * 0.45;
  const vs = Math.min(vsRoh, deckel);
  const gedeckelt = vsRoh > deckel;
  const wert = Math.max(Math.round(neu * 0.08), Math.round(basis - vs));
  return {teileEinzeln:teileEinzeln, neu:neu, alter:alter, rw:rw, z:z, stdF:stdF, gedeckelt:gedeckelt,
          abzuege:abzuege, vs:Math.round(vs), vsRoh:vsRoh, vsListe:vsListe,
          basis:Math.round(basis), wert:wert,
          unten:Math.round(wert*0.85), oben:Math.round(wert*1.15), befunde:r.funde};
}

function preisUrteil(preis, m){
  const q = m.wert > 0 ? preis / m.wert : 99;
  if(q <= 0.70) return {k:"schnaeppchen", kopf:tx("Schnäppchen", "Bargain"),
    txt:tx("Deutlich unter dem, was die Teile gebraucht wert sind. Wenn der Zustand stimmt, zuschlagen — aber vorher ansehen.",
           "Well below what the parts are worth used. If the condition checks out, grab it — but look at it first.")};
  if(q <= 0.88) return {k:"gut", kopf:tx("Guter Preis", "Good price"),
    txt:tx("Unter Marktwert. Bei dem Preis lohnt sich die Anfahrt.", "Below market value. At this price it's worth the trip.")};
  if(q <= 1.12) return {k:"fair", kopf:tx("Marktüblich", "Market price"),
    txt:tx("Im normalen Rahmen. Handeln kann sich lohnen, ein Schnäppchen ist es nicht.", "Within the normal range. Haggling may pay off, but it's no bargain.")};
  if(q <= 1.35) return {k:"teuer", kopf:tx("Zu teuer", "Too expensive"),
    txt:tx("Über dem, was die Teile hergeben. Entweder runterhandeln oder weitersuchen.", "More than the parts are worth. Haggle it down or keep looking.")};
  return {k:"schlecht", kopf:tx("Deutlich überteuert", "Heavily overpriced"),
    txt:tx("Der Preis hat mit dem Wert der Teile nichts mehr zu tun. Finger weg oder hart verhandeln.", "The price has nothing to do with what the parts are worth. Walk away or haggle hard.")};
}

/* ═══════════ Gleiche Maße, weniger Geld ═══════════
   Was an einem Bauteil das Maß ist, haengt vom Bauteil ab. Bei einem Vorbau
   sind es Klemmung und Laenge, bei einem Daempfer Einbaulaenge und Hub, bei
   einem Laufradsatz Achsen und Freilauf. "hart" muss exakt stimmen, sonst passt
   es schlicht nicht. "weich" darf abweichen -- 20 mm Lenkerbreite merkt man,
   aber sie machen das Teil nicht unbrauchbar. Jede weiche Abweichung wird
   angezeigt, damit niemand blind tauscht. */
const MASSE = {
  rahmen:     {hart:["lrV","lrH","schaft","ha","bb","stuetze","udh"], weich:{maxGabel:[["mm Gabelfreigabe","mm fork rating"],10], einsteck:[["mm Einstecktiefe","mm insertion"],15]}},
  gabel:      {hart:["schaft","va"], weich:{travel:[["mm Federweg","mm travel"],10], offset:["mm Offset",6]}},
  daempfer:   {hart:["el","hub","typ"], weich:{}},
  laufraeder: {hart:["lrV","lrH","va","ha","freilauf"], weich:{iw:[["mm Maulweite","mm inner width"],2]}},
  reifenVR:   {hart:[], weich:{breite:[["mm Breite","mm width"],3], grip:["Grip",1]}},
  reifenHR:   {hart:[], weich:{breite:[["mm Breite","mm width"],3], grip:["Grip",1]}},
  schalthebel:{hart:["iface","gaenge"], weich:{}},
  schaltwerk: {hart:["iface","gaenge","udhPflicht"], weich:{maxRitzel:[["Z. max.","T max."],2], maxKB:[["Z. vorn","T front"],4]}},
  kassette:   {hart:["freilauf","gaenge","tType","linkglide"], weich:{}},
  kette:      {hart:["gaenge","iface"], weich:{}},
  kurbel:     {hart:["kl","gaenge","iface"], weich:{kb:[["Zähne","teeth"],2], laenge:[["mm Länge","mm length"],5]}},
  bremsen:    {hart:["mount","kolben"], weich:{sV:[["mm Scheibe vorn","mm front rotor"],23], sH:[["mm Scheibe hinten","mm rear rotor"],23]}},
  lenker:     {hart:["klemm"], weich:{breite:[["mm Breite","mm width"],20], rise:["mm Rise",10]}},
  vorbau:     {hart:["klemm","dm"], weich:{laenge:[["mm Länge","mm length"],10]}},
  stuetze:    {hart:["d","hub"], weich:{einbau:[["mm Einstecktiefe","mm insertion"],15]}},
  sattel:     {hart:[], weich:{}},
  innenlager: {hart:["welle"], weich:{}},
  pedale:     {hart:["typ","sys"], weich:{}},
  griffe:     {hart:["bef"], weich:{}}
};

/* Liefert null, wenn das Teil nicht als Ersatz taugt -- sonst die Liste der
   weichen Abweichungen (leer = wirklich dasselbe Mass). */
function massGleich(slotKey, jetzt, kand){
  const m = MASSE[slotKey];
  if(!m) return null;
  for(const f of m.hart) if(String(jetzt[f]) !== String(kand[f])) return null;
  const ab = [];
  for(const f in m.weich){
    const [txt, tol] = m.weich[f];
    const d = (kand[f] || 0) - (jetzt[f] || 0);
    if(Math.abs(d) > tol) return null;
    if(d) ab.push((d > 0 ? "+" : "−") + Math.abs(d) + " " + sp2(txt));
  }
  return ab;
}

/* Guenstigere Teile, die dasselbe Mass halten und keinen neuen Konflikt bringen. */
function guenstigere(slotKey, b){
  /* Sparen gibt es nur beim Planen: am eigenen Rad und beim Angebot sind die
     Teile schon gekauft -- "tausch deine Fox 36 gegen eine billigere" ist dort
     kein Rat. Und ein Teil mit Konflikt wird erst repariert, nicht billiger
     in derselben falschen Groesse ersetzt. */
  if(modus !== "traum") return [];
  const jetzt = b[slotKey] ? findeTeil(slotKey, b[slotKey]) : null;
  if(!jetzt || entfaellt(b, slotKey)) return [];
  if(pruefe(b).some(f => f.level === "fehler" && f.slots.indexOf(slotKey) >= 0)) return [];
  const basis = harteFehler(b), preis = preisVon(jetzt);
  const out = [];
  for(const kand of kandidaten(slotKey, b)){
    if(basisVon(kand.id) === basisVon(jetzt.id)) continue;
    const spart = preis - preisVon(kand);
    if(spart < Math.max(8, preis * 0.05)) continue;      /* unter 5 % lohnt der Tausch nicht */
    const ab = massGleich(slotKey, jetzt, kand);
    if(!ab) continue;
    const dEig = eignung(jetzt) - eignung(kand);
    if(dEig > 1.5) continue;                             /* anderes Teil, kein Ersatz */
    if(dEig >= 0.5) ab.push(tx("einfacher für ", "simpler for ") + selNamen());
    const probe = {...b}; probe[slotKey] = kand.id;
    if(harteFehler(probe) > basis) continue;
    out.push({teil:kand, spart:spart, ab:ab, gd:(kand.g||0) - (jetzt.g||0)});
  }
  return out.sort((a, c) => c.spart - a.spart);
}

/* Ueber den ganzen Aufbau: wo liegt Geld, ohne dass sich am Mass etwas aendert. */
function sparPlan(b){
  const out = [];
  for(const sl of SLOTS){
    const g = guenstigere(sl.k, b);
    if(g.length) out.push({slot:sl, ...g[0], anzahl:g.length});
  }
  return out.sort((a, c) => c.spart - a.spart);
}

/* ═══════════ 7 · Traumrad-Generator ═══════════ */

const MARKEN = {
  schalt:{slots:["schalthebel","schaltwerk","kassette","kette","kurbel"], opts:["Shimano","SRAM"], label:["Schaltung & Kurbel", "Drivetrain & crank"]},
  brems: {slots:["bremsen"],          opts:["Shimano","SRAM","Magura","Hope","TRP"], label:["Bremsen", "Brakes"]},
  fed:   {slots:["gabel","daempfer"], opts:["RockShox","Fox","Marzocchi"], label:["Federung", "Suspension"]}
};
for(const k in MARKEN) zweisprachig(MARKEN[k], ["label"]);
/* Vorlieben aus Onboarding und Assistent: Laufradgroesse, Hardtail oder
   Fully, Flat- oder Klickpedal. Sie gelten, wo sie zur Disziplin passen --
   ein Downhiller wird kein Hardtail, weil jemand beim Trailrad eins mochte.
   Laufradgroesse nur fuer XC bis DH (Dirt und Trial haben eigene Groessen),
   Federung nur fuer XC und Trail, wo es beides gibt. */
const lrGilt = () => sel.every(d => d === "xc" || d === "trail" || d === "enduro" || d === "dh");
function vorliebeOk(slotKey, t){
  if(!t) return true;
  if(slotKey === "rahmen"){
    if(plan.lr && lrGilt()){
      const w = plan.lr === "mullet" ? ["29", "27.5"] : [plan.lr, plan.lr];
      if(t.lrV !== w[0] || t.lrH !== w[1]) return false;
    }
    if(plan.federung && fullyAb() && t.maxGabel > 0 && (plan.federung === "fully") !== !!t.daempfer) return false;
  }
  if(slotKey === "pedale" && plan.pedal && t.typ !== plan.pedal) return false;
  return true;
}
function markenWunsch(slotKey){
  if(MARKEN.schalt.slots.indexOf(slotKey) >= 0) return plan.mSchalt;
  if(MARKEN.brems.slots.indexOf(slotKey)  >= 0) return plan.mBrems;
  if(MARKEN.fed.slots.indexOf(slotKey)    >= 0) return plan.mFed;
  return "";
}
/* Namenlose Teile (Singlespeed-Ritzel, Trial-Kurbel) sind keine Gegenmarke --
   die gibt es von Shimano oder SRAM gar nicht */
const vonWunschmarke = (slotKey, t) => { const wu = markenWunsch(slotKey);
  return !wu || t.m === wu || t.m === "Generisch" || t.m === "Trial"; };
/* Robustheit: je Slot das, was den Aufbau wirklich haltbar macht */
function robustN(t, slotKey, gMin, gMax){
  if(slotKey === "laufraeder") return Math.min(1, Math.max(0, (t.maxSys - 105)/50));
  if(slotKey === "bremsen")    return Math.min(1, (t.kolben === 4 ? .6 : .1) + (t.sV >= 200 ? .4 : t.sV >= 180 ? .2 : 0));
  if(slotKey === "reifenVR" || slotKey === "reifenHR") return Math.min(1, t.grip/5);
  return gMax > gMin ? ((t.g||0) - gMin)/(gMax - gMin) : .5;  /* schwerer = meist stabiler */
}
/* Qualität eines Teils ohne Preisbezug — Grundlage aller Tauschentscheidungen */
function qualMap(slotKey){
  const liste = katalog(quelleOf(slotOf(slotKey)));
  let gMin = Infinity, gMax = 0, pMin = Infinity, pMax = 0;
  for(const t of liste){
    gMin = Math.min(gMin, t.g||0); gMax = Math.max(gMax, t.g||0);
    pMin = Math.min(pMin, grundpreis(t)); pMax = Math.max(pMax, grundpreis(t));
  }
  const wunsch = markenWunsch(slotKey), m = {};
  for(const t of liste){
    let q = eignung(t) * 20;
    /* Ein Markenwunsch gilt fuer Markenteile. Ein namenloses Singlespeed-Ritzel
       oder Trial-Teil ist keine Gegenmarke -- das gibt es von Shimano gar nicht. */
    if(wunsch && t.m !== "Generisch" && t.m !== "Trial") q += (t.m === wunsch) ? 30 : -18;
    const gN = gMax > gMin ? (gMax - (t.g||0))/(gMax - gMin) : .5;
    const pN = pMax > pMin ? (pMax - grundpreis(t))/(pMax - pMin) : .5;
    if(plan.prio === "leicht") q += gN * 22;
    if(plan.prio === "pl")     q += pN * 22;
    if(plan.prio === "robust") q += robustN(t, slotKey, gMin, gMax) * 22;
    m[t.id] = q;
  }
  return m;
}

/* Reihenfolge nach Abhängigkeit: erst was andere Teile festlegt. */
/* Der Vorbau vor dem Lenker: an der Doppelbrueckengabel ist er Direct Mount
   und legt die Klemmung fest -- der Lenker richtet sich danach. */
const BAUFOLGE = ["rahmen","daempfer","gabel","kassette","schaltwerk","schalthebel","kette","kurbel","innenlager","laufraeder",
                  "reifenVR","reifenHR","bremsen","vorbau","lenker","stuetze","sattel","pedale","griffe"];

/* Disziplintreue: Wer ein Downhill-Rad will, bekommt Downhill-Teile -- nicht
   das Enduro-Teil, nur weil es billiger ist. Je Slot kommen nur Teile in
   Frage, die fuer die gewaehlten Disziplinen (fast) so gut taugen wie das
   beste passende Teil. Rahmen und Fahrwerk ohne Abstrich; Laufraeder,
   Reifen und Bremsen bei Downhill ebenso, weil dort Sicherheit dranhaengt;
   sonst ein Punkt Luft. Reicht das Budget dafuer nicht, bleibt der Aufbau
   richtig und die App sagt, was die Disziplin kostet. */
/* Ab welchem Budget ein Fully die richtige Wahl ist -- nur fuer Disziplinen,
   in denen es beides gibt. Bei gemischter Wahl zaehlt die hoechste Schwelle. */
const FULLY_AB = {xc:5500, trail:4000};          /* guenstigster sauberer Fully-Aufbau im Katalog */
const fullyAb = () => sel.some(d => !(d in FULLY_AB)) ? 0 : Math.max.apply(null, sel.map(d => FULLY_AB[d]));
const TREUE_KERN = ["rahmen", "gabel", "daempfer"];
const TREUE_GRAVITY = ["laufraeder", "reifenVR", "reifenHR", "bremsen"];
/* lockern: 0 = ohne Abstrich; 1 = Laufraeder, Reifen, Bremsen, Cockpit eine
   Stufe einfacher; 2 = die Kleinteile noch eine Stufe. Rahmen, Gabel und
   Daempfer bleiben immer, was die Disziplin verlangt -- ein Downhiller mit
   Enduro-Rahmen und Einfachbruecke ist kein guenstiger Downhiller, sondern
   ein anderes Rad. Bei Downhill bleiben Laufraeder, Reifen und Bremsen
   hoechstens eine Stufe darunter. Nur wenn das Budget sonst nicht haelt.
   Bei gemischten Disziplinen ist der Rahmen ohnehin ein Kompromiss -- dort
   darf er auf der letzten Stufe einen Punkt vom Mischideal abweichen, sonst
   bliebe fuer XC + Trail nur das teure Downcountry-Fully. */
const treueLuft = (k, lockern) => {
  if(TREUE_KERN.indexOf(k) >= 0) return sel.length > 1 && lockern >= 2 ? 1 : 0;
  const gravity = hat("dh") && TREUE_GRAVITY.indexOf(k) >= 0;
  return (gravity ? 0 : 1) + Math.min(lockern || 0, gravity ? 1 : 2);
};

/* Das Budget ist eine Grenze: hoechstens 100 Euro darueber. Passt der saubere
   Aufbau nicht, sucht der Assistent zuerst beim Modelljahr des Rahmens --
   Vorjahresmodell im Abverkauf, aeltere Rahmen zum Gebrauchtpreis -- und erst
   danach bei einfacheren Teilen, nie bei Rahmen und Fahrwerk. Was er davon
   gebraucht hat, steht in generiereInfo und im Ergebnis des Assistenten. */
const BUDGET_LUFT = 100;
/* Guenstigster disziplintreuer Aufbau je Disziplin, gemessen mit dem
   Pruefstand am 2026-09-25 (ohne Markenwunsch), auf 50 Euro aufgerundet.
   Nur fuer die Orientierung im Assistenten -- die echte Rechnung macht
   generiere(). Bei gemischter Wahl zaehlt der hoechste Wert. */
const MINDEST = {xc:2350, trail:1850, enduro:2600, dh:4700, dirt:1650, slope:2550, trial:1800};
const mindestPreis = () => Math.max.apply(null, sel.map(d => MINDEST[d] || 0));
let generiereInfo = null, letzteTreue = {};
/* Rahmen-Vorlieben (Laufradgroesse, Federung) sind Wuensche, keine Pflicht:
   Sprengen sie das Budget, obwohl es ohne sie passt, baut der Assistent ohne
   sie und sagt es (generiereInfo.vorliebeBudget). */
function generiere(){
  const b = generiereMitBudget();
  /* Nur nachrechnen, wenn der Wunsch hier ueberhaupt gilt und das Budget fuer
     die Disziplin reichen kann -- sonst waere es doppelte Arbeit fuer nichts */
  const wunsch = (plan.lr && lrGilt()) || (plan.federung && fullyAb());
  if(!(plan.budget > 0) || !wunsch || generiereInfo.preis <= generiereInfo.grenze || plan.budget + BUDGET_LUFT <= mindestPreis()) return b;
  const info = generiereInfo, alt = {lr:plan.lr, federung:plan.federung};
  plan.lr = ""; plan.federung = "";
  let b2;
  try{ b2 = generiereMitBudget(); } finally { plan.lr = alt.lr; plan.federung = alt.federung; }
  if(generiereInfo.preis <= generiereInfo.grenze){ generiereInfo.vorliebeBudget = true; return b2; }
  generiereInfo = info;
  return b;
}
function generiereMitBudget(){
  /* Der Assistent baut neu: Start beim aktuellen Modelljahr, egal welches Jahr
     der letzte Aufbau hatte -- aeltere Jahre sind nur ein Hebel fuers Budget */
  const jahrVorher = jahrWahl[modus], jahr0 = AKTUELL;
  let best = null;
  try{
    if(!(plan.budget > 0)){
      jahrWahl[modus] = jahr0;
      const b = generiereKern(0);
      generiereInfo = {jahr:jahr0, lockern:0, preis:summe(b), budget:0, grenze:Infinity, abstriche:[]};
      return b;
    }
    const budget = plan.budget, grenze = budget + BUDGET_LUFT;
    /* sparsam: der zweite Versuch je Stufe verteilt nur 70 % des Budgets auf
       die Slots -- die Suche landet sonst gern bei teureren Kombinationen,
       obwohl es guenstigere gibt */
    for(const lockern of [0, 1, 2]) for(const sparsam of [1, 0.7]){
      for(const y of [jahr0, jahr0 - 1, jahr0 - 2, jahr0 - 3]){
        jahrWahl[modus] = y;
        const b = generiereKern(lockern, sparsam);
        const preis = summe(b);
        const abstriche = lockern ? SLOTS.filter(sl => {
          const t = b[sl.k] ? findeTeil(sl.k, b[sl.k]) : null, tr = letzteTreue[sl.k];
          return t && t.e && tr && eignung(t) < tr.eMax - treueLuft(sl.k, 0) - 1e-9;
        }).map(sl => sl.label) : [];
        const kand = {b:b, jahr:y, lockern:lockern, preis:preis, budget:budget, grenze:grenze, abstriche:abstriche};
        if(!best || preis < best.preis - 0.5) best = kand;
        if(preis <= grenze){ generiereInfo = kand; return b; }
      }
    }
    /* Passt nichts: den wirklich guenstigsten Aufbau suchen, damit die Ansage
       "mindestens X Euro" stimmt -- mit anderer Budgetverteilung findet die
       Suche oft eine billigere Kombination */
    for(const sparsam of [1.5, 2.5]) for(const y of [jahr0, jahr0 - 1, jahr0 - 2, jahr0 - 3]){
      jahrWahl[modus] = y;
      const b = generiereKern(2, sparsam), preis = summe(b);
      if(preis < best.preis - 0.5){
        const abstriche = SLOTS.filter(sl => { const t = b[sl.k] ? findeTeil(sl.k, b[sl.k]) : null, tr = letzteTreue[sl.k];
          return t && t.e && tr && eignung(t) < tr.eMax - treueLuft(sl.k, 0) - 1e-9; }).map(sl => sl.label);
        best = {b:b, jahr:y, lockern:2, preis:preis, budget:budget, grenze:grenze, abstriche:abstriche};
      }
    }
    generiereInfo = best;
    return best.b;
  } finally { jahrWahl[modus] = jahrVorher; }
}

function generiereKern(lockern, sparsam){
  const b = {};
  for(const s of SLOTS) b[s.k] = null;
  const budget = plan.budget > 0 ? plan.budget : 3500, zielBudget = budget * (sparsam || 1);
  letzteTreue = {};
  const quals = {};
  for(const s of SLOTS) quals[s.k] = qualMap(s.k);

  /* Anteil neu verteilen, wenn Slots am Rahmen entfallen */
  const anteilVon = k => {
    let rest = 0, mein = slotOf(k).anteil;
    for(const s of SLOTS) if(entfaellt(b, s.k)) rest += s.anteil;
    return rest > 0 && rest < 1 ? mein / (1 - rest) : mein;
  };

  const treue = {};
  for(const k of BAUFOLGE){
    if(entfaellt(b, k)) continue;
    const s = slotOf(k), ziel = zielBudget * anteilVon(k);
    const vorher = bilanz(b);
    const rr = b.rahmen ? findeTeil("rahmen", b.rahmen) : null;
    let beste = null, besteS = -1e9, ersatz = null, ersatzS = -1e9;
    /* Die Kassette kommt vor dem Schaltwerk. Eine T-Type-Kassette verlangt
       aber Transmission und damit UDH -- ohne UDH am Rahmen bliebe danach
       kein Schaltwerk, das passt. */
    let liste = kandidaten(k, b).filter(t => !(k === "kassette" && t.tType && !udhDa(rr))).map(t => grosseScheiben(k, t, b));
    /* An die Doppelbruecke gehoert ein Direct-Mount-Vorbau -- der Gabelschaft
       endet dort buendig. Ein besseres Ahead-Modell hilft da nicht. */
    const gg = b.gabel ? findeTeil("gabel", b.gabel) : null;
    if(k === "vorbau" && gg && gg.schaft === "dc" && liste.some(t => t.dm)) liste = liste.filter(t => t.dm);
    /* Aelteres Modelljahr nur fuer Rahmen, die es damals schon so gab */
    const damals = t => !(t.seit && jahrAktiv() < t.seit);
    if(k === "rahmen" && liste.some(damals)) liste = liste.filter(damals);
    /* Vorlieben, wo es passende Teile gibt -- beim Rahmen nur unter denen, die
       zur Disziplin taugen: ein Wunsch nach 27,5″ macht aus dem Downhiller
       kein Hardtail */
    const eAlle = k === "rahmen" && liste.length ? Math.max.apply(null, liste.map(eignung)) : 0;
    const vok = liste.filter(t => vorliebeOk(k, t) && (k !== "rahmen" || eignung(t) >= eAlle - 1));
    if(vok.length) liste = vok;
    /* Eine Kurbel nur, wenn es fuer ihre Welle ein Lager in diesem Rahmen gibt */
    if(k === "kurbel" && liste.some(t => lagerDa(t, rr))) liste = liste.filter(t => lagerDa(t, rr));
    let bewertet = liste.map(t => { const probe = {...b}; probe[k] = t.id; return {t:t, neu:bilanz(probe)}; });
    /* Markenwunsch ist eine Vorgabe, kein Bonus: gibt es von der Wunschmarke
       ein Teil, das sauber passt, kommen nur ihre Teile in Frage. Gegen die
       Kompatibilitaet wird er nie durchgedrueckt -- hat die Marke nur Teile mit
       Kompromiss (etwa keine Dirt-Kurbel), nimmt er das saubere Teil einer
       anderen Marke, und das Ergebnis sagt es. */
    if(markenWunsch(k)){
      const ok = x => x.neu.f <= vorher.f, glatt = x => ok(x) && x.neu.w <= vorher.w;
      const marke = x => vonWunschmarke(k, x.t);
      if(bewertet.some(x => marke(x) && glatt(x)) || (!bewertet.some(glatt) && bewertet.some(x => marke(x) && ok(x))))
        bewertet = bewertet.filter(marke);
    }
    /* Treue-Schwelle: bestes Teil unter denen, die keinen neuen Fehler bringen */
    /* gemessen an Teilen ohne neuen Fehler -- und, wenn es die gibt, auch ohne
       neue Warnung: ein stimmiger Antrieb schlaegt ein besseres Einzelteil,
       das nicht zum Rest passt */
    const sauber = bewertet.filter(x => x.neu.f <= vorher.f);
    const ganzSauber = sauber.filter(x => x.neu.w <= vorher.w && x.t.e);
    const mitE = ganzSauber.length ? ganzSauber : (sauber.length ? sauber : bewertet).filter(x => x.t.e);
    if(mitE.length){
      const eMax = Math.max.apply(null, mitE.map(x => eignung(x.t)));
      treue[k] = eMax - treueLuft(k, lockern) - 1e-9;
      letzteTreue[k] = {eMax:eMax};
    }
    /* Die Kassette legt Gaenge und damit die Kurbel fest. Vorausschauen: gibt
       es danach eine Kurbel, die ohne Fehler und Warnung passt? Sonst bleibt
       am Ende nur ein Kompromiss -- etwa ein geschaltetes Ritzelpaket am
       135-mm-Dirtrahmen, fuer das keine Kurbel die Kettenlinie trifft. */
    if(k === "kassette" && !entfaellt(b, "kurbel")){
      /* alle Marken: hat die Wunschmarke keine saubere Kurbel, nimmt der
         Kurbel-Schritt ohnehin eine andere (siehe Markenwunsch unten) */
      const mitLager = kandidaten("kurbel", b).filter(c => lagerDa(c, rr));
      const kurbeln = mitLager.length ? mitLager : kandidaten("kurbel", b);
      const eK = Math.max.apply(null, kurbeln.filter(c => c.e).map(eignung));
      const guteKurbeln = kurbeln.filter(c => !c.e || eignung(c) >= eK - treueLuft("kurbel", lockern) - 1e-9);
      /* direkt an den Befunden zwischen Kurbel und Kassette gemessen -- die
         Kettenlinie haengt auch am Schaltwerk, das noch fehlt, und zaehlt in
         der Bilanz deshalb noch nicht mit */
      const antrieb = pr => { let f = 0, w = 0;
        for(const x of pruefe(pr)){
          if(x.level === "hinweis" || (x.slots.indexOf("kurbel") < 0 && x.slots.indexOf("kassette") < 0)) continue;
          if(x.level === "fehler") f++; else w++;
        }
        return {f:f, w:w}; };
      const folge = (x, kurb) => { let bestW = Infinity;
        for(const c of kurb){
          const pr = {...b}; pr.kassette = x.t.id; pr.kurbel = c.id;
          const z = antrieb(pr);
          if(!z.f) bestW = Math.min(bestW, z.w);
        }
        return bestW; };
      for(const x of bewertet) x.folgeW = folge(x, guteKurbeln);
      /* Bringt jede disziplintreue Kassette danach einen Kompromiss am Antrieb,
         eine andere aber nicht, zaehlt der stimmige Antrieb mehr -- etwa am
         Slope-Rahmen mit 135er Hinterbau, an dem keine DH-Kurbel die Kettenlinie
         trifft. Dann zaehlen auch die uebrigen Kurbeln (mit kleinem Abzug), und
         die Schwelle sinkt nur bis zur besten Kassette, die sauber aufgeht. */
      const minW = arr => Math.min.apply(null, arr.map(x => x.folgeW));
      const sauberK = bewertet.filter(x => x.t.e && x.neu.f <= vorher.f && x.neu.w <= vorher.w);
      const treuK = sauberK.filter(x => treue[k] == null || eignung(x.t) >= treue[k]);
      if(sauberK.length && minW(treuK) > 0){
        const rest = kurbeln.filter(c => guteKurbeln.indexOf(c) < 0);
        for(const x of sauberK) if(x.folgeW > 0) x.folgeW = Math.min(x.folgeW, folge(x, rest) + 0.5);
      }
      if(sauberK.length && minW(sauberK) < minW(treuK)){
        const m = minW(sauberK);
        treue[k] = Math.max.apply(null, sauberK.filter(x => x.folgeW === m).map(x => eignung(x.t))) - 1e-9;
      }
    }
    const zul = [];
    for(const {t, neu, folgeW} of bewertet){
      if(t.e && treue[k] != null && eignung(t) < treue[k]) continue;
      let score = quals[k][basisVon(t.id)];
      /* Hardtail oder Fully: Bei XC und Trail ist beides richtig -- das Budget
         entscheidet. Wer fuer Trail 6000 Euro ausgibt, will ein Fully und
         keinen Alu-Hardtail mit Carbon-Laufraedern. */
      if(k === "rahmen" && fullyAb() && !plan.federung && t.maxGabel > 0){
        const fully = !!t.daempfer;
        if(budget >= fullyAb() && !fully) continue;
        if(budget < fullyAb() && fully) score -= 45;
      }
      if(folgeW === Infinity) score -= 80;                       /* keine Kurbel ohne Fehler */
      else if(folgeW != null) score -= folgeW * 35;
      if(ziel > 0 && preisVon(t)){
        const q = preisVon(t) / ziel;
        score += q > 1 ? -Math.min(50, (q-1)*60) : -Math.min(12, (1-q)*18);
      }
      zul.push({t:t, neu:neu, score:score, folgeW:folgeW});
    }
    /* Gibt es ein Teil, das ohne neue Warnung passt, kommt keins mit Warnung in
       Frage -- auch kein besseres. Ein Ahead-Vorbau an der Doppelbruecke oder
       eine Kurbel aus einer anderen Antriebswelt ist kein Upgrade. Bei der
       Kassette zaehlt die Kurbel, die danach kommt, gleich mit. Sonst sind
       Warnungen ein Abstrich, kein Ausschluss. */
    const unsauber = x => x.neu.w > vorher.w || x.folgeW >= 1;
    const sauberDa = zul.some(x => x.neu.f <= vorher.f && !unsauber(x));
    for(const x of zul){
      const t = x.t, neu = x.neu, score = x.score - Math.max(0, neu.w - vorher.w) * 35;
      if(neu.f <= vorher.f){
        if(sauberDa && unsauber(x)) continue;
        if(score > besteS){ besteS = score; beste = t; }
      }
      else if(score - (neu.f - vorher.f)*40 > ersatzS){ ersatzS = score - (neu.f - vorher.f)*40; ersatz = t; }
    }
    b[k] = (beste || ersatz || liste[0]).id;
    if(k === "rahmen") for(const s2 of SLOTS) if(entfaellt(b, s2.k)) b[s2.k] = null;
  }

  budgetPass(b, budget, quals, treue);
  return b;
}

/* Enduro und Downhill bremsen mit grossen Scheiben: die groesste Ausfuehrung,
   die Gabel und Rahmen freigeben -- vorn zuerst, dann hinten. */
function grosseScheiben(k, t, b){
  if(k !== "bremsen" || !(hat("enduro") || hat("dh")) || !t.v) return t;
  const basis = rohTeil("bremsen", t.basisId || t.id);
  const i = basis.v.findIndex(d => d.k === "Scheiben");
  if(i < 0) return t;
  const d = basis.v[i];
  let best = -1;
  d.o.forEach((o, j) => {
    if(optionPasst("bremsen", d, o, b) === false) return;
    if(best < 0 || o.s.sV > d.o[best].s.sV || (o.s.sV === d.o[best].s.sV && o.s.sH > d.o[best].s.sH)) best = j;
  });
  if(best < 0) return t;
  const wahl = (t.wahl || basis.v.map(x => x.d)).slice();
  wahl[i] = best;
  return varianteNachIndex(basis, wahl);
}

/* Was schon feststeht: Fehler und Warnungen, deren beteiligte Teile alle
   gewaehlt sind. Hinweise zaehlen nicht. */
function bilanz(b){
  let f = 0, w = 0;
  for(const x of pruefe(b)){
    if(x.level === "hinweis") continue;
    if(!x.slots.every(k => !SLOTS.some(s => s.k === k) || b[k] || entfaellt(b, k))) continue;
    if(x.level === "fehler") f++; else w++;
  }
  return {f:f, w:w};
}
const udhDa = r => !!r && !!(r.udh || (r.udhAb && jahrAktiv() >= r.udhAb));
const summe = b => { let p = 0; for(const s of SLOTS){ if(entfaellt(b,s.k)) continue;
  const t = b[s.k] ? findeTeil(s.k, b[s.k]) : null; if(t) p += preisVon(t); } return p; };

function budgetPass(b, budget, quals, treue){
  treue = treue || {};
  let wache = 0;
  /* zu teuer: den Tausch nehmen, der pro gespartem Euro am wenigsten Qualität kostet */
  while(summe(b) > budget && wache++ < 80){
    const basis = bilanz(b);
    let best = null, bestKosten = Infinity;
    for(const s of SLOTS){
      if(entfaellt(b, s.k) || !b[s.k]) continue;
      const jetzt = findeTeil(s.k, b[s.k]);
      for(const t of kandidaten(s.k, b).map(x => grosseScheiben(s.k, x, b))){
        if(basisVon(t.id) === basisVon(jetzt.id) || preisVon(t) >= preisVon(jetzt)) continue;
        /* Gespart wird innerhalb der Wunschmarke, nicht an ihr vorbei */
        const wu = markenWunsch(s.k);
        if(wu && jetzt.m === wu && t.m !== wu) continue;
        if(vorliebeOk(s.k, jetzt) && !vorliebeOk(s.k, t)) continue;         /* Vorliebe haelt auch beim Sparen */
        if(t.e && treue[s.k] != null && eignung(t) < treue[s.k]) continue;   /* keine Disziplin verraten */
        const probe = {...b}; probe[s.k] = t.id;
        const nb = bilanz(probe);
        /* Sparen ja, aber nicht auf Kosten der Passung: lieber ueber Budget
           als ein Teil, das eine Warnung ausloest. */
        if(nb.f > basis.f || nb.w > basis.w) continue;
        const spart = preisVon(jetzt) - preisVon(t);
        const kosten = (quals[s.k][basisVon(jetzt.id)] - quals[s.k][basisVon(t.id)] + Math.max(0, nb.w - basis.w) * 35) / spart;
        if(kosten < bestKosten){ bestKosten = kosten; best = {k:s.k, id:t.id}; }
      }
    }
    if(!best) break;
    b[best.k] = best.id;
  }
  /* Luft übrig: den Tausch nehmen, der pro Euro am meisten bringt */
  wache = 0;
  while(summe(b) < budget * 0.93 && wache++ < 80){
    const basis = bilanz(b), rest = budget - summe(b);
    let best = null, bestNutzen = 0;
    for(const s of SLOTS){
      if(entfaellt(b, s.k) || !b[s.k]) continue;
      const jetzt = findeTeil(s.k, b[s.k]);
      for(const t of kandidaten(s.k, b).map(x => grosseScheiben(s.k, x, b))){
        if(basisVon(t.id) === basisVon(jetzt.id)) continue;
        const mehr = preisVon(t) - preisVon(jetzt);
        if(mehr <= 0 || mehr > rest) continue;
        if(vonWunschmarke(s.k, jetzt) && !vonWunschmarke(s.k, t)) continue;    /* Upgrade nicht an der Wunschmarke vorbei */
        if(vorliebeOk(s.k, jetzt) && !vorliebeOk(s.k, t)) continue;
        const probe = {...b}; probe[s.k] = t.id;
        const nb = bilanz(probe);
        if(nb.f > basis.f || nb.w > basis.w) continue;
        const gewinn = quals[s.k][basisVon(t.id)] - quals[s.k][basisVon(jetzt.id)];
        if(gewinn <= 0) continue;
        const nutzen = gewinn / mehr;
        if(nutzen > bestNutzen){ bestNutzen = nutzen; best = {k:s.k, id:t.id}; }
      }
    }
    if(!best) break;
    b[best.k] = best.id;
  }
}

/* Ein Affiliate-Link ist kein Suchlink mit angehaengtem Namen. Er laeuft ueber
   das Netzwerk: dort wird der Klick gezaehlt, das Cookie gesetzt und erst dann
   auf das Ziel weitergeleitet. Fehlt dieser Umweg, gibt es keine Provision --
   der Link funktioniert, verdient aber nichts. */
/* Der Anzeigename traegt oft einen erklaerenden Zusatz hinter einem Mittelpunkt
   -- "Shimano Deore M6120 · 4 Kolben". Der gehoert nicht zum Produktnamen und
   laesst die Shopsuche ins Leere laufen. Fuer die Suche bleibt der Teil davor. */
function suchName(teil){
  let n = String(teil.n).split(" · ")[0].trim();
  n = n.replace(/\s*\([^)]*\)\s*/g, " ").split(" / ")[0];   /* "Eagle 70 / S1000": der erste Name reicht */
  return n.replace(/\s+/g, " ").trim();
}

const optNorm = x => " " + normal(String(x).replace(/\+/g, " plus ")) + " ";

/* Alle Angebote fuer genau diese Ausfuehrung, je Shop das guenstigste.

function angebote(t){

     alles andere wird leer -- auch wenn preise.py das schon so filtert. */

  if(Array.isArray(l)) for(const a of l)
    if(a && a.p > 0 && a.s && angebotPasst(a.n || "", t))

                n:String(a.n || ""), a:(a.a === 0 || a.a === 1) ? a.a : null});

    roh.push({s:"Dein Feed", p:+fe.preis, u:+fe.uvp || null, v:null, l:https(fe.url), b:https(fe.bild), n:String(fe.name || ""), a:null});
  const jeShop = {};
  for(const a of roh){
    const alt = jeShop[a.s];
    if(!alt || (alt.a === 0 && a.a !== 0) || ((alt.a === 0) === (a.a === 0) && a.p < alt.p)) jeShop[a.s] = a;
  }
  const out = Object.keys(jeShop).map(k => jeShop[k])
    .sort((x, y) => (x.a === 0 ? 1 : 0) - (y.a === 0 ? 1 : 0) || x.p - y.p);

}
/* Gerechnet wird nur mit Lieferbarem -- ein Preis, zu dem man nicht kaufen

const rabatt = a => (a && a.u > a.p) ? Math.round((1 - a.p / a.u) * 100) : 0;
const tagVor = n => new Date(Date.now() - n * 864e5).toISOString().slice(0, 10);
/* 30-Tage-Tief: mindestens eine Woche Verlauf, der Preis war in den 30 Tagen
   davor schon hoeher, und kein Tag davor war guenstiger. Der Verlauf gilt je
   Modell ueber alle Ausfuehrungen -- deshalb ist die Aussage nur vorsichtiger,
   nie falsch: was unter dem Modelltief liegt, liegt auch unter dem eigenen. */
function tief30(t, a){
  const r = verlauf[t.basisId || t.id];
  if(!a || !Array.isArray(r)) return false;
  const von = tagVor(30), heute = tagVor(0);
  const alt = r.filter(x => Array.isArray(x) && x[0] >= von && x[0] < heute).map(x => +x[1]).filter(x => x > 0);
  return alt.length >= 7 && a.p <= Math.min.apply(null, alt) && a.p < Math.max.apply(null, alt);
}

/* Ein Rahmen aus einem aelteren Modelljahr kostet weniger: das Vorjahresmodell

}

function normal(x){
