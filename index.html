const rabatt = a => (a && a.u > a.p) ? Math.round((1 - a.p / a.u) * 100) : 0;
const tagVor = n => new Date(Date.now() - n * 864e5).toISOString().slice(0, 10);
/* 30-Tage-Tief: mindestens eine Woche Verlauf, der Preis war in den 30 Tagen
   davor schon hoeher, und kein Tag davor war guenstiger. Der Verlauf gilt je
   Modell ueber alle Ausfuehrungen -- deshalb ist die Aussage nur vorsichtiger,
   nie falsch: was unter dem Modelltief liegt, liegt auch unter dem eigenen. */
function tief30(t, a){
  const r = verlauf[t.basisId || t.id];
  if(!a || !Array.isArray(r)) return false;
  const von = tagVor(30), heute = tagVor(0);
  const alt = r.filter(x => Array.isArray(x) && x[0] >= von && x[0] < heute).map(x => +x[1]).filter(x => x > 0);
  return alt.length >= 7 && a.p <= Math.min.apply(null, alt) && a.p < Math.max.apply(null, alt);
}
const liveStand = () => {
  const d = live.stand ? new Date(live.stand) : feed.stand ? new Date(feed.stand) : null;
  return d && !isNaN(d) ? d.toLocaleString("de-DE", {day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit"}) + " Uhr" : "";
};
const shopZahl = () => live.shops.filter(s => s && s.treffer > 0).length;

/* Ein Rahmen aus einem aelteren Modelljahr kostet weniger: das Vorjahresmodell
   im Abverkauf rund 15 Prozent, ab zwei Jahren ist er praktisch nur noch
   gebraucht zu haben und folgt der Restwertkurve. Im Angebotsmodus bleibt der
   Preis unangetastet -- dort rechnet die Bewertung das Alter schon selbst ein,
   sonst waere es doppelt abgezogen. */
function jahrFaktor(teil){
  if(!teil || !teil.geo || modus === "markt") return 1;
  const alter = AKTUELL - jahrAktiv();
  if(alter <= 0) return 1;
  if(alter === 1) return 0.85;
  return restwertFaktor(alter);
}
/* Mit Live-Preis rechnet der ganze Aufbau mit dem guenstigsten lieferbaren
   Angebot, sonst mit dem Richtpreis aus dem Katalog. */
const grundpreis = teil => { const a = bestesAngebot(teil); return a ? a.p : (teil.p || 0); };
const preisVon = teil => { const g = grundpreis(teil), f = jahrFaktor(teil); return f === 1 ? g : Math.round(g * f); };

/* Preisangaben fuer Liste und Detail. Rabatt nur, wenn der Preis der
   Ladenpreis ist -- beim Vorjahresrahmen steht dort ein Schaetzwert. */
function preisZusatz(t){
  const a = bestesAngebot(t);
  if(!a && angebote(t).length) return `<span class="opt-g">bei ${angebote(t).length === 1 ? esc(angebote(t)[0].s) : angebote(t).length + " Shops"} nicht lieferbar</span>`;
  if(!a || jahrFaktor(t) !== 1) return "";
  const r = rabatt(a), n = angebote(t).length;
  return (r >= 5 ? `<span class="sale" title="gegenüber der UVP laut Shop">Sale −${r} %</span>` : "")
       + (tief30(t, a) ? `<span class="tief" title="Günstigster Preis der letzten 30 Tage">30-Tage-Tief</span>` : "")
       + (r >= 5 ? `<span class="opt-g">UVP <s>${eurG(a.u)}</s></span>` : "")
       + `<span class="opt-g">${n > 1 ? n + " Shops" : esc(a.s)}</span>`;
}

function normal(x){
  return String(x).toLowerCase()
    .replace(/[×x]\s?(\d)/g, " $1").replace(/[^a-z0-9äöüß]+/g, " ").replace(/\s+/g, " ").trim();
}
/* Zerlegt eine CSV-Zeile und achtet dabei auf Anfuehrungszeichen -- Produktnamen
   enthalten regelmaessig Kommas und Semikolons. Ein Anfuehrungszeichen oeffnet
   nur am Feldanfang; mitten im Feld ist es ein Zoll-Zeichen ("29\"") und bleibt
   stehen, wie beim csv-Modul in Python. Endet die Zeile in einem offenen Feld,
   geht der Datensatz in der naechsten Zeile weiter (out.offen). */
function csvZeile(z, tr){
  const out = []; let f = "", inQ = false, anfang = true;
  for(let i = 0; i < z.length; i++){
    const c = z[i];
    if(inQ){
      if(c === '"'){ if(z[i+1] === '"'){ f += '"'; i++; } else inQ = false; }
      else f += c;
    }
    else if(c === '"' && anfang){ inQ = true; anfang = false; }
    else if(c === tr){ out.push(f); f = ""; anfang = true; }
    else { f += c; anfang = false; }
  }
  out.push(f);
  out.offen = inQ;
  return out;
}
const SPALTEN = {
  name:  ["product_name","merchant_product_name","productname","name","title"],
  bild:  ["merchant_image_url","aw_image_url","image_url","large_image","merchant_thumb_url"],
  preis: ["search_price","display_price","price","store_price","aw_price"],
  uvp:   ["rrp_price","rrp","price_old","old_price","was_price","base_price_amount"],
  link:  ["aw_deep_link","deep_link","aw_product_link","merchant_deep_link","product_url"],
  kat:   ["merchant_category","category_name","product_type","category","merchant_product_category_path"]
};
function spalteFinden(kopf, kandidaten){
  for(const k of kandidaten){ const i = kopf.indexOf(k); if(i >= 0) return i; }
  return -1;
}
const zahl = x => {
  let s = String(x == null ? "" : x).replace(/EUR|€/g, "").trim();
  if(!s) return NaN;
  s = (s.indexOf(",") >= 0 && s.indexOf(".") >= 0) ? s.replace(/\./g, "").replace(",", ".") : s.replace(",", ".");
  const v = parseFloat(s);
  return v > 0 ? v : NaN;
};

/* Zuordnung einer Feedzeile zu einem Katalogteil -- dieselben Regeln wie in
   tools/preise.py, damit Hand-Import und Live-Preise dasselbe finden:
   alle langen Namensteile muessen drinstehen, kurze Kennungen ("XT", "Fox 36")
   als ganzes Wort, Bandbreiten ("10-45") exakt; Zubehoer und Ersatzteile
   fliegen raus, die Teileart muss im Namen oder in der Shop-Kategorie stehen,
   und bei mehreren Treffern gewinnt der spezifischste Katalogname. */
const FREMD = ["decal","sticker","aufkleber","service","dichtung","ersatz","spare","schraube","bolt",
  "buchse","bushing","werkzeug","abdeckung","protector","schutzfolie","fender","kappe","gebraucht","b ware","gutschein"];
const ART = {
  rahmen:["rahmen","frame","chassis"], gabel:["gabel","fork"], daempfer:["dämpfer","daempfer","shock","federbein"],
  laufraeder:["laufrad","wheel"], schalthebel:["schalthebel","trigger","shifter","pod","controller","schaltgriff"],
  schaltwerk:["schaltwerk","derailleur"], kassette:["kassette","cassette"], kette:["kette","chain"],
  kurbel:["kurbel","crank"], bremsen:["bremse","brake"], vorbau:["vorbau","stem"],
  stuetze:["stütze","stuetze","seatpost","dropper","post"], sattel:["sattel","saddle"],
  innenlager:["innenlager","tretlager","bottom bracket"], pedale:["pedal"], griffe:["griff","grip"]
};
function feedZiele(){
  const out = [];
  for(const k in K) for(const t of K[k]){
    if(t.m === "Generisch" || t.m === "Trial") continue;
    const name = suchName(t), wo = normal(name).split(" ");
    const w = wo.filter(x => x.length >= 3);
    if(!w.length) continue;
    const sp = [], belegt = [];
    name.replace(/(^|[^\d.])(\d{1,2})\s*[-–]\s*(\d{2})(?!\d)/g, (m, v, a, b, off) => {
      sp.push(" " + a + " " + b + " "); belegt.push([off + v.length, off + m.length]); return m; });
    /* Versionsnummern ("Millenium 4.0") muessen stimmen, sonst bekaeme das Vorgaengermodell den Preis */
    name.replace(/(^|[^\w.,])(\d)\.0(?!\d)/g, (m, v, z) => { sp.push(" " + z + " 0 "); return m; });
    const kz = wo.filter(x => x.length <= 2 && /^[a-zäöüß]+$/.test(x));
    name.replace(/(^|[^\w.,])(\d{1,2})(?![\w.,])/g, (m, v, z, off) => {
      const i = off + v.length;
      if(!belegt.some(([a, b]) => i >= a && i < b)) kz.push(z);
      return m; });
    const nn = normal(name);
    out.push({id:t.id, w:w, k:kz, sp:sp, p:t.p || 0, art:ART[k] || null,
              erlaubt:FREMD.filter(f => nn.indexOf(f) >= 0), menge:new Set(w.concat(kz, sp))});
  }
  return out;
}
function zeileZiele(nachMarke, nm, kat, preis){
  const n = normal(nm), wort = " " + n + " ", kn = normal(kat || "");
  const passend = [];
  for(const erst in nachMarke){
    if(n.indexOf(erst) < 0) continue;
    for(const z of nachMarke[erst]){
      if(!z.w.every(w => n.indexOf(w) >= 0)) continue;
      if(!z.k.every(k => wort.indexOf(" " + k + " ") >= 0)) continue;
      if(!z.sp.every(s => wort.indexOf(s) >= 0)) continue;
      if(FREMD.some(f => z.erlaubt.indexOf(f) < 0 && n.indexOf(f) >= 0)) continue;
      if(z.art && !z.art.some(a => n.indexOf(a) >= 0 || kn.indexOf(a) >= 0)) continue;
      passend.push(z);
    }
  }
  const teilmenge = (a, b) => a.size < b.size && [...a].every(x => b.has(x));
  return passend.filter(z => !passend.some(z2 => teilmenge(z.menge, z2.menge)))
                .filter(z => !z.p || (preis >= 0.3 * z.p && preis <= 1.8 * z.p));
}

/* ═══════════ Produktfeed von Hand ═══════════
   Wer selbst einen Feed aus dem Partnerkonto hat, kann ihn hier laden. Er ist
   zu gross fuer den Geraetespeicher -- bike-components allein liefert
   sechsstellig viele Zeilen. Deshalb wird die Datei in Stuecken gelesen, jede
   Zeile sofort zugeordnet und nur der beste Treffer je Teil behalten. */
function feedEinlesen(datei, fertig){
  const ziele = feedZiele(), nachMarke = {};
  for(const z of ziele) (nachMarke[z.w[0]] = nachMarke[z.w[0]] || []).push(z);
  const beste = {};
  let rest = "", haengt = "", kopf = null, tr = ",", iN = -1, iB = -1, iP = -1, iL = -1, iU = -1, iK = -1, zeilen = 0, pos = 0;
  const STUECK = 4 * 1024 * 1024;
  const balken = document.getElementById("feed-balken");

  function stueck(){
    if(pos >= datei.size){ return abschluss(); }
    const leser = new FileReader();
    leser.onload = function(ev){
      const text = rest + ev.target.result;
      const zs = text.split(/\r?\n/);
      rest = zs.pop();
      for(const z of zs) verarbeite(z);
      pos += STUECK;
      if(balken) balken.style.width = Math.min(100, Math.round(pos/datei.size*100)) + "%";
      setTimeout(stueck, 0);                      /* Oberflaeche zwischendurch atmen lassen */
    };
    leser.onerror = function(){ fertig({fehler:"Datei ließ sich nicht lesen."}); };
    leser.readAsText(datei.slice(pos, pos + STUECK));
  }
  function verarbeite(z){
    if(haengt){ z = haengt + "\n" + z; haengt = ""; }
    if(!z) return;
    if(!kopf){
      const zaehl = c => z.split(c).length;
      tr = [",", ";", "\t", "|"].reduce((a, c) => zaehl(c) > zaehl(a) ? c : a, ",");
      kopf = csvZeile(z, tr).map(x => x.replace(/^﻿/, "").trim().toLowerCase());
      iN = spalteFinden(kopf, SPALTEN.name); iB = spalteFinden(kopf, SPALTEN.bild);
      iP = spalteFinden(kopf, SPALTEN.preis); iL = spalteFinden(kopf, SPALTEN.link);
      iU = spalteFinden(kopf, SPALTEN.uvp); iK = spalteFinden(kopf, SPALTEN.kat);
      return;
    }
    const f = csvZeile(z, tr);
    if(f.offen){ if(z.length < 200000) haengt = z; return; }   /* Zeilenumbruch in einem Feld */
    zeilen++;
    const nm = iN >= 0 ? (f[iN] || "").trim() : "";
    const preis = iP >= 0 ? zahl(f[iP]) : NaN;
    if(!nm || isNaN(preis)) return;
    for(const zi of zeileZiele(nachMarke, nm, iK >= 0 ? f[iK] : "", preis)){
      /* Bei mehreren Treffern den kuerzesten Namen nehmen: das ist meist das
         Produkt selbst und nicht ein Set oder Zubehoer dazu. */
      const alt = beste[zi.id];
      if(alt && (alt.name.length < nm.length || (alt.name.length === nm.length && alt.preis <= preis))) continue;
      const uvp = iU >= 0 ? zahl(f[iU]) : NaN;
      beste[zi.id] = {name:nm, preis:preis, uvp:(uvp > preis) ? uvp : null,
        bild: iB >= 0 ? (f[iB]||"").trim() : "", url: iL >= 0 ? (f[iL]||"").trim() : ""};
    }
  }
  function abschluss(){
    if(rest) verarbeite(rest);
    if(haengt){ const h = haengt; haengt = ""; verarbeite(h + '"'); }
    const treffer = {};
    for(const id in beste){
      const b = beste[id];
      if(!/^https:\/\//i.test(b.bild || "")) b.bild = "";      /* nur sichere Quellen */
      if(!/^https:\/\//i.test(b.url || "")) b.url = "";
      treffer[id] = {bild:b.bild, preis:Math.round(b.preis * 100) / 100, uvp:b.uvp, url:b.url, name:b.name.slice(0, 140)};
    }
    feed = {treffer:treffer, stand:Date.now(), quelle:datei.name, zeilen:zeilen};
    preiseNeu();
    sichern();
    fertig({anzahl:Object.keys(treffer).length, zeilen:zeilen, spalten:{name:iN>=0, bild:iB>=0, preis:iP>=0, link:iL>=0}});
  }
  stueck();
}

/* ═══════════ Eigene Teile ═══════════
   Kein Katalog kennt alles. Was fehlt, legt man selbst an: Name, Preis,
   Gewicht -- und fuer die Pruefung die Masse eines Teils, das genauso gebaut
   ist. Gespeichert wird auf dem Geraet, wie die Aufbauten. */
const MASSDIM = ["Federweg","Einbaumaß","Freilauf","Scheiben","Durchmesser","Hub","Rise","Klemmung","Länge","Kurbellänge","Kettenblatt"];
function oeffneEigen(slotKey){
  const s = slotOf(slotKey), cur = build[slotKey] ? findeTeil(slotKey, build[slotKey]) : null;
  const liste = kandidaten(slotKey, build)
    .map(t0 => (cur && basisVon(t0.id) === basisVon(cur.id)) ? cur : t0)
    .filter(t => !t.eigen);
  zeigeSheet(`
    <div class="sheet-h"><h3><span class="sub">${esc(s.label)}</span>Eigenes Teil anlegen</h3>${zuBtn}</div>
    <div class="sheet-b">
      <p class="hint" style="margin:0 0 14px">Für alles, was nicht im Katalog steht. Unter <b>Maße wie</b> wählst du
        ein Teil, das genauso gebaut ist — gleiche Achse, gleiche Klemmung, gleiches Einbaumaß. Mit diesen Maßen prüft
        die App dein Teil.</p>
      <div class="fld"><label for="eg-n">Name</label><input id="eg-n" type="text" autocomplete="off" placeholder="z. B. Intend Edge 170"></div>
      <div class="fld"><label for="eg-m">Marke</label><input id="eg-m" type="text" autocomplete="off" placeholder="z. B. Intend"></div>
      <div class="fld"><label for="eg-p">Preis in €</label><input id="eg-p" type="number" inputmode="numeric" min="0" placeholder="0"></div>
      <div class="fld"><label for="eg-g">Gewicht in g</label><input id="eg-g" type="number" inputmode="numeric" min="0" placeholder="0"></div>
      <div class="fld"><label for="eg-v">Maße wie</label><select id="eg-v">${liste.map(t =>
        `<option value="${esc(t.id)}"${cur && t === cur ? " selected" : ""}>${esc(t.n)}</option>`).join("")}</select></div>
      <p class="hint" id="eg-fehler" hidden style="color:var(--bad);margin:-6px 0 12px">Bitte einen Namen eintragen.</p>
      <button class="btn wide" data-eigenspeichern="${slotKey}">Anlegen und einbauen</button>
    </div>`);
}
function eigenSpeichern(slotKey){
  const q = quelleOf(slotOf(slotKey));
  const name = ($("eg-n").value || "").trim();
  if(!name){ $("eg-fehler").hidden = false; $("eg-n").focus(); return; }
  const vorlage = findeTeil(slotKey, $("eg-v").value);
  if(!vorlage) return;
  const t = {};
  for(const f in vorlage)
    if(["id","n","m","p","g","v","wahl","basisId","seit","eigen"].indexOf(f) < 0) t[f] = vorlage[f];
  t.id = "x-" + Date.now().toString(36);
  t.n = name;
  t.m = ($("eg-m").value || "").trim() || "Eigenes Teil";
  t.p = Math.max(0, Math.round(parseFloat($("eg-p").value) || 0));
  t.g = Math.max(0, Math.round(parseFloat($("eg-g").value) || 0));
  t.eigen = true;
  /* Masse bleiben waehlbar wie bei der Vorlage -- Federweg, Einbaumass,
     Freilauf, Hub. Kartusche und Ausfuehrung nicht: die gehoeren zur Vorlage,
     nicht zum eigenen Teil. */
  const basis = rohTeil(q, vorlage.basisId || vorlage.id);
  if(basis && basis.v){
    const v = [];
    basis.v.forEach((d, i) => { if(MASSDIM.indexOf(d.k) >= 0 && d.o.length > 1) v.push({...d, d:vorlage.wahl[i]}); });
    if(v.length) t.v = v;
  }
  (eigene[q] = eigene[q] || []).push(t);
  INDEX = {};
  build[slotKey] = t.id;
  sichern(); schliesse(); zeichne();
  zeigeToast("„" + name + "“ angelegt und eingebaut.");
}
function eigenLoeschen(slotKey, id){
  const q = quelleOf(slotOf(slotKey));
  eigene[q] = (eigene[q] || []).filter(t => t.id !== id);
  INDEX = {};
  for(const bau of alleBauten()) for(const k in bau) if(bau[k] && basisVon(bau[k]) === id) bau[k] = null;
  sichern(); schliesse(); zeichne();
}

}
const eurG = n => n.toLocaleString("de-DE", {minimumFractionDigits:n % 1 ? 2 : 0, maximumFractionDigits:2}) + " €";
function angebotZeile(a){
  const r = rabatt(a);
  const vs = a.v === 0 ? "versandkostenfrei" : a.v > 0 ? "+ " + eurG(a.v) + " Versand" : "zzgl. Versand";
  return `<div class="angebot">

      ${a.l ? `<a class="shop bez" href="${esc(a.l)}" target="_blank" rel="sponsored nofollow noopener"><span class="pkt"></span>Zum Shop</a>` : ""}</div>

/* Preisverlauf der letzten 90 Tage: guenstigstes Angebot je Tag. Eine Linie,
   Tief und Hoch beschriftet -- genug, um zu sehen, ob gerade ein guter Moment ist. */
function verlaufSvg(t){
  const r = (verlauf[t.basisId || t.id] || []).filter(x => Array.isArray(x) && x[0] >= tagVor(90) && +x[1] > 0);
  if(r.length < 2) return "";
  const W = 300, H = 86, pl = 4, pr = 4, pt = 14, pb = 28;
  const t0 = Date.parse(r[0][0]), t1 = Date.parse(r[r.length - 1][0]) || t0 + 1;
  const ps = r.map(x => +x[1]), lo = Math.min.apply(null, ps), hi = Math.max.apply(null, ps);
  const X = d => pl + (W - pl - pr) * ((Date.parse(d) - t0) / Math.max(1, t1 - t0));
  const Y = v => hi === lo ? (pt + H - pb) / 2 : pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo));
  const pts = r.map(x => X(x[0]).toFixed(1) + "," + Y(+x[1]).toFixed(1)).join(" ");
  const iLo = ps.indexOf(lo), iHi = ps.indexOf(hi);
  const tag = d => d.slice(8, 10) + "." + d.slice(5, 7) + ".";
  const anker = x => x < W * 0.2 ? "start" : x > W * 0.8 ? "end" : "middle";
  return `<figure class="pv-verlauf">
    <figcaption>Preisverlauf · günstigstes Angebot je Tag${t.v && t.v.some(d => d.o.some(o => Math.abs(o.p) >= 20)) ? ", alle Ausführungen" : ""}</figcaption>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Preisverlauf von ${esc(eurG(ps[0]))} bis ${esc(eurG(ps[ps.length - 1]))}">
      <polyline points="${pts}" fill="none" stroke="var(--anod)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${X(r[r.length - 1][0]).toFixed(1)}" cy="${Y(ps[ps.length - 1]).toFixed(1)}" r="3.2" fill="var(--anod)"/>
      ${hi !== lo ? `<text x="${X(r[iHi][0]).toFixed(1)}" y="${(Y(hi) - 4).toFixed(1)}" text-anchor="${anker(X(r[iHi][0]))}">${esc(eurG(hi))}</text>
      <text x="${X(r[iLo][0]).toFixed(1)}" y="${(Y(lo) + 12).toFixed(1)}" text-anchor="${anker(X(r[iLo][0]))}">${esc(eurG(lo))}</text>` : ""}
      <text x="${pl}" y="${H - 2}" text-anchor="start" class="ax">${tag(r[0][0])}</text>
      <text x="${W - pr}" y="${H - 2}" text-anchor="end" class="ax">${tag(r[r.length - 1][0])}</text>
    </svg></figure>`;
}

/* Begriffe, nach denen Leute suchen, die aber selten im Namen stehen. Von den

function filterAnwenden(){

/* Ein Regler: Stellung als Text, ausgehend von der Grundeinstellung */
function klickText(basis, d){
  if(basis != null) return Math.max(0, basis - d) + " Klicks von ganz zu";
  d = Math.max(-2, Math.min(2, d));        /* manche Knoepfe haben nur wenige Rasten -- nicht ueber den Anschlag */
  if(!d) return "Mitte";
  return "Mitte, dann " + Math.abs(d) + (Math.abs(d) === 1 ? " Klick " : " Klicks ") + (d > 0 ? "zu" : "auf");
}
/* Dasselbe als Klick-Skala: ein Punkt je Klick, gezaehlt von "ganz zu"
   (bekannte Grundeinstellung) oder von der Mitte aus. Die Gesamtzahl der
   Klicks kennen wir bei den meisten Knoepfen nicht -- deshalb laeuft die
   Skala offen aus, statt ein erfundenes Ende zu zeigen. Liams Wahl vom
   2026-09-26 statt gezeichneter Marken-Raedchen. */
function klickVis(basis, d){
  if(basis != null) return {vonZu:Math.max(0, basis - d)};
  return {mitte:Math.max(-2, Math.min(2, d))};
}
function klickSkala(v, text){
  if(!v) return "";
  const an = '<i class="an"></i>', aus = '<i></i>', mehr = '<i class="mehr"></i><i class="mehr"></i>';
  let punkte;
  if(v.vonZu != null) punkte = (v.vonZu ? an.repeat(v.vonZu) : '<i class="halt"></i>') + aus + mehr;
  else {
    const seite = (n, richtung) => [1, 2].map(i => i <= n ? an : aus)[richtung > 0 ? "reverse" : "slice"]().join("");
    punkte = mehr + seite(v.mitte > 0 ? v.mitte : 0, 1) + '<i class="mitte' + (v.mitte ? "" : " an") + '"></i>'
           + seite(v.mitte < 0 ? -v.mitte : 0, -1) + mehr;
  }
  return `<span class="ks" role="img" aria-label="${esc(text)}"><span class="ks-e">zu</span><span class="ks-p">${punkte}</span><span class="ks-e">offen</span></span>`;
}
/* Zwei Einstellungen: Abfahrt (ruppig, schnell) und Spruenge (Absprung und Landung) */
function druckstufen(regler, basis, st, kg){
  const w = (kg < 65 ? -1 : kg > 95 ? 1 : 0) + st.klick;
  const prof = {abfahrt:{lsc:1 + w, hsc:-1 + w}, spruenge:{lsc:2 + w, hsc:2 + w}};
  const out = {};
  for(const k of ["abfahrt", "spruenge"]){
    const p = prof[k];
    if(regler === "hl") out[k] = [["LSC", klickText(basis.lsc, p.lsc), klickVis(basis.lsc, p.lsc)],
                                  ["HSC", klickText(basis.hsc, p.hsc), klickVis(basis.hsc, p.hsc)]];
    else if(regler === "l"){ const dl = k === "abfahrt" ? p.lsc - 1 : p.lsc;
      out[k] = [["Druckstufe", klickText(null, dl), klickVis(null, dl)]]; }
    else if(regler === "hebel") out[k] = [["Hebel", k === "abfahrt" ? "offen" : "offen — für Sprünge den Druck um 5 % erhöhen"]];
    else out[k] = [["Lockout", k === "abfahrt" ? "offen" : "offen — für Sprünge 5 psi mehr"]];
  }
  return out;
}

  const d = build.daempfer && !entfaellt(build, "daempfer") ? findeTeil("daempfer", build.daempfer) : null;
  const dh = !!(g && g.schaft === "dc");
  const out = {kg:kg, st:st};
  if(g && g.travel > 0){
    const coil = /Coil/.test(g.n), tab = gabelTabelle(g), regler = gabelRegler(g), basis = gabelBasis(g);
    const sag = dh ? st.sagV + 5 : st.sagV;
    let psi = null, grenze = false, feder = null;
    if(coil) feder = kg < 68 ? "weich (soft)" : kg < 86 ? "mittel (medium)" : kg < 100 ? "hart (firm)" : "extra hart (x-firm)";
    else {
      psi = Math.round(psiAus(tab.tab, lb) * st.psiV);
      const max = FED_MAX[tab.tab];
      if(max && psi > max){ psi = max; grenze = true; }
    }
    out.gabel = {t:g, coil:coil, psi:psi, feder:feder, grenze:grenze, tab:tab, sag:sag, sagMm:Math.round(g.travel * sag / 100),
      regler:regler, basis:basis, ds:druckstufen(regler, basis, st, kg)};
  }
  if(d){
    const coil = /Coil/.test(d.n), regler = daempferRegler(d);
    const hinten = r && r.maxGabel ? r.maxGabel - (r.schaft === "dc" ? 3 : 10) : 140;
    const lr = Math.max(2, Math.min(3.4, hinten / d.hub));
    const sag = dh ? st.sagH + 3 : st.sagH;
    let psi = null, rate = null, grenze = false;
    if(coil){
      const last = 0.65 * ((kg + (erg ? erg.gewicht / 1000 : 15)) - 4) * 2.20462;
      rate = Math.round(last * lr / (d.hub / 25.4 * sag / 100) / 25) * 25;
      if(rate < 250 || rate > 750) grenze = true;
    } else {
      psi = Math.round(lb * (0.6 + 0.4 * lr / 2.8) * st.psiH);
      if(psi > 300){ psi = 300; grenze = true; }
    }
    out.daempfer = {t:d, coil:coil, psi:psi, rate:rate, grenze:grenze, lr:lr, hinten:hinten, sag:sag, sagMm:Math.round(d.hub * sag / 100 * 10) / 10,
      regler:regler, ds:druckstufen(regler, {}, st, kg)};
  }
  return out;
}

/* ═══ Wo sind die Knoepfe? (Liams Wahl 2026-09-26: beides) ═══
   1. Link zur offiziellen Anleitung des Herstellers -- dort sind die echten

   2. Eigenes Foto vom Top Cap: einmal auf jeden Knopf tippen, dann steht die
      Einstellung direkt im Bild. Bleibt nur auf dem Geraet. */
const HANDBUCH = {
  fox3234:["Fox-Anleitung 32/34", "https://tech.ridefox.com/bike/owners-manuals/2978/fork--2025-32mm--or-34mm-(including-step-cast-and-taper-cast)"],
  fox3638:["Fox-Anleitung 36/38", "https://tech.ridefox.com/bike/owners-manuals/2979/fork--2025-36mm-or-38mm"],
  fox40:["Fox-Anleitung 40", "https://tech.ridefox.com/bike/owners-manuals/2980/fork--2025-40mm"],
  foxX2:["Fox-Anleitung Float X2", "https://tech.ridefox.com/bike/owners-manuals/2984/shock--2025-float-x2"],
  foxFloat:["Fox-Anleitung Float", "https://tech.ridefox.com/bike/owners-manuals/2982/shock--2025-float"],
  charger:["RockShox-Anleitung Charger 3", "https://www.sram.com/en/rockshox/rockshox-technology/charger-3-setup"],
  rsGuide:["RockShox-Einstellanleitung (PDF)", "https://www.sram.com/globalassets/document-hierarchy/tuning-manuals/suspension-setup-and-tuning-guide-english.pdf"]
};
function handbuchVon(slot, t){
  const id = t.basisId || t.id, s = wahlVon(t, "Kartusche") + " " + t.n;
  if(slot === "gabel"){
    if(/^g-fox(32|34|831)/.test(id)) return HANDBUCH.fox3234;
    if(/^g-fox(36|38)|^g-rhythm/.test(id)) return HANDBUCH.fox3638;
    if(/^g-fox40/.test(id)) return HANDBUCH.fox40;
    if(t.m === "RockShox") return /Charger/.test(s) ? HANDBUCH.charger : HANDBUCH.rsGuide;
    return null;
  }
  if(/Float X2/.test(t.n)) return HANDBUCH.foxX2;
  if(/Fox Float|DPS/.test(t.n)) return HANDBUCH.foxFloat;
  if(t.m === "RockShox") return HANDBUCH.rsGuide;
  return null;
}
const KNOEPFE = {hl:["LSC", "HSC"], l:["Druckstufe"], hebel:["Hebel"], lock:["Lockout"]};
const tcFach = slot => "mtb.topcap." + (aktivId[modus] || "x") + "." + slot;
function tcLaden(slot){ try{ const v = localStorage.getItem(tcFach(slot)); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function tcSpeichern(slot, d){
  try{ if(d) localStorage.setItem(tcFach(slot), JSON.stringify(d)); else localStorage.removeItem(tcFach(slot)); return true; }
  catch(e){ zeigeToast("Kein Platz mehr auf dem Gerät — entferne ein anderes Foto."); return false; }
}
let tcAnsicht = "abfahrt";
function topCapBlock(slot, x){
  if(!slot) return "";
  const hb = handbuchVon(slot, x.t), tc = tcLaden(slot), knoepfe = KNOEPFE[x.regler] || [];
  const teilName = slot === "gabel" ? "deiner Gabel" : "deines Dämpfers";
  const link = hb ? `<a class="tc-link" href="${esc(hb[1])}" target="_blank" rel="noopener">Echtes Bild der Rädchen: ${esc(hb[0])} ↗</a>`
                  : `<span class="tc-link aus">Welcher Knopf wo sitzt, zeigt die Anleitung ${teilName}.</span>`;
  if(!tc) return `<div class="tc-block"><b class="tc-t">Wo sind die Knöpfe?</b>${link}
    <button class="btn ghost sm" data-tcfoto="${slot}">Eigenes Foto markieren</button>
    <span class="tc-h">Fotografier die Oberseite ${teilName} mit den Einstellrädchen — die App schreibt die Einstellung direkt ins Bild. Das Foto bleibt auf deinem Handy.</span></div>`;
  const offen = knoepfe.filter(k => !(tc.marks && tc.marks[k]));
  const werte = {};
  for(const z of x.ds[tcAnsicht]) werte[z[0]] = z[1];
  /* Kurz, damit dicht beieinander liegende Knoepfe (GRIP X2: HSC und LSC
     uebereinander) sich nicht verdecken; der zweite steht ueber dem Punkt */
  const kurz = v => !v ? "" : v.replace(/^(\d+) Klicks? von ganz zu$/, "$1 von zu")
    .replace(/^Mitte, dann (\d+) Klicks? (zu|auf)$/, "Mitte +$1 $2").replace(/^offen.*$/, "offen");
  const marken = knoepfe.filter(k => tc.marks && tc.marks[k]).map((k, i) => {
    const m = tc.marks[k], seite = (m.x < 0.3 ? " links" : m.x > 0.7 ? " rechts" : "") + (i % 2 ? " oben" : "");
    return `<span class="tc-m${seite}" style="left:${(m.x * 100).toFixed(1)}%;top:${(m.y * 100).toFixed(1)}%"><i></i><span>${esc(k)}${werte[k] ? " · " + esc(kurz(werte[k])) : ""}</span></span>`;
  }).join("");
  return `<div class="tc-block">
    ${offen.length ? `<p class="tc-hin">Tippe im Foto auf den Knopf „${esc(offen[0])}“.</p>`
      : `<div class="tc-ansicht" role="group" aria-label="Einstellung zeigen">
          <button data-tcansicht="abfahrt" aria-pressed="${tcAnsicht === "abfahrt"}">Abfahrt</button>
          <button data-tcansicht="spruenge" aria-pressed="${tcAnsicht === "spruenge"}">Sprünge</button></div>`}
    <div class="tc-bild${offen.length ? " markieren" : ""}"${offen.length ? ` data-tcmark="${slot}"` : ""}>
      <img src="${tc.img}" alt="Dein Foto">${marken}</div>
    <div class="tc-knoepfe">
      <button class="btn ghost sm" data-tcneu="${slot}">Neu markieren</button>
      <button class="btn ghost sm" data-tcfoto="${slot}">Anderes Foto</button>
      <button class="btn ghost sm" data-tcweg="${slot}">Foto entfernen</button></div>
    ${link}
  </div>`;
}

function kopiere(txt){
  const ok = () => zeigeToast("Einkaufsliste kopiert.");
  const alt = () => { try{ const ta = document.createElement("textarea"); ta.value = txt; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    const g = document.execCommand("copy"); ta.remove(); if(g) ok(); else zeigeToast("Kopieren ging nicht — bitte markieren und kopieren."); }catch(e){} };
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(ok, alt); return; } }catch(e){}
  alt();
}

    + `<button class="pchip rand" data-profile="1" aria-label="Profile verwalten"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>`;

  /* ── Angebotsbewertung ── */
  let marktkarte = "";

    marktkarte += `<div class="mk">

      <span class="mk-lab">Was ist sofort fällig?</span>
      <div class="mk-vs">${VERSCHLEISS.map(v => `<button data-vs="${v.k}" aria-pressed="${!!markt.verschleiss[v.k]}">
        <span class="kasten"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
        <span>${v.l}</span><span class="kst">−${v.kosten} €</span></button>`).join("")}</div>

      ${m ? `<div style="margin-top:13px">

        <div class="rechnung"><span>als Komplettrad</span><span class="w">${eur(m.neu)}</span>
          <span class="g">Hersteller zahlen für dieselben Teile als Erstausrüstung weniger — ein

  const foto = fotos[modus];
  const fotokarte = (modus !== "real" && modus !== "markt") ? "" : `<div class="fotokarte">

  $("aufbau").innerHTML = diszHinweis() + leitKarte(r) + marktkarte + fotokarte + (leitAus ? leerHinweis + cta : "") + GRUPPEN.map(g => {

    const rows = SLOTS.filter(s => s.grp === g.n).map(s => {
      if(entfaellt(build, s.k))

      const chips = (t && !eigen) ? specsVon(s.k, t).map(c => `<span class="chip">${esc(c)}</span>`).join("") : "";

    /* Der Punkt am Thema fasst zusammen, was darin steckt: roter Konflikt,
       gelbe Einschränkung, grün wenn vollständig und sauber. */

    for(const sl of meine){

    if(!stand && voll === meine.length) stand = "fertig";
    /* Leerer eigener Aufbau: erst der Rahmen, der Rest wartet eingeklappt --

    const fokusRahmen = modus !== "traum" && !build.rahmen && g.n !== "Rahmen";

    return `<section class="grp ${stand}${zu ? " eingeklappt" : ""}">
      <button class="grp-kopf" data-thema="${esc(g.n)}" aria-expanded="${!zu}">
        <span class="punkt"></span>
        <span><h2>${esc(g.n)}<span class="t">${esc(g.t)}</span></h2></span>
        <span class="zahl">${voll}/${meine.length}</span>
        <svg class="pfeil" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="grp-inhalt">${rows}${g.n === "Rahmen" ? jahrLeiste() : ""}${g.n === "Fahrwerk" && build.gabel &&
        (findeTeil("gabel", build.gabel) || {}).travel > 0 ? `<button class="fed-auf" data-fed="1">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
          <span><b>Fahrwerk einstellen</b><span>Luftdruck und Druckstufe für dein Gewicht und deinen Fahrstil</span></span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>` : ""}</div>
    </section>`;
  }).join("") + `<p class="legal">
    <b>Was hier belastbar ist:</b> die Standards — Achsmaße, Steuerrohr, Tretlager, Stützendurchmesser,

    <b>Preise:</b> Führt ein Partnershop das Teil, rechnet die App mit dem günstigsten lieferbaren Angebot

    <b>Links:</b> Shop-Knöpfe mit Punkt führen direkt zum Produkt, die mit Lupe zur Suche im Shop. Mit „Anzeige“
    markierte Links bringen CrankScore eine Provision; dein Preis ändert sich nicht.${amazonAktiv() ? " Als Amazon-Partner verdient CrankScore an qualifizierten Verkäufen." : ""}<br>
    <b>Vor dem Kauf</b> gegen das Datenblatt deines Rahmens prüfen.
    <span class="recht-links"><button data-recht="impressum">Impressum</button> · <button data-recht="datenschutz">Datenschutz</button></span> Trial-Maße sind auf Mod 20/19″,
    Street 24″ und Stock 26″ vereinfacht.</p>`;

  const rang = {fehler:0, warnung:1, hinweis:2};
  const sortiert = r.funde.slice().sort((a,b) => rang[a.level] - rang[b.level]);
  $("findings").innerHTML = sortiert.length
    ? sortiert.map(f => `<div class="find ${f.level}">
        <div class="find-t"><span class="pill">${STUFE[f.level] || f.level}</span>${esc(f.titel)}</div><p>${f.text}</p>
        ${f.fixSlot ? `<div><button class="btn ghost sm" data-slot="${f.fixSlot}">Teil wechseln</button></div>` : ""}
      </div>`).join("")
    : `<div class="clean"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
       Keine Konflikte. Alle Maße passen.</div>`;

  clearTimeout(vorschlagTimer);
  if(view === "upgrades" || breit()) vorschlaegeZeichnen();
  else vorschlagTimer = setTimeout(vorschlaegeZeichnen, 350);

  /* Einkaufsliste nur beim Traumrad -- am eigenen Rad und beim Angebot

  $("c-kauf").hidden = modus !== "traum";

  $("b-auf").textContent = r.teile + "/" + r.moeglich;
  const nF = r.funde.filter(f => f.level === "fehler").length;
  $("b-fin").textContent = r.funde.length;
  $("b-fin").className = "badge" + (nF ? " rot" : "");

  const dl = dealsListe(), dPass = dl.filter(x => x.passt);
  const zeigD = (dealFilter === "alle" ? dl : dPass).slice(0, 40);
  $("deals").innerHTML = !hatLive()
    ? `<p class="empty-note">Noch keine Live-Preise. Sobald die Partnershops angebunden sind, stehen hier alle

    : `<div class="deal-kopf"><span>${liveStand() ? "Stand " + liveStand() : "Preise aus deinem Feed"}${shopZahl() ? " · " + shopZahl() + (shopZahl() === 1 ? " Shop" : " Shops") : ""}</span>
         <span class="werbung">Anzeige</span></div>
       <div class="filt deal-filt">
         <button data-dfilt="passend" aria-pressed="${dealFilter !== "alle"}">Passt zu deinem Aufbau · ${dPass.length}</button>

       ${zeigD.length ? zeigD.map(dealHtml).join("")
         : `<p class="empty-note">${dealFilter === "alle" ? "Gerade ist kein Teil aus dem Katalog reduziert."
             : "Gerade ist nichts reduziert, das in deinen Aufbau passt. Unter „Alle“ stehen die übrigen Angebote."}</p>`}
       <p class="pv-recht">Rabatt gegenüber der UVP laut Shop, ab 10 %. 30-Tage-Tief: günstigster Preis der
         letzten 30 Tage. Preise inkl. MwSt., zzgl. Versand; es gilt der Preis im Shop. Kaufst du über einen

  $("b-deal").textContent = dPass.length; $("b-deal").hidden = !dPass.length;

/* Kachelpreis: mit Rabatt-Plakette, wenn ein Shop das Teil gerade reduziert hat */
function kachelPreis(t){
  const a = bestesAngebot(t), r = (a && jahrFaktor(t) === 1) ? rabatt(a) : 0;
  return `<span class="p${a ? " live" : ""}">${a && jahrFaktor(t) === 1 ? eurG(a.p) : eur(preisVon(t))}</span>${r >= 5 ? `<span class="sale-mini">−${r} %</span>` : ""}<span class="g">${t.g} g</span>`;
}
/* ═══════════ Deals ═══════════
   Was gerade reduziert ist -- zuerst dein verbautes Teil, dann was in den
   Aufbau passt, dann nach Rabatt. Ab 10 % gegenueber der UVP laut Shop oder
   beim 30-Tage-Tief. Nur lieferbare Angebote. */
let dealFilter = "passend";
function dealsListe(){
  const out = [];
  if(!hatLive()) return out;
  const basisF = harteFehler(build);
  for(const s of SLOTS){
    if(entfaellt(build, s.k)) continue;
    const jetzt = build[s.k] ? findeTeil(s.k, build[s.k]) : null;
    const jb = jetzt ? basisVon(jetzt.id) : null;
    for(const t0 of kandidaten(s.k, build)){
      const t = (jb && basisVon(t0.id) === jb) ? jetzt : t0;
      const a = bestesAngebot(t);
      if(!a || a.a === 0) continue;
      const r = rabatt(a), tf = tief30(t, a);
      if(r < 10 && !tf) continue;
      const verbaut = !!jb && basisVon(t.id) === jb;
      let passt = verbaut;
      if(!verbaut){ const probe = {...build}; probe[s.k] = t.id; passt = harteFehler(probe) <= basisF; }
      out.push({slot:s, teil:t, a:a, r:r, tief:tf, passt:passt, verbaut:verbaut});
    }
  }
  return out.sort((x, y) => (y.verbaut - x.verbaut) || (y.passt - x.passt) || (y.r - x.r) || (x.a.p - y.a.p));
}
const dealHtml = x => `<div class="deal${x.passt ? "" : " nein"}">
  <div class="deal-l">
    <span class="deal-k">${x.slot.label}${x.verbaut ? " · <b>dein Teil</b>" : ""}</span>
    <span class="deal-n">${esc(x.teil.n)}</span>
    <span class="deal-s">${esc(x.a.s)}${x.passt ? "" : " · passt nicht zum Aufbau"}</span>
    <span class="deal-t">${x.r >= 5 ? `<span class="sale">Sale −${x.r} %</span>` : ""}${x.tief ? `<span class="tief">30-Tage-Tief</span>` : ""}</span>
  </div>
  <div class="deal-r">
    <span class="deal-p">${eurG(x.a.p)}</span>
    ${x.a.u > x.a.p ? `<span class="opt-g">UVP <s>${eurG(x.a.u)}</s></span>` : ""}
    ${!x.verbaut && x.passt ? `<button class="btn sm" data-einbau="${x.slot.k}|${x.teil.id}">Einbauen</button>` : ""}
    ${x.a.l ? `<a class="shop bez" href="${esc(x.a.l)}" target="_blank" rel="sponsored nofollow noopener"><span class="pkt"></span>Zum Shop</a>` : ""}
    <button class="btn ghost sm" data-detail="${x.slot.k}|${x.teil.id}">Preise</button>
  </div>
</div>`;

/* Dasselbe Teil in der Ausfuehrung, die zum Aufbau passt -- die aktuelle
   Wahl bleibt, wo sie passt. null, wenn nichts zu aendern ist. */
function passendeAusfuehrung(slotKey, t, b){
  if(!t || !t.v || !t.wahl) return null;
  const basis = rohTeil(quelleOf(slotOf(slotKey)), t.basisId || t.id);
  if(!basis || !basis.v) return null;
  const w = basis.v.map((d, i) => {
    const cur = t.wahl[i];
    if(d.o.length < 2 || optionPasst(slotKey, d, d.o[cur], b) !== false) return cur;
    let best = -1;
    d.o.forEach((o, j) => {
      if(optionPasst(slotKey, d, o, b) !== true) return;
      const f = GROESSTE[d.k];
      if(best < 0 || (f && o.s[f] > d.o[best].s[f])) best = j;
    });
    return best < 0 ? cur : best;
  });
  const v = varianteNachIndex(basis, w);
  if(v.id === t.id) return null;
  v.aenderung = basis.v.map((d, i) => w[i] !== t.wahl[i] ? d.k + " " + d.o[t.wahl[i]].n + " → " + d.o[w[i]].n : "").filter(Boolean);
  return v;
}
/* Wofuer ein Rahmen gebaut ist: die Disziplin mit der hoechsten Eignung,
   bei Gleichstand die aktuell gewaehlte. null, wenn er ueberall gleich taugt. */
function rahmenDisziplin(r){
  if(!r || !r.e) return null;
  const max = Math.max.apply(null, DID.map(d => r.e[d] || 0));
  if(max < 4) return null;
  const beste = DID.filter(d => (r.e[d] || 0) === max);
  return sel.length === 1 && beste.indexOf(sel[0]) >= 0 ? sel[0] : beste[0];
}
/* Hinweis, wenn Rahmen und gewaehlte Disziplin nicht zusammengehoeren */
function diszHinweis(){
  if(modus === "traum" || !build.rahmen) return "";
  const r = findeTeil("rahmen", build.rahmen), d = rahmenDisziplin(r);
  if(!d || sel.some(x => (r.e[x] || 0) >= 4)) return "";
  return `<div class="mixbox w" style="margin-bottom:14px"><b>Dein Rahmen ist für ${dLang(d)} gebaut,</b> die App bewertet
    gerade nach ${esc(selNamen())}. Dann gelten gute ${dLang(d)}-Teile als unpassend.
    <div style="margin-top:8px"><button class="btn sm" data-diszset="${d}">Auf ${dLang(d)} umstellen</button></div></div>`;
}
/* Vorschlaege fuer einen bestehenden Aufbau, in drei Sorten:
   - einstellen: dasselbe Teil, andere Ausfuehrung loest einen Konflikt
     (Gabel auf 140 mm stellen statt eine andere Gabel kaufen)
   - ersatz: das Teil passt nicht und laesst sich nicht umstellen -- Ersatz
     in derselben Klasse, nicht der billigste
   - upgrades: ein besseres Teil. Besser heisst: mindestens so hochwertig
     (Katalogpreis als Stufe) UND die Wertung steigt. Vorher reichte die
     Wertung allein, und fuer eine Fox 38 am Trailrad stand eine Gabel fuer
     ein Drittel des Preises als "Upgrade" da.
   Leere Plaetze sind kein Upgrade, und am eigenen Rad ist ein neuer Rahmen
   ein neues Rad. */
function upgrades(r){
  const einstellen = [], ersatz = [], vor = [];
  const fehlerAn = (res, k) => res.funde.filter(f => f.level === "fehler" && f.slots.indexOf(k) >= 0).length;
  for(const s of SLOTS){
    if(entfaellt(build, s.k) || !build[s.k]) continue;
    if(s.k === "rahmen" && modus !== "traum") continue;
    const jetzt = findeTeil(s.k, build[s.k]);
    if(!jetzt) continue;
    const fJetzt = fehlerAn(r, s.k);
    if(fJetzt){
      const pa = passendeAusfuehrung(s.k, jetzt, build);
      if(pa){
        const probe = {...build}; probe[s.k] = pa.id;
        const pr = bewerte(probe);
        if(fehlerAn(pr, s.k) < fJetzt){ einstellen.push({slot:s, teil:pa, jetzt:jetzt, d:pr.gesamt - r.gesamt, aenderung:pa.aenderung}); continue; }
      }
    }
    const qJetzt = grundpreis(jetzt);
    let besterErsatz = null;
    for(const kand of kandidaten(s.k, build)){
      if(basisVon(kand.id) === basisVon(jetzt.id)) continue;
      const probe = {...build}; probe[s.k] = kand.id;
      const pr = bewerte(probe);
      const d = pr.gesamt - r.gesamt;
      if(harteFehler(probe) > harteFehler(build)) continue;
      const qK = grundpreis(kand);
      const eintrag = {slot:s, teil:kand, jetzt:jetzt, d:d, mehr:preisVon(kand) - preisVon(jetzt), gd:(kand.g || 0) - (jetzt.g || 0)};
      if(fJetzt){
        /* Ersatz: behebt den Konflikt; unter denen das Teil, das der
           jetzigen Klasse am naechsten kommt */
        if(fehlerAn(pr, s.k) >= fJetzt) continue;
        const abstand = Math.abs(Math.log((qK || 1) / (qJetzt || 1))) - (d > 0 ? d / 1000 : 0);
        if(!besterErsatz || abstand < besterErsatz.abstand) besterErsatz = {...eintrag, abstand:abstand};
        continue;
      }
      if(d <= 0 || qK < qJetzt * 0.95) continue;                 /* kein Rueckschritt als Upgrade */
      if(plan.budget > 0 && pr.preis > plan.budget && pr.preis > r.preis) continue;
      vor.push(eintrag);
    }
    if(besterErsatz) ersatz.push(besterErsatz);
  }
  vor.sort((a, b) => b.d - a.d || a.mehr - b.mehr);
  const gesehen = {}, top = [];
  for(const v of vor){ if(gesehen[v.slot.k]) continue; gesehen[v.slot.k] = 1; top.push(v); if(top.length === 5) break; }
  return {einstellen:einstellen, ersatz:ersatz, upgrades:top, anzahl:einstellen.length + ersatz.length + top.length};
}

/* Solange eine Schublade offen ist, steht die Seite dahinter still. overflow:

   seiner Stelle festgenagelt und beim Schliessen dorthin zurueckgesetzt. */
let sperrY = 0, gesperrt = false;
function sperre(){
  if(gesperrt) return;
  gesperrt = true; sperrY = window.scrollY;
  const b = document.body.style;
  b.position = "fixed"; b.top = -sperrY + "px"; b.left = "0"; b.right = "0"; b.width = "100%";
}
function freigeben(){
  if(!gesperrt) return;
  gesperrt = false;

  b.position = b.top = b.left = b.right = b.width = "";
  window.scrollTo(0, sperrY);
}
/* Wischen ausserhalb der Liste, oder ueber ihr Ende hinaus, geht nirgendwohin.
   Seitlich wischen in der Jahresleiste bleibt erlaubt. */
let wischX = 0, wischY = 0;
document.addEventListener("touchstart", e => {
  if(e.touches.length === 1){ wischX = e.touches[0].clientX; wischY = e.touches[0].clientY; }
}, {passive:true});
document.addEventListener("touchmove", e => {
  if(!gesperrt || e.touches.length !== 1) return;
  const dx = e.touches[0].clientX - wischX, dy = e.touches[0].clientY - wischY;
  if(Math.abs(dx) > Math.abs(dy) && e.target.closest(".jl-reihe, .marken, .sortier, .deal-filt")) return;
  const liste = e.target.closest(".sheet-b");
  if(!liste || liste.scrollHeight <= liste.clientHeight + 1){ e.preventDefault(); return; }
  const oben = liste.scrollTop <= 0, unten = liste.scrollTop + liste.clientHeight >= liste.scrollHeight - 1;
  if((dy > 0 && oben) || (dy < 0 && unten)) e.preventDefault();
}, {passive:false});

const GEWICHTE = [{v:65,l:"bis 70 kg"},{v:78,l:"70–85 kg"},{v:92,l:"85–100 kg"},{v:108,l:"über 100 kg"}];
const PRIOS = [{v:"pl",n:"Preis-Leistung",s:"Das meiste Rad pro Euro"},
               {v:"leicht",n:"Leicht",s:"Jedes Gramm zählt"},
               {v:"robust",n:"Robust",s:"Hält, auch wenn es hart wird"}];

function oeffneWiz(step){
  wizStep = step;
  const N = 6;
  const bahn = `<div class="steps">${Array.from({length:N}, (_,i) => `<i class="${i <= step ? "on" : ""}"></i>`).join("")}</div>`;
  let body = "", weiter = "Weiter", kannWeiter = true;

  if(step === 0){
    if(sel.length > 1) kombiModus = true;
    const mp = sel.length > 1 ? mixPaar(sel) : {min:1, paar:null};
    body = `<p class="q">Wofür baust du?</p>
      <p class="qs">Tipp an, wofür das Rad gebaut wird — der Assistent baut dann genau dafür: Downhill heißt DH-Rahmen,
        Doppelbrücke, DH-Reifen. Mischen geht über „Mehrere kombinieren“.</p>
      ${DISZ.map(d => `<button class="dis" data-d="${d.id}" aria-pressed="${sel.indexOf(d.id) >= 0}">
        <span class="box"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
        <span><span class="dis-n">${d.lang}</span><span class="dis-t">${d.txt}</span></span></button>`).join("")}
      <div class="kombi"><button class="btn ghost sm" data-kombi="1" aria-pressed="${kombiModus}">${kombiModus ? "✓ Mehrere kombinieren" : "Mehrere kombinieren"}</button>
        <span>${kombiModus ? "Tippen fügt hinzu oder nimmt weg." : "Tippen wählt genau diese Disziplin."}</span></div>
      ${sel.length > 1 ? (mp.min < .15
        ? `<div class="mixbox no"><b>Das gibt es nicht als ein Rad.</b> ${dLang(mp.paar[0])} und ${dLang(mp.paar[1])} teilen sich kaum ein Bauteil.</div>`
        : mp.min < .40
        ? `<div class="mixbox w"><b>Weiter Spagat.</b> ${dLang(mp.paar[0])} und ${dLang(mp.paar[1])} ziehen auseinander.</div>`
        : `<div class="mixbox ok"><b>Das lässt sich bauen.</b></div>`) : ""}
      <p class="was-das" style="margin-top:12px"><b>Unsicher?</b> Nimm <b style="color:inherit">Trail</b> — das Allround-Rad für
        Touren mit Abfahrten, bergauf und bergab. Passt für die meisten, die einfach im Wald fahren wollen.</p>`;
  }
  else if(step === 1){
    body = `<p class="q">Was darf es kosten?</p>
      <p class="qs">Gesamtsumme aller Teile ohne Montage. Der Assistent bleibt darunter und verteilt das Geld dahin, wo es am meisten bringt.</p>
      <div class="qgrid">${BUDGETS.map(v => `<button class="qopt" data-budget="${v}" aria-pressed="${plan.budget === v}">${eur(v)}</button>`).join("")}</div>
      <div class="fld" style="margin-top:12px"><label for="w-budget">Eigener Betrag in €</label>
        <input id="w-budget" type="number" inputmode="numeric" min="400" step="50" value="${plan.budget || ""}" placeholder="z. B. 4200" data-plan="budget"></div>
      <p class="was-das" style="margin-top:12px"><b>Was ist realistisch?</b> Ein Aufbau aus Neuteilen für ${esc(selNamen())}
        kostet ab etwa ${eur(mindestPreis())} — mit älterem Rahmen und einfachen Teilen. Darunter sagt dir der Assistent,
        was fehlt, statt ein falsches Rad zu bauen.</p>`;
    kannWeiter = plan.budget > 0;
  }
  else if(step === 2){
    body = `<p class="q">Wie schwer bist du?</p>
      <p class="qs">Laufräder haben eine Freigabe für Systemgewicht — Fahrer plus Rad plus Rucksack. Wer drüber liegt, reißt Speichennippel, und im Garantiefall schaut der Hersteller genau hier hin.</p>
      <div class="qgrid">${GEWICHTE.map(g => `<button class="qopt" data-fahrer="${g.v}" aria-pressed="${plan.fahrer === g.v}">${g.l}</button>`).join("")}</div>
      <div class="fld" style="margin-top:12px"><label for="w-fahrer">Genauer in kg</label>
        <input id="w-fahrer" type="number" inputmode="numeric" min="30" max="180" value="${plan.fahrer || ""}" placeholder="z. B. 82" data-plan="fahrer"></div>`;
    kannWeiter = plan.fahrer > 0;
  }
  else if(step === 3){
    const reihe = (key, cfg, val) => `<div class="mrow"><label>${cfg.label}</label><div class="mchips">
      <button data-marke="${key}|" aria-pressed="${!val}">Egal</button>
      ${cfg.opts.map(o => `<button data-marke="${key}|${o}" aria-pressed="${val === o}">${o}</button>`).join("")}
    </div></div>`;
    body = `<p class="q">Hast du Markenwünsche?</p>
      <p class="qs">„Egal“ lässt dem Assistenten freie Hand — meist das beste Ergebnis pro Euro. Ein Wunsch wird umgesetzt, wo die Marke ein passendes Teil hat — gegen die Kompatibilität nie. Wo das nicht geht, steht es im Ergebnis.</p>
      ${reihe("mSchalt", MARKEN.schalt, plan.mSchalt)}
      ${reihe("mBrems", MARKEN.brems, plan.mBrems)}
      ${reihe("mFed", MARKEN.fed, plan.mFed)}
      <p class="hint">Shimano fährt Micro Spline, SRAM fährt XD — das legt indirekt den Laufradsatz fest. Der Assistent berücksichtigt das automatisch.</p>`;
  }
  else if(step === 4){
    body = `<p class="q">Worauf kommt es dir an?</p>
      <p class="qs">Entscheidet, wohin überschüssiges Budget fließt.</p>
      <div class="qgrid" style="grid-template-columns:1fr">
        ${PRIOS.map(p => `<button class="qopt" data-prio="${p.v}" aria-pressed="${plan.prio === p.v}" style="align-items:flex-start;text-align:left">
          ${p.n}<small>${p.s}</small></button>`).join("")}</div>`;
    weiter = "Aufbau rechnen";
  }
  else {
    /* Rechnen kann bei knappem Budget gut eine Sekunde dauern: erst die
       Ansage zeigen, dann rechnen, dann das Ergebnis */
    if(!wizErgebnis){
      zeigeSheet(`<div class="sheet-h"><h3><span class="sub">Traumrad-Assistent</span>Schritt ${step+1} von ${N}</h3>${zuBtn}</div>
        ${bahn}<div class="sheet-b"><p class="q">Rechne deinen Aufbau …</p>
        <p class="qs">Passende Teile für ${esc(selNamen())}, im Budget von ${eur(plan.budget)} — wenn nötig mit einem
          älteren Rahmen-Modelljahr.</p></div>`);
      setTimeout(() => {
        if(!wizOffen() || wizErgebnis || wizStep !== 5) return;
        wizErgebnis = generiere(); wizInfo = generiereInfo;
        oeffneWiz(5);
      }, 40);
      return;
    }
    const b = wizErgebnis, info = wizInfo || {};
    /* Preise so zeigen, wie sie mit dem gewaehlten Rahmen-Modelljahr gelten */
    const jahrVorher = jahrWahl[modus];
    if(info.jahr) jahrWahl[modus] = info.jahr;
    const r = bewerte(b);
    const rahmenT = b.rahmen ? findeTeil("rahmen", b.rahmen) : null;
    const rahmenJetzt = rahmenT ? preisVon(rahmenT) : 0;
    const zeilen = SLOTS.filter(s => !entfaellt(b, s.k)).map(s => {
      const t = b[s.k] ? findeTeil(s.k, b[s.k]) : null;
      return `<div class="erg"><span class="k">${s.label}${s.k === "rahmen" && info.jahr && info.jahr < AKTUELL ? " · Modelljahr " + info.jahr : ""}</span>
        <span class="n">${t ? esc(t.n) : "—"}</span>
        <span class="p">${t ? eur(preisVon(t)) : "—"}</span></div>`;
    }).join("");
    jahrWahl[modus] = AKTUELL;
    const rahmenNeu = rahmenT ? preisVon(rahmenT) : 0;
    jahrWahl[modus] = jahrVorher;
    const alterR = info.jahr ? AKTUELL - info.jahr : 0;
    const uebrig = plan.budget - r.preis;
    const zuTeuer = !!info.grenze && r.preis > info.grenze, marken = plan.mSchalt || plan.mBrems || plan.mFed;
    const abstriche = info.abstriche || [];
    const kernTreu = !TREUE_KERN.some(k => abstriche.indexOf(slotOf(k).label) >= 0);
    const abstricheText = n => abstriche.slice(0, n).join(", ") +
      (abstriche.length > n ? " und " + (abstriche.length - n) + " weitere" : "");
    /* Wo die Wunschmarke kein passendes Teil hat, sagt es das Ergebnis */
    const markeFehlt = SLOTS.filter(s => !entfaellt(b, s.k) && b[s.k] && !vonWunschmarke(s.k, findeTeil(s.k, b[s.k])))
      .map(s => s.label + " (" + findeTeil(s.k, b[s.k]).m + ")");
    const schonMit = [alterR > 0 ? `Rahmen-Modelljahr ${info.jahr} (${alterR === 1 ? "Abverkauf" : "Gebrauchtpreis"})` : "",
      abstriche.length ? `einfacheren Teilen (${esc(abstricheText(3))})` : "", marken ? "deinen Wunschmarken" : ""].filter(Boolean);
    body = `<p class="q">Dein Aufbau</p>
      <p class="qs">${selNamen()} · ${plan.prio === "pl" ? "Preis-Leistung" : plan.prio === "leicht" ? "leicht" : "robust"}
        ${plan.mSchalt || plan.mBrems || plan.mFed ? "· " + [plan.mSchalt, plan.mBrems, plan.mFed].filter(Boolean).join(", ") : ""}</p>
      <div class="sumbox">
        <div><b style="color:${ampel(r.gesamt)}">${r.gesamt}</b><span>Score</span></div>
        <div><b>${eur(r.preis)}</b><span>${uebrig >= 0 ? eur(uebrig) + " frei" : eur(-uebrig) + " drüber"}</span></div>
        <div><b>${kg(r.gewicht)}</b><span>Gewicht</span></div>
      </div>
      ${zeilen}
      ${!zuTeuer && alterR > 0 ? `<div class="mixbox ok" style="margin-top:12px"><b>Rahmen als Modelljahr ${info.jahr}.</b>
          ${alterR === 1 ? "Vorjahresmodell im Abverkauf" : "Älteres Modell, gerechnet zum Gebrauchtpreis"} —
          ${eur(rahmenNeu - rahmenJetzt)} günstiger als neu. So bleibt der Aufbau im Budget${abstriche.length ? "" : ", ohne bei den Teilen nachzugeben"}.</div>` : ""}
      ${!zuTeuer && abstriche.length ? `<div class="mixbox w" style="margin-top:12px"><b>Kleine Abstriche fürs Budget.</b>
          ${esc(abstricheText(5))} ${abstriche.length === 1 ? "ist" : "sind"} eine Stufe einfacher, als es für
          ${selNamen()} ideal wäre — sonst ginge es nicht unter ${eur(info.grenze)}.${kernTreu ? ` Rahmen, Gabel und Dämpfer
          bleiben, was ${selNamen()} verlangt.` : ""}</div>` : ""}
      ${zuTeuer ? `<div class="mixbox no" style="margin-top:12px"><b>${eur(plan.budget)} reichen für ${selNamen()} nicht.</b>
          ${kernTreu ? `Mit Rahmen, Gabel und Dämpfer, die wirklich für ${selNamen()} gebaut sind, kostet der günstigste Aufbau`
            : "Der günstigste Aufbau, der noch zur Mischung passt, kostet"}
          ${eur(r.preis)}${schonMit.length ? " — schon mit " + schonMit.slice(0, -1).join(", ") + (schonMit.length > 1 ? " und " : "") + schonMit[schonMit.length - 1] : ""}.
          Budget erhöhen${marken ? ", Wunschmarken auf „Egal“ stellen" : ""} oder eine andere Disziplin wählen.</div>` : ""}
      ${markeFehlt.length ? `<div class="mixbox w" style="margin-top:12px"><b>Nicht überall deine Wunschmarke.</b>
          ${esc(markeFehlt.join(", "))}: Von der gewünschten Marke passt hier kein Teil zum Rest des Aufbaus,
          deshalb die nächstbeste Wahl.</div>` : ""}
      ${r.funde.filter(f => f.level === "fehler").length
        ? `<div class="mixbox no" style="margin-top:12px"><b>Mit Konflikt.</b> Der Katalog hat für diese Kombination aus Disziplin, Budget und Marken kein sauberes Teil. Nach dem Übernehmen siehst du im Reiter Prüfung genau welches.</div>`
        : `<div class="mixbox ok" style="margin-top:12px"><b>Ohne harte Konflikte.</b> Alle Maße passen zueinander.</div>`}`;
    weiter = "Übernehmen";
  }

  zeigeSheet(`
    <div class="sheet-h"><h3><span class="sub">Traumrad-Assistent</span>Schritt ${step+1} von ${N}</h3>${zuBtn}</div>
    ${bahn}
    <div class="sheet-b">${body}</div>
    <div class="sheet-f">
      ${step > 0 ? `<button class="btn ghost" data-wiz="${step-1}">Zurück</button>` : ""}
      ${step === 5 ? `<button class="btn ghost" data-wizneu="1">Nochmal</button>` : ""}
      <button class="btn wide" style="flex:1" ${kannWeiter ? "" : "disabled"}
        data-${step === 5 ? "wizfertig" : "wiz"}="${step === 5 ? "1" : step+1}">${weiter}</button>
    </div>`);
}

/* Foto verkleinern, bevor es in den Gerätespeicher geht. Ein Handyfoto hat
   schnell 4 MB; der Browser gibt einer Seite insgesamt nur etwa 5 MB. */
function fotoAufnehmen(datei, ziel){
  if(!datei) return;
  const wohin = ziel || {art:"rad"};
  const leser = new FileReader();
  leser.onload = function(ev){
    const bild = new Image();
    bild.onload = function(){
      const max = 1000;
      const f = Math.min(1, max / Math.max(bild.width, bild.height));
      const c = document.createElement("canvas");
      c.width = Math.round(bild.width * f); c.height = Math.round(bild.height * f);
      c.getContext("2d").drawImage(bild, 0, 0, c.width, c.height);
      let daten = c.toDataURL("image/jpeg", 0.72);
      if(daten.length > 1400000) daten = c.toDataURL("image/jpeg", 0.5);
      if(wohin.art === "topcap"){
        if(tcSpeichern(wohin.slot, {img:daten, marks:{}}) && $("fed-erg")) $("fed-erg").innerHTML = federErgebnisHtml();
        return;
      }
      fotos[modus] = daten;
      sichern();
      /* Beides neu zeichnen: die Schublade zeigt das Bild, die Liste dahinter
         das Vorschaubild in der Zeile. Vorher blieb die Liste stehen. */
      zeichne();
    };
    bild.onerror = function(){ alert("Das Bild ließ sich nicht lesen. Versuch ein anderes Format."); };
    bild.src = ev.target.result;
  };
  leser.readAsDataURL(datei);
}

/* "slot|teil-id": nur am ERSTEN Strich trennen -- die Id einer Ausfuehrung
   traegt selbst einen ("g-fox36|gripx~140"). Vorher wurde dort getrennt, und
   jedes "Einbauen" aus dem Picker, den Upgrades oder den Deals baute das Teil
   in der Standard-Ausfuehrung ein: die passend gewaehlte 140-mm-Gabel kam als
   160-mm-Gabel an, der Konflikt war da, und die Upgrades schlugen eine
   schlechtere Gabel vor. */
const slotUndTeil = x => { const i = x.indexOf("|"); return [x.slice(0, i), x.slice(i + 1)]; };

    if(cur && cur.v){
      const w = cur.wahl.slice(); w[+q[1]] = +q[2];
      build[sk] = varianteNachIndex(rohTeil(quelleOf(slotOf(sk)), cur.basisId), w).id;

  }
  const zu2 = T("[data-zustand]");
  if(zu2){ markt.zustand = zu2.dataset.zustand; sichern(); zeichne(); return; }
  const vs = T("[data-vs]");

    profilNeu(); schliesse();
    zeigeToast((modus === "markt" ? "Neues Angebot" : "Neues Rad") + " angelegt. Fang beim Rahmen an" + (modus === "traum" ? " oder frag den Assistenten." : "."));

  }
  if(T("[data-profile]")){ oeffneProfile(); return; }
  const pu = T("[data-profumb]");
  if(pu){ profUmbenennen = pu.dataset.profumb; profLoeschFrage = null; oeffneProfile(); return; }
  if(T("[data-profnameok]")){ profUmbenennen = null; sichern(); zeichne(); oeffneProfile(); return; }

  const sa = T("[data-shopan]");

});

/* Scrollt die Wertungskarte unter die Kopfzeile, uebernimmt die Kopfzeile

    new IntersectionObserver(es => {
      const e = es[es.length - 1];
      document.body.classList.toggle("klein", !e.isIntersecting && e.boundingClientRect.top < 80);
      $("mini").tabIndex = document.body.classList.contains("klein") ? 0 : -1;

  }

/* ═══════════ 12 · Aktualisieren ═══════════
   Neue Fassungen werden im Hintergrund erkannt, aber erst geladen, wenn man den
   Knopf drueckt -- so springt die App nie mitten im Bauen um.

   Erkannt wird ueber einen Versionsvergleich: im Worker-Skript steht der
   Stempel der letzten Veroeffentlichung, hier in APP_VERSION der Stempel dieser
   Seite. Das Skript wird dabei am Browser-Cache vorbei geholt; genau dieser
   Cache hat beim Testen schon einmal eine alte Fassung ausgeliefert, obwohl
   der Server die neue hatte.

   Beim Aktualisieren werden die App-Caches geleert und die Seite unter einer
   neuen Adresse geladen. Der Umweg ueber die Adresse ist Absicht: iOS haelt
   Home-Bildschirm-Apps sonst gern auf dem alten Stand fest. Aufbauten, Fotos
   und Einstellungen liegen im localStorage und bleiben unberuehrt. */
function versionText(v){
  const m = /^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})$/.exec(v || "");
  return m ? m[3] + "." + m[2] + "." + m[1] + ", " + m[4] + ":" + m[5] + " Uhr" : "Entwicklungsstand";
}
function zeigeToast(txt, ms){
  const t = $("toast"); if(!t) return;
  t.textContent = txt; t.hidden = false;
  clearTimeout(zeigeToast.z); zeigeToast.z = setTimeout(() => { t.hidden = true; }, ms || 3200);
}
/* Weggetippt heisst: fuer diese Version und diese Sitzung Ruhe. Beim naechsten
   Start oder bei einer noch neueren Version ploppt es wieder auf. */
let serverStand = null;
function zeigeUpdate(){
  let weg = null;
  try{ weg = sessionStorage.getItem("mtb.updweg"); }catch(e){}
  const pop = $("upd-pop");
  if(pop) pop.hidden = !updateDa || weg === serverStand;
  Array.prototype.forEach.call(document.querySelectorAll(".app-stand .btn"),
    x => { x.textContent = updateDa ? "Neue Version laden" : "App aktualisieren"; });
}
async function serverVersion(){
  const txt = await fetch("mtb-sw.js?pruef=" + Date.now(), {cache:"no-store"}).then(r => {
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  });
  /* Der Cache-Praefix ist intern und bleibt "dreambuild-": aeltere installierte
     Fassungen suchen genau danach und zeigen sonst kein Update mehr an. */
  const m = /var CACHE = '(?:dreambuild|crankscore)-([^']+)'/.exec(txt);
  return m ? m[1] : null;
}
function updateWeg(){
  try{ sessionStorage.setItem("mtb.updweg", serverStand || ""); }catch(e){}
  zeigeUpdate();
}
async function updatePruefen(){
  if(APP_VERSION === "entwicklung") return;
  try{
    const v = await serverVersion();
    serverStand = v;
    updateDa = !!v && v !== APP_VERSION;
    zeigeUpdate();
  }catch(e){ /* offline -- dann eben beim naechsten Mal */ }
}
async function appAktualisieren(){
  const knopf = document.querySelector("#upd-pop:not([hidden]) .btn") || document.querySelector(".app-stand .btn");
  if(knopf) knopf.classList.add("laedt");
  let v = null;
  try{ v = await serverVersion(); }
  catch(e){
    if(knopf) knopf.classList.remove("laedt");
    zeigeToast("Kein Netz — die App läuft weiter offline. Später nochmal versuchen.");
    return;
  }
  if(v && v === APP_VERSION){
    if(knopf) knopf.classList.remove("laedt");
    updateDa = false; zeigeUpdate();
    zeigeToast("Du hast die neueste Version (" + versionText(APP_VERSION) + ").");
    return;
  }
  try{
    sessionStorage.setItem("mtb.frisch", v || "");
    if(window.caches){ const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); }
    const reg = navigator.serviceWorker ? await navigator.serviceWorker.getRegistration() : null;
    if(reg){ try{ await reg.update(); }catch(e){} }
  }catch(e){}
  location.replace(location.pathname + "?v=" + encodeURIComponent(v || Date.now()));
}

try{
  /* Nachgeschaut wird beim Start, bei jeder Rueckkehr in die App und stuendlich --
     unabhaengig davon, ob sich der Worker registrieren liess. Der Vergleich
     braucht ihn nicht, und ohne diese Trennung bliebe der Hinweis stumm, sobald
     die Registrierung einmal scheitert. */
  let swReg = null;
  const schau = function(){
    if(swReg) swReg.update().catch(function(){});
    updatePruefen();
  };
  if("serviceWorker" in navigator && window.top === window.self
     && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")
     && document.querySelector('link[rel="manifest"]')){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("mtb-sw.js", {updateViaCache:"none"}).then(function(reg){
        swReg = reg;
        reg.update().catch(function(){});
        /* Uebernimmt ein neuer Worker, wird nur der Hinweis gezeigt --
           geladen wird erst auf Knopfdruck. */
        navigator.serviceWorker.addEventListener("controllerchange", function(){ updatePruefen(); });
      }).catch(function(){});
    });
  }
  window.addEventListener("load", updatePruefen);
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible") schau();
  });
  setInterval(schau, 3600000);
  /* Nach dem Aktualisieren: Bescheid geben und die Adresse wieder aufraeumen */
  const frisch = sessionStorage.getItem("mtb.frisch");
  if(frisch !== null){
    sessionStorage.removeItem("mtb.frisch");
    setTimeout(() => zeigeToast("Aktualisiert — Version vom " + versionText(APP_VERSION) + "."), 400);
  }
  if(/[?&]v=/.test(location.search)) history.replaceState(null, "", location.pathname);
}catch(e){}
