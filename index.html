/* Zerlegt eine CSV-Zeile und achtet dabei auf Anfuehrungszeichen -- Produktnamen
   enthalten regelmaessig Kommas und Semikolons. Ein Anfuehrungszeichen oeffnet
   nur am Feldanfang; mitten im Feld ist es ein Zoll-Zeichen ("29\"") und bleibt
   stehen, wie beim csv-Modul in Python. Endet die Zeile in einem offenen Feld,
   geht der Datensatz in der naechsten Zeile weiter (out.offen). */
function csvZeile(z, tr){
  const out = []; let f = "", inQ = false, anfang = true;
  for(let i = 0; i < z.length; i++){
    const c = z[i];
    if(inQ){
      if(c === '"'){ if(z[i+1] === '"'){ f += '"'; i++; } else inQ = false; }
      else f += c;
    }
    else if(c === '"' && anfang){ inQ = true; anfang = false; }
    else if(c === tr){ out.push(f); f = ""; anfang = true; }
    else { f += c; anfang = false; }
  }
  out.push(f);
  out.offen = inQ;
  return out;
}
const SPALTEN = {

  kat:   ["merchant_category","category_name","product_type","category","merchant_product_category_path"]
};
function spalteFinden(kopf, kandidaten){

}
const zahl = x => {
  let s = String(x == null ? "" : x).replace(/EUR|€/g, "").trim();
  if(!s) return NaN;
  s = (s.indexOf(",") >= 0 && s.indexOf(".") >= 0) ? s.replace(/\./g, "").replace(",", ".") : s.replace(",", ".");
  const v = parseFloat(s);
  return v > 0 ? v : NaN;
};

/* Zuordnung einer Feedzeile zu einem Katalogteil -- dieselben Regeln wie in
   tools/preise.py, damit Hand-Import und Live-Preise dasselbe finden:
   alle langen Namensteile muessen drinstehen, kurze Kennungen ("XT", "Fox 36")
   als ganzes Wort, Bandbreiten ("10-45") exakt; Zubehoer und Ersatzteile
   fliegen raus, die Teileart muss im Namen oder in der Shop-Kategorie stehen,
   und bei mehreren Treffern gewinnt der spezifischste Katalogname. */
const FREMD = ["decal","sticker","aufkleber","service","dichtung","ersatz","spare","schraube","bolt",
  "buchse","bushing","werkzeug","abdeckung","protector","schutzfolie","fender","kappe","gebraucht","b ware","gutschein"];
const ART = {
  rahmen:["rahmen","frame","chassis"], gabel:["gabel","fork"], daempfer:["dämpfer","daempfer","shock","federbein"],
  laufraeder:["laufrad","wheel"], schalthebel:["schalthebel","trigger","shifter","pod","controller","schaltgriff"],
  schaltwerk:["schaltwerk","derailleur"], kassette:["kassette","cassette"], kette:["kette","chain"],
  kurbel:["kurbel","crank"], bremsen:["bremse","brake"], vorbau:["vorbau","stem"],
  stuetze:["stütze","stuetze","seatpost","dropper","post"], sattel:["sattel","saddle"],
  innenlager:["innenlager","tretlager","bottom bracket"], pedale:["pedal"], griffe:["griff","grip"]
};
function feedZiele(){
  const out = [];
  for(const k in K) for(const t of K[k]){
    if(t.m === "Generisch" || t.m === "Trial") continue;
    const name = suchName(t), wo = normal(name).split(" ");
    const w = wo.filter(x => x.length >= 3);
    if(!w.length) continue;
    const sp = [], belegt = [];
    name.replace(/(^|[^\d.])(\d{1,2})\s*[-–]\s*(\d{2})(?!\d)/g, (m, v, a, b, off) => {
      sp.push(" " + a + " " + b + " "); belegt.push([off + v.length, off + m.length]); return m; });
    /* Versionsnummern ("Millenium 4.0") muessen stimmen, sonst bekaeme das Vorgaengermodell den Preis */
    name.replace(/(^|[^\w.,])(\d)\.0(?!\d)/g, (m, v, z) => { sp.push(" " + z + " 0 "); return m; });
    const kz = wo.filter(x => x.length <= 2 && /^[a-zäöüß]+$/.test(x));
    name.replace(/(^|[^\w.,])(\d{1,2})(?![\w.,])/g, (m, v, z, off) => {
      const i = off + v.length;
      if(!belegt.some(([a, b]) => i >= a && i < b)) kz.push(z);
      return m; });
    const nn = normal(name);
    out.push({id:t.id, w:w, k:kz, sp:sp, p:t.p || 0, art:ART[k] || null,
              erlaubt:FREMD.filter(f => nn.indexOf(f) >= 0), menge:new Set(w.concat(kz, sp))});
  }
  return out;
}
function zeileZiele(nachMarke, nm, kat, preis){
  const n = normal(nm), wort = " " + n + " ", kn = normal(kat || "");
  const passend = [];
  for(const erst in nachMarke){
    if(n.indexOf(erst) < 0) continue;
    for(const z of nachMarke[erst]){
      if(!z.w.every(w => n.indexOf(w) >= 0)) continue;
      if(!z.k.every(k => wort.indexOf(" " + k + " ") >= 0)) continue;
      if(!z.sp.every(s => wort.indexOf(s) >= 0)) continue;
      if(FREMD.some(f => z.erlaubt.indexOf(f) < 0 && n.indexOf(f) >= 0)) continue;
      if(z.art && !z.art.some(a => n.indexOf(a) >= 0 || kn.indexOf(a) >= 0)) continue;
      passend.push(z);
    }
  }
  const teilmenge = (a, b) => a.size < b.size && [...a].every(x => b.has(x));
  return passend.filter(z => !passend.some(z2 => teilmenge(z.menge, z2.menge)))
                .filter(z => !z.p || (preis >= 0.3 * z.p && preis <= 1.8 * z.p));
}

/* ═══════════ Produktfeed von Hand ═══════════
   Wer selbst einen Feed aus dem Partnerkonto hat, kann ihn hier laden. Er ist
   zu gross fuer den Geraetespeicher -- bike-components allein liefert
   sechsstellig viele Zeilen. Deshalb wird die Datei in Stuecken gelesen, jede
   Zeile sofort zugeordnet und nur der beste Treffer je Teil behalten. */
function feedEinlesen(datei, fertig){
  const ziele = feedZiele(), nachMarke = {};
  for(const z of ziele) (nachMarke[z.w[0]] = nachMarke[z.w[0]] || []).push(z);
  const beste = {};
  let rest = "", haengt = "", kopf = null, tr = ",", iN = -1, iB = -1, iP = -1, iL = -1, iU = -1, iK = -1, zeilen = 0, pos = 0;
  const STUECK = 4 * 1024 * 1024;
  const balken = document.getElementById("feed-balken");

  function stueck(){
    if(pos >= datei.size){ return abschluss(); }
    const leser = new FileReader();
    leser.onload = function(ev){
      const text = rest + ev.target.result;
      const zs = text.split(/\r?\n/);
      rest = zs.pop();
      for(const z of zs) verarbeite(z);
      pos += STUECK;
      if(balken) balken.style.width = Math.min(100, Math.round(pos/datei.size*100)) + "%";
      setTimeout(stueck, 0);                      /* Oberflaeche zwischendurch atmen lassen */
    };
    leser.onerror = function(){ fertig({fehler:"Datei ließ sich nicht lesen."}); };
    leser.readAsText(datei.slice(pos, pos + STUECK));
  }
  function verarbeite(z){
    if(haengt){ z = haengt + "\n" + z; haengt = ""; }
    if(!z) return;
    if(!kopf){
      const zaehl = c => z.split(c).length;
      tr = [",", ";", "\t", "|"].reduce((a, c) => zaehl(c) > zaehl(a) ? c : a, ",");
      kopf = csvZeile(z, tr).map(x => x.replace(/^﻿/, "").trim().toLowerCase());
      iN = spalteFinden(kopf, SPALTEN.name); iB = spalteFinden(kopf, SPALTEN.bild);
      iP = spalteFinden(kopf, SPALTEN.preis); iL = spalteFinden(kopf, SPALTEN.link);
      iU = spalteFinden(kopf, SPALTEN.uvp); iK = spalteFinden(kopf, SPALTEN.kat);
      return;
    }
    const f = csvZeile(z, tr);
    if(f.offen){ if(z.length < 200000) haengt = z; return; }   /* Zeilenumbruch in einem Feld */
    zeilen++;
    const nm = iN >= 0 ? (f[iN] || "").trim() : "";
    const preis = iP >= 0 ? zahl(f[iP]) : NaN;
    if(!nm || isNaN(preis)) return;
    for(const zi of zeileZiele(nachMarke, nm, iK >= 0 ? f[iK] : "", preis)){
      /* Bei mehreren Treffern den kuerzesten Namen nehmen: das ist meist das
         Produkt selbst und nicht ein Set oder Zubehoer dazu. */
      const alt = beste[zi.id];
      if(alt && (alt.name.length < nm.length || (alt.name.length === nm.length && alt.preis <= preis))) continue;
      const uvp = iU >= 0 ? zahl(f[iU]) : NaN;
      beste[zi.id] = {name:nm, preis:preis, uvp:(uvp > preis) ? uvp : null,
        bild: iB >= 0 ? (f[iB]||"").trim() : "", url: iL >= 0 ? (f[iL]||"").trim() : ""};
    }
  }
  function abschluss(){
    if(rest) verarbeite(rest);
    if(haengt){ const h = haengt; haengt = ""; verarbeite(h + '"'); }
    const treffer = {};
    for(const id in beste){
      const b = beste[id];
      if(!/^https:\/\//i.test(b.bild || "")) b.bild = "";      /* nur sichere Quellen */
      if(!/^https:\/\//i.test(b.url || "")) b.url = "";
      treffer[id] = {bild:b.bild, preis:Math.round(b.preis * 100) / 100, uvp:b.uvp, url:b.url, name:b.name.slice(0, 140)};
    }
    feed = {treffer:treffer, stand:Date.now(), quelle:datei.name, zeilen:zeilen};
    preiseNeu();
    sichern();
    fertig({anzahl:Object.keys(treffer).length, zeilen:zeilen, spalten:{name:iN>=0, bild:iB>=0, preis:iP>=0, link:iL>=0}});
  }
  stueck();
}

/* ═══════════ Eigene Teile ═══════════

/* Preisverlauf der letzten 90 Tage: guenstigstes Angebot je Tag. Eine Linie,
   Tief und Hoch beschriftet -- genug, um zu sehen, ob gerade ein guter Moment ist. */
function verlaufSvg(t){
  const r = (verlauf[t.basisId || t.id] || []).filter(x => Array.isArray(x) && x[0] >= tagVor(90) && +x[1] > 0);
  if(r.length < 2) return "";
  const W = 300, H = 86, pl = 4, pr = 4, pt = 14, pb = 28;
  const t0 = Date.parse(r[0][0]), t1 = Date.parse(r[r.length - 1][0]) || t0 + 1;
  const ps = r.map(x => +x[1]), lo = Math.min.apply(null, ps), hi = Math.max.apply(null, ps);
  const X = d => pl + (W - pl - pr) * ((Date.parse(d) - t0) / Math.max(1, t1 - t0));
  const Y = v => hi === lo ? (pt + H - pb) / 2 : pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo));
  const pts = r.map(x => X(x[0]).toFixed(1) + "," + Y(+x[1]).toFixed(1)).join(" ");
  const iLo = ps.indexOf(lo), iHi = ps.indexOf(hi);
  const tag = d => sprache === "en" ? d.slice(8, 10) + "/" + d.slice(5, 7) : d.slice(8, 10) + "." + d.slice(5, 7) + ".";
  const anker = x => x < W * 0.2 ? "start" : x > W * 0.8 ? "end" : "middle";
  return `<figure class="pv-verlauf">
    <figcaption>${tx("Preisverlauf · günstigstes Angebot je Tag", "Price history · cheapest offer per day")}${t.v && t.v.some(d => d.o.some(o => Math.abs(o.p) >= 20)) ? tx(", alle Ausführungen", ", all versions") : ""}</figcaption>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${tx("Preisverlauf von", "Price history from")} ${esc(eurG(ps[0]))} ${tx("bis", "to")} ${esc(eurG(ps[ps.length - 1]))}">
      <polyline points="${pts}" fill="none" stroke="var(--anod)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${X(r[r.length - 1][0]).toFixed(1)}" cy="${Y(ps[ps.length - 1]).toFixed(1)}" r="3.2" fill="var(--anod)"/>
      ${hi !== lo ? `<text x="${X(r[iHi][0]).toFixed(1)}" y="${(Y(hi) - 4).toFixed(1)}" text-anchor="${anker(X(r[iHi][0]))}">${esc(eurG(hi))}</text>
      <text x="${X(r[iLo][0]).toFixed(1)}" y="${(Y(lo) + 12).toFixed(1)}" text-anchor="${anker(X(r[iLo][0]))}">${esc(eurG(lo))}</text>` : ""}
      <text x="${pl}" y="${H - 2}" text-anchor="start" class="ax">${tag(r[0][0])}</text>
      <text x="${W - pr}" y="${H - 2}" text-anchor="end" class="ax">${tag(r[r.length - 1][0])}</text>
    </svg></figure>`;
}

   Öhlins), mehrere Woerter muessen alle vorkommen. */
let suchText = "";
let filterAlle = false;
function suchNorm(x){
  return String(x).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/ß/g, "ss").replace(/[^a-z0-9.]+/g, " ").trim();
}
function suchIndex(parts){
  const roh = parts.join(" ").toLowerCase();
  const oe = roh.replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue");
  return " " + suchNorm(roh) + " " + suchNorm(oe) + " ";
}
/* Begriffe, nach denen Leute suchen, die aber selten im Namen stehen. Von den
   sieben Mullet-Rahmen traegt nur einer das Wort im Namen -- die Suche nach
   "mullet" fand deshalb einen statt sieben. Abgeleitet aus den Daten, nicht
   von Hand gepflegt. */
function suchExtras(t){
  const x = [];
  if(t.lrV && t.lrH && t.lrV !== t.lrH) x.push("mullet mx gemischt mixed");
  if(t.lrV) x.push(t.lrV + "er", t.lrV + " zoll inch");
  if(t.geo) x.push(t.daempfer ? "fully vollgefedert full suspension" : t.maxGabel > 0 ? "hardtail" : "starr rigid");
  if(t.ha) x.push(achsName(t.ha));
  if(t.va) x.push(achsName(t.va));
  if(t.schaft === "dc") x.push("doppelbrücke dualcrown dual crown");
  if(t.hub > 0 && t.d) x.push("dropper variostütze absenkbar");
  if(t.hub === 0 && t.d) x.push("starr rigid");
  if(t.kolben) x.push(t.kolben + " kolben " + t.kolben + "kolben " + t.kolben + " piston");
  if(t.tType) x.push("t-type ttype transmission");
  if(t.typ === "Metric" && t.el >= 230) x.push("coil stahlfeder");
  if(/Coil/i.test(t.n || "")) x.push("stahlfeder coil");
  return x.join(" ");
}
function filterAnwenden(){
  const wr = suchNorm(suchText).split(" ").filter(Boolean);
  const els = Array.prototype.slice.call(document.querySelectorAll(".sheet .opt"));
  const passendDa = els.some(e => e.dataset.passt === "1");
  let n = 0;
  els.forEach(el => {
    /* Jedes Suchwort muss an einem Wortanfang treffen ("rock" findet RockShox,
       aber "hox" nicht). Eine einzelne Ziffer muss ein ganzes Wort sein -- sonst
       fand "2 kolben" jede Vierkolbenbremse, weil in "203" auch eine 2 steckt. */
    const treffer = wr.every(w => el.dataset.such.indexOf(/^[0-9]$/.test(w) ? " " + w + " " : " " + w) >= 0);
    /* Wer sucht, sucht ueber alles -- sonst findet man den Rahmen nicht, den
       man meint, nur weil die Gabel nicht passt. */
    const filterOk = wr.length || filterAlle || !passendDa || el.dataset.passt === "1" || el.classList.contains("sel");
    const markeOk = !markeWahl || el.dataset.m === markeWahl;
    el.hidden = !(treffer && filterOk && markeOk);
    if(!el.hidden) n++;
  });
  const tr = document.getElementById("treffer");
  if(tr) tr.textContent = wr.length ? n + tx(" Treffer", n === 1 ? " result" : " results") : "";
  const kt = document.getElementById("keine-treffer");
  if(kt) kt.hidden = n > 0;
}

  dirt:   {lk:-25, rc:-55,  vb:[35,50], kurz:0, hub:"keiner", tend:-1},
  slope:  {lk:-15, rc:-40,  vb:[35,50], kurz:0, hub:"keiner", tend:-1},
  trial:  {lk:-20, rc:null, vb:null,    kurz:0, hub:"keiner", tend:0}
};
const CHARAKTER = {verspielt:-1, ausgewogen:0, laufruhig:1};
const HAND = {S:[["dünn", "thin"], ["um 29 mm Durchmesser", "around 29 mm diameter"]], M:[["mittel", "medium"], ["30–31 mm Durchmesser", "30–31 mm diameter"]],
              L:[["dick", "thick"], ["32–33 mm Durchmesser", "32–33 mm diameter"]], XL:[["dick", "thick"], ["33 mm und mehr", "33 mm and more"]]};
const schaetzeSchritt = h => Math.round(h * 0.465);
const schaetzeSchulter = h => Math.round(h * 0.226 * 2) / 2;
const zahlDe = x => sprache === "en" ? String(x) : String(x).replace(".", ",");
const KURBELN = [160, 165, 170, 175];

function fitRechnen(k, ds){
  k = k || koerper;
  ds = (ds && ds.length ? ds : sel).filter(d => FIT_D[d]);
  if(!ds.length) ds = ["trail"];
  const h = +k.groesse;
  if(!(h >= 120 && h <= 230)) return null;
  const schritt = k.schritt > 0 ? +k.schritt : schaetzeSchritt(h);
  const schulter = k.schulter > 0 ? +k.schulter : schaetzeSchulter(h);
  const spann = k.spann > 0 ? +k.spann : h;
  const P = ds.map(d => FIT_D[d]);
  const mittel = f => { const v = P.map(p => p[f]).filter(x => x != null);
    return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const ch = CHARAKTER[k.charakter] || 0;
  const hatD = d => ds.indexOf(d) >= 0, nurD = d => ds.length === 1 && ds[0] === d;
  const namen = ds.map(dLang).join(" + ");

  /* Rahmengroesse: die Koerpergroesse, verschoben um Arme und Beine. Lange
     Arme tragen einen laengeren Rahmen; lange Beine heissen bei gleicher
     Groesse kuerzerer Oberkoerper. */
  const ape = spann - h, bein = schritt / h - 0.465;
  const eff = h + ape * 0.4 - bein * 60;
  let gi = GROESSEN.findIndex(x => eff < x.bis);
  const tend = (mittel("tend") || 0) + ch;
  const unten = gi > 0 ? GROESSEN[gi - 1].bis : -Infinity;
  let zwischen = null;
  if(eff - unten < 1.5){ zwischen = [gi - 1, gi]; if(tend < 0) gi--; }
  else if(GROESSEN[gi].bis - eff < 1.5 && gi < GROESSEN.length - 1){ zwischen = [gi, gi + 1]; if(tend > 0) gi++; }
  let grund = "";
  if(zwischen){
    const a = GROESSEN[zwischen[0]].g, b = GROESSEN[zwischen[1]].g;
    grund = tx(`Du liegst zwischen ${a} und ${b}. `, `You are between ${a} and ${b}. `) + (tend < 0
      ? tx(`${a}: kleiner ist wendiger — passt zu ${ch < 0 ? "deinem verspielten Stil" : namen}.`, `${a}: smaller is more agile — suits ${ch < 0 ? "your playful style" : namen}.`)
      : tend > 0 ? tx(`${b}: größer läuft ruhiger — passt zu ${ch > 0 ? "deinem Wunsch nach Laufruhe" : namen}.`, `${b}: bigger is more stable — suits ${ch > 0 ? "your wish for stability" : namen}.`)
      : tx(`${gi === zwischen[0] ? a : b} nach deinen Maßen — hier lohnt sich eine Probefahrt besonders.`, `${gi === zwischen[0] ? a : b} by your measurements — a test ride is especially worth it here.`));
  }
  let groesseText = "";
  if(ds.every(d => d === "dirt" || d === "slope"))
    groesseText = (gi <= 2 ? tx("Kurze Ausführung (Short)", "Short version") : tx("Lange Ausführung (Long)", "Long version")) + tx(" — Dirt-Rahmen gibt es oft nur in zwei Längen", " — dirt jump frames often come in just two lengths");
  if(nurD("trial")) groesseText = h < 175 ? tx("Trial-Rahmen gehen nach Radstand: für dich um 1000 mm", "Trials frames are sized by wheelbase: around 1000 mm for you") : tx("Trial-Rahmen gehen nach Radstand: für dich 1015 mm und mehr", "Trials frames are sized by wheelbase: 1015 mm or more for you");

  const rcD = mittel("rc");
  const reach = rcD == null ? null : Math.round((2.5 * h + 25 + rcD + ape + ch * 5) / 5) * 5;

  /* Lenker: halb nach Schulterbreite, halb nach Spannweite -- bei
     geschaetzten Massen beides dasselbe, rund 420 mm + 2 mm je cm Groesse.
     Mit dieser Breite stehen die Haende etwa dort, wo man beim Liegestuetz am
     meisten Kraft hat. Laufruhig mag es breiter, verspielt schmaler. */
  let lenker = 0.5 * (420 + 8.85 * schulter) + 0.5 * (420 + 2 * spann) + (mittel("lk") || 0) + ch * 10;
  lenker = Math.max(680, Math.min(820, Math.round(lenker / 10) * 10));

  /* Vorbau: Mitte der Disziplin, laenger bei langen Armen und fuer Laufruhe,
     kuerzer fuer Verspielte -- und zwischen zwei Groessen gleicht er den
     Rahmen aus: kleiner Rahmen, laengerer Vorbau */
  const vbs = P.filter(p => p.vb);
  let vorbau = null;
  if(vbs.length){
    const lo = vbs.reduce((a, p) => a + p.vb[0], 0) / vbs.length, hi = vbs.reduce((a, p) => a + p.vb[1], 0) / vbs.length;
    let m = (lo + hi) / 2 + ape * 0.8 + ch * 5 + (zwischen ? (gi === zwischen[0] ? 5 : -5) : 0);
    m = Math.max(lo - 5, Math.min(hi + 5, m));
    vorbau = [Math.round((m - 5) / 5) * 5, Math.round((m + 5) / 5) * 5];
  }

  /* Kurbel nach Schrittlaenge; Enduro und Downhill eine Stufe kuerzer, das
     setzt seltener auf -- aber nicht unter 165, dafuer gibt es kaum Teile */
  let ki = schritt < 72 ? 0 : schritt < 80 ? 1 : schritt < 88 ? 2 : 3;
  if(P.some(p => p.kurz) && ki > 1) ki--;
  const kurbel = KURBELN[ki];

  /* Hub der Variostuetze: (Schrittlaenge - 58) x 7,5 -- deckt sich mit den
     Tabellen von OneUp und PNW bei ueblichem Sitzrohr (82 cm -> 180 mm) */
  const hubArt = P.some(p => p.hub === "voll") ? "voll" : P.some(p => p.hub === "xc") ? "xc" : "keiner";
  let hub = null;
  if(hubArt !== "keiner"){
    hub = (schritt - 58) * 7.5;
    if(hubArt === "xc") hub = Math.min(170, hub * 0.75);
    hub = Math.max(75, Math.min(240, Math.floor(hub / 5) * 5));
  }
  const sattel = Math.round(schritt * 8.85);
  const sattelTief = ds.every(d => d === "dirt" || d === "slope" || d === "trial");

  let lr, lrWert = "29";
  if(hatD("dirt") || hatD("slope")){ lr = h < 150 ? "24″" : "26″"; lrWert = "26"; }
  else if(hatD("trial")){ lr = "20″ oder 26″"; lrWert = "26"; }
  else if(nurD("xc")) lr = h < 158 ? "27,5″ oder 29″" : "29″";
  else if(hatD("dh")) lr = h < 172 ? "Mullet" : "29″ oder Mullet";
  else lr = h < 165 ? "Mullet oder 27,5″" : h < 172 ? "29″ oder Mullet" : "29″";
  const lrText = lr.indexOf("Mullet") >= 0 ? tx("Mullet: vorn 29″, hinten 27,5″ — mehr Platz hinter dem Sattel", "Mullet: 29″ front, 27.5″ rear — more room behind the saddle")
    : lr === "29″" ? tx("rollt am leichtesten über Wurzeln und Stufen", "rolls most easily over roots and steps") : lr === "26″" || lr === "24″" ? tx("klein, stabil, wendig in der Luft", "small, strong, agile in the air") : "";
  /* Anzeige: der Vergleich oben arbeitet mit der deutschen Form */
  lr = tx(lr, lr.replace(/ oder /g, " or ").replace("27,5", "27.5"));
  let rise = h >= 190 ? 35 : h >= 182 ? 30 : h >= 168 ? 20 : 15;
  if(hatD("dh") || hatD("enduro")) rise += 5;
  if(nurD("xc")) rise = Math.max(0, rise - 15);

  return {h:h, schritt:schritt, schulter:schulter, spann:spann, ds:ds,
    geschaetzt:{schritt:!(k.schritt > 0), schulter:!(k.schulter > 0), spann:!(k.spann > 0)},
    gi:gi, groesse:GROESSEN[gi].g, sp:GROESSEN[gi].sp, zwischen:zwischen, grund:grund, groesseText:groesseText,
    reach:reach, lenker:lenker, vorbau:vorbau, kurbel:kurbel, hub:hub, hubArt:hubArt, sattel:sattel, sattelTief:sattelTief,
    lr:lr, lrWert:lrWert, lrText:lrText, rise:[rise, rise + 10], hand:k.hand && HAND[k.hand] ? k.hand : ""};
}

/* Wie weit der Aufbau zum Fahrer passt: eine Zeile je Teil, das an den
   Koerper gebunden ist. Das zaehlt nicht in die Wertung -- ein Lenker, den man
   noch kuerzen muss, ist kein Konflikt. */
const hatDim = (t, k) => !!(t && t.v && t.v.some(d => d.k === k && d.o.length > 1));
const dimWerte = (t, k, f) => { const d = t && t.v && t.v.find(x => x.k === k); return d ? d.o.map(o => o.s && o.s[f]).filter(x => x != null) : []; };
const naechster = (liste, z) => liste.reduce((a, b) => Math.abs(b - z) < Math.abs(a - z) ? b : a, liste[0]);
let fitListe = [];
function fitBefunde(b){
  const f = fitRechnen();
  if(!f || !b) return [];
  const t = k => b[k] && !entfaellt(b, k) ? findeTeil(k, b[k]) : null;
  const out = [];
  const r = t("rahmen");
  if(r){
    const sp = r.m === "Specialized" ? tx(` (bei Specialized ${f.sp})`, ` (${f.sp} at Specialized)`) : "";
    out.push({s:"ok", slot:"rahmen", titel:tx(`Rahmen in Größe ${f.groesse} bestellen${sp}`, `Order the frame in size ${f.groesse}${sp}`), kurz:tx(`Für dich: Größe ${f.groesse}${sp}`, `For you: size ${f.groesse}${sp}`),
      text:[f.groesseText ? esc(f.groesseText) + "." : "",
        f.reach ? tx(`Ziel-Reach <code>${f.reach - 10}–${f.reach + 10} mm</code> — im Datenblatt nachsehen, jede Marke schneidet ihre Größen anders.`, `Target reach <code>${f.reach - 10}–${f.reach + 10} mm</code> — check the geometry chart, every brand sizes differently.`) : "",
        f.grund ? esc(f.grund) : ""].filter(Boolean).join(" ")});
  }
  const l = t("lenker");
  if(l && l.breite){
    if(l.breite < f.lenker - 20) out.push({s:"warn", slot:"lenker", titel:tx("Lenker schmaler als für dich ideal", "Bar narrower than ideal for you"),
      kurz:tx(`Für dich ${f.lenker} mm — der hier hat nur ${l.breite}`, `For you ${f.lenker} mm — this one is only ${l.breite}`),
      text:tx(`<code>${l.breite} mm</code> ab Werk, für deine Schultern passen rund <code>${f.lenker} mm</code>. Kürzen geht immer, verlängern nie — nimm einen breiteren.`,
        `<code>${l.breite} mm</code> out of the box, your shoulders suit around <code>${f.lenker} mm</code>. You can always cut, never extend — pick a wider one.`)});
    else if(l.breite > f.lenker + 5) out.push({s:"tipp", slot:"lenker", titel:tx(`Lenker auf ${f.lenker} mm kürzen`, `Cut the bar to ${f.lenker} mm`),
      kurz:tx(`Für dich: auf ${f.lenker} mm kürzen`, `For you: cut to ${f.lenker} mm`),
      text:tx(`Ab Werk <code>${l.breite} mm</code> — je Seite <code>${zahlDe((l.breite - f.lenker) / 2)} mm</code> ab. Erst ein paar Ausfahrten breit fahren, dann in 5-mm-Schritten je Seite kürzen. Griffe, Bremsen und Schalthebel wandern mit nach innen.`,
        `<code>${l.breite} mm</code> out of the box — take <code>${zahlDe((l.breite - f.lenker) / 2)} mm</code> off each side. Ride it wide for a few rides first, then cut in 5 mm steps per side. Grips, brakes and shifter move inwards with it.`)});
    else out.push({s:"ok", slot:"lenker", titel:tx("Lenkerbreite passt zu dir", "Bar width suits you"), kurz:tx("✓ Breite passt zu dir", "✓ Width suits you"),
      text:tx(`<code>${l.breite} mm</code> — für deine Schultern sind ${f.lenker - 10}–${f.lenker + 10} mm richtig.`, `<code>${l.breite} mm</code> — ${f.lenker - 10}–${f.lenker + 10} mm is right for your shoulders.`)});
  }
  const v = t("vorbau");
  if(v && f.vorbau && !v.dm && v.laenge < 100){
    const [a, c] = f.vorbau, dim = hatDim(v, "Länge");
    if(v.laenge < a - 5 || v.laenge > c + 5) out.push({s:"tipp", slot:"vorbau", titel:tx(`Vorbau: für dich eher ${a}–${c} mm`, `Stem: more like ${a}–${c} mm for you`),
      kurz:tx(`Für dich: ${a}–${c} mm${dim ? " — Ausführung umstellen" : ""}`, `For you: ${a}–${c} mm${dim ? " — change the version" : ""}`),
      text:tx(`Verbaut sind <code>${zahlDe(v.laenge)} mm</code>. ${v.laenge < a ? "Etwas länger bringt mehr Druck aufs Vorderrad und mehr Platz im Cockpit." : "Kürzer lenkt direkter und stellt dich bergab hinter den Lenker."}${dim ? " Diesen Vorbau gibt es in anderen Längen — am Teil unter „Ausführung“." : ""}`,
        `Fitted: <code>${zahlDe(v.laenge)} mm</code>. ${v.laenge < a ? "A little longer puts more weight on the front wheel and gives more room in the cockpit." : "Shorter steers more directly and puts you behind the bar on descents."}${dim ? " This stem comes in other lengths — on the part under “Version”." : ""}`)});
    else out.push({s:"ok", slot:"vorbau", titel:tx("Vorbaulänge passt zu dir", "Stem length suits you"), kurz:tx("✓ Länge passt zu dir", "✓ Length suits you"),
      text:tx(`<code>${zahlDe(v.laenge)} mm</code> — für dich sind ${a}–${c} mm richtig.`, `<code>${zahlDe(v.laenge)} mm</code> — ${a}–${c} mm is right for you.`)});
  }
  const ku = t("kurbel");
  if(ku && ku.laenge){
    const w = dimWerte(ku, "Kurbellänge", "laenge"), ziel = w.length ? naechster(w, f.kurbel) : ku.laenge;
    if(ku.laenge !== ziel) out.push({s:Math.abs(ku.laenge - f.kurbel) >= 10 ? "warn" : "tipp", slot:"kurbel", titel:tx(`Kurbel: für dich ${ziel} mm`, `Cranks: ${ziel} mm for you`),
      kurz:tx(`Für dich: ${ziel} mm — Ausführung umstellen`, `For you: ${ziel} mm — change the version`),
      text:tx(`Verbaut sind <code>${ku.laenge} mm</code>. ${ku.laenge > f.kurbel ? "Kürzere Kurbeln setzen seltener an Steinen auf und drehen runder." : "Etwas länger gibt mehr Hebel bergauf."} Die Länge wählst du am Teil unter „Ausführung“ — kostet nichts extra.`,
        `Fitted: <code>${ku.laenge} mm</code>. ${ku.laenge > f.kurbel ? "Shorter cranks strike rocks less often and spin more smoothly." : "A little longer gives more leverage uphill."} You choose the length on the part under “Version” — at no extra cost.`)});
    else out.push({s:"ok", slot:"kurbel", titel:tx("Kurbellänge passt zu dir", "Crank length suits you"), kurz:tx("✓ Länge passt zu dir", "✓ Length suits you"),
      text:`<code>${ku.laenge} mm</code>${ziel !== f.kurbel ? tx(` — ideal wären ${f.kurbel} mm, das gibt es von diesem Modell nicht`, ` — ${f.kurbel} mm would be ideal, this model doesn't come in that length`) : tx(" — genau richtig für deine Schrittlänge", " — just right for your inseam")}.`});
  }
  const st = t("stuetze");
  if(st && f.hub && st.hub > 0){
    const gs = f.geschaetzt.schritt ? tx(" (geschätzt)", " (estimated)") : "";
    /* Mehr Hub nur empfehlen, wenn das Sitzrohr ihn auch schluckt */
    const rahmenMax = r && r.einsteck > 0 ? r.einsteck - (st.einbau - st.hub) : Infinity, ziel = Math.min(f.hub, rahmenMax);
    if(st.hub > f.hub + 15) out.push({s:"warn", slot:"stuetze", titel:tx("Stütze hat mehr Hub, als deine Beine brauchen", "Post has more drop than your legs need"),
      kurz:tx(`Für dich: bis ${f.hub} mm Hub`, `For you: up to ${f.hub} mm drop`),
      text:tx(`<code>${st.hub} mm</code> Hub. Ganz versenkt und ausgefahren stünde der Sattel für ${f.schritt} cm Schrittlänge${gs} wahrscheinlich zu hoch — nimm höchstens rund <code>${f.hub} mm</code>. Im Zweifel die Gesamtlänge der Stütze gegen dein Sitzrohr rechnen.`,
        `<code>${st.hub} mm</code> drop. Fully inserted and extended, the saddle would probably be too high for a ${f.schritt} cm inseam${gs} — take around <code>${f.hub} mm</code> at most. If in doubt, check the post's total length against your seat tube.`)});
    else if(st.hub < ziel - 35) out.push({s:"tipp", slot:"stuetze", titel:tx(`Mehr Hub ginge: bis ${Math.floor(ziel / 5) * 5} mm`, `More drop would work: up to ${Math.floor(ziel / 5) * 5} mm`),
      kurz:tx(`Für dich: bis ${Math.floor(ziel / 5) * 5} mm Hub`, `For you: up to ${Math.floor(ziel / 5) * 5} mm drop`),
      text:tx(`<code>${st.hub} mm</code> verbaut. Mit ${f.schritt} cm Schrittlänge${gs} verschwindet der Sattel bergab mit bis zu <code>${Math.floor(ziel / 5) * 5} mm</code> weiter aus dem Weg${ziel < f.hub ? " — mehr lässt das Sitzrohr bei dieser Stütze nicht zu" : ""}.`,
        `<code>${st.hub} mm</code> fitted. With a ${f.schritt} cm inseam${gs}, up to <code>${Math.floor(ziel / 5) * 5} mm</code> gets the saddle further out of the way on descents${ziel < f.hub ? " — the seat tube doesn't allow more with this post" : ""}.`)});
    else out.push({s:"ok", slot:"stuetze", titel:tx("Hub passt zu deinen Beinen", "Drop suits your legs"), kurz:tx("✓ Hub passt zu dir", "✓ Drop suits you"),
      text:tx(`<code>${st.hub} mm</code> — für ${f.schritt} cm Schrittlänge${gs} gehen bis rund ${f.hub} mm${rahmenMax < f.hub ? `, das Sitzrohr lässt mit dieser Stütze ${Math.max(st.hub, Math.floor(rahmenMax / 5) * 5)} mm zu` : ""}.`,
        `<code>${st.hub} mm</code> — a ${f.schritt} cm inseam${gs} allows up to around ${f.hub} mm${rahmenMax < f.hub ? `, the seat tube allows ${Math.max(st.hub, Math.floor(rahmenMax / 5) * 5)} mm with this post` : ""}.`)});
  }
  return out;
}
function fitKachel(slotKey){
  const x = fitListe.find(y => y.slot === slotKey);
  return x ? `<span class="fit ${x.s === "ok" ? "ok" : x.s === "warn" ? "warn" : "tipp"}">${esc(x.kurz)}</span>` : "";
}

/* Ausfuehrungen, die sich nach dem Fahrer richten: Kurbellaenge, Hub,
   Vorbaulaenge, Rise. Getauscht wird nur innerhalb des Modells und nur, wenn
   die Pruefung dadurch nicht schlechter wird -- Preis und Budget bleiben. */
const FIT_DIM = {kurbel:["Kurbellänge", "laenge"], stuetze:["Hub", "hub"], vorbau:["Länge", "laenge"], lenker:["Rise", "rise"]};
function fitAnpassen(b, protokoll){
  const f = fitRechnen();
  if(!f || !b) return b;
  const neu = {...b};
  for(const k in FIT_DIM){
    if(!neu[k] || entfaellt(neu, k)) continue;
    const t = findeTeil(k, neu[k]);
    if(!t || !t.v || !t.wahl) continue;
    const basis = rohTeil(quelleOf(slotOf(k)), t.basisId);
    const i = basis ? basis.v.findIndex(d => d.k === FIT_DIM[k][0]) : -1;
    if(i < 0) continue;
    const d = basis.v[i], wert = o => o.s[FIT_DIM[k][1]];
    let abstand;
    if(k === "kurbel") abstand = o => Math.abs(wert(o) - f.kurbel);
    else if(k === "stuetze"){ if(!f.hub || !t.hub) continue; abstand = o => wert(o) > f.hub ? 1000 + wert(o) - f.hub : f.hub - wert(o); }
    else if(k === "vorbau"){ if(!f.vorbau || t.dm) continue; const m = (f.vorbau[0] + f.vorbau[1]) / 2; abstand = o => Math.abs(wert(o) - m); }
    else { const m = (f.rise[0] + f.rise[1]) / 2; abstand = o => Math.abs(wert(o) - m); }
    let best = t.wahl[i], bestA = d.o[best] && d.o[best].s ? abstand(d.o[best]) : Infinity;
    d.o.forEach((o, j) => {
      if(!o.s || optionPasst(k, d, o, neu) === false) return;
      const a = abstand(o);
      if(a < bestA - 1e-9){ best = j; bestA = a; }
    });
    if(best === t.wahl[i]) continue;
    const w = t.wahl.slice(); w[i] = best;
    const kand = varianteNachIndex(basis, w), probe = {...neu};
    probe[k] = kand.id;
    const vor = bilanz(neu), nach = bilanz(probe);
    if(nach.f > vor.f || nach.w > vor.w) continue;
    neu[k] = kand.id;
    if(protokoll) protokoll.push(slotOf(k).label + " " + d.o[best].n + (k === "lenker" ? " Rise" : k === "stuetze" ? tx(" Hub", " drop") : ""));
  }
  return neu;
}

/* ── Zeichnungen ── */

const tacho = (dx, dy) => `<path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l${dx} ${dy}"/><circle cx="12" cy="17" r="1.3"/>`;
const IC = {
  traum:`<path d="m12 3 1.9 5.3L19 10l-5.1 1.7L12 17l-1.9-5.3L5 10l5.1-1.7z"/><path d="M19 15.5 19.8 18l2.2.8-2.2.8L19 22l-.8-2.4-2.2-.8 2.2-.8z"/>`,
  real:`<circle cx="5.5" cy="16.5" r="3.5"/><circle cx="18.5" cy="16.5" r="3.5"/><path d="m5.5 16.5 4-7h6l3 7M9.5 9.5l3 7h3M13 6h3"/>`,

  neu:`<path d="M12 21v-8"/><path d="M12 13C12 9 9.5 6 5 6c0 4 2.5 7 7 7z"/><path d="M12 15c0-3.5 2.5-6.5 7-6.5 0 3.5-2.5 6.5-7 6.5z"/>`,

    + rohr(add(ho, mul(dA, -12)), add(ho, mul(dA, -4)), 62, 62, "r-dunkel")
    + C(add(lerp(ho, hu, .45), mul(qA, -14)), 7, "r-dunkel2")
    + rohr(st(sr - 16), st(sr + 6), 52, 52, "r-dunkel") + C(add(st(sr - 5), mul(sN, 27)), 6, "r-metall");

  /* Stahlfeder-Daempfer 230×65: Koerper mit Ausgleichsbehaelter und
     Einstellknopf, Kolbenstange, Feder als Wendel (hintere Windungen dunkel) */
  let wHinten = "", wVorn = "";
  const sp0 = add(se1, mul(dD, -30)), sp9 = add(se0, mul(dD, 30)), nW = 8, wh = len(sub(sp0, sp9)) / nW;
  for(let i = 0; i < nW; i++){
    const a = add(sp0, mul(dD, -i * wh)), m = add(a, mul(dD, -wh / 2)), b = add(a, mul(dD, -wh));
    wVorn += zug([add(a, mul(dQ, 31)), sub(m, mul(dQ, 31))]);
    wHinten += zug([sub(m, mul(dQ, 31)), add(b, mul(dQ, 31))]);
  }
  const kopfD = add(se1, mul(dQ, -46));
  const daempfer = `<path class="r-feder2" d="${wHinten}"/>`
    + rohr(add(se1, mul(dD, -10)), add(se1, mul(dD, -128)), 42, 42, "r-dunkel") + glanz(add(se1, mul(dD, -10)), add(se1, mul(dD, -128)), 42, 42)
    + rohr(add(se1, mul(dD, -128)), add(se0, mul(dD, 12)), 16, 16, "r-metall")
    + rohr(se1, kopfD, 34, 34, "r-dunkel") + rohr(add(kopfD, mul(dD, 6)), add(kopfD, mul(dD, -86)), 32, 30, "r-dunkel2")
    + C(add(kopfD, mul(dD, 4)), 11, "r-knopf")
    + `<path class="r-feder" d="${wVorn}"/>`
    + rohr(add(sp0, mul(dD, 4)), add(sp0, mul(dD, -4)), 72, 72, "r-dunkel") + rohr(add(sp9, mul(dD, 8)), add(sp9, mul(dD, -8)), 72, 72, "r-dunkel")
    + C(se1, 16, "r-dunkel") + C(se0, 16, "r-dunkel");
  const hebel = schlauch([lp1, lp0, se0], [34, 42, 30], "r-glied") + schlauch([up1, up0, se1], [32, 42, 30], "r-glied")
    + [lp0, lp1, se0, up0, up1, se1].map(p => C(p, 9, "r-metall") + C(p, 3.5, "r-dunkel2")).join("");

  /* Gabel nach dem Vorbild einer 38er Freeride-Gabel, in eigenen Koordinaten
     gezeichnet: x nach vorn quer zur Lenkachse, y die Standrohrachse hinunter,
     0 = Oberkante Krone. Achse bis Krone rund 588 mm (Fox 38, 29″: 583),
     frei: Federweg plus 22 mm Puffer, Tauchrohr gut 340 mm -- oben breit, wo
     die Buchsen sitzen, unten schlanker, um die Achse wieder dicker. Die
     Bruecke sitzt vorn ueber dem Reifen (Abstand zur Achse > Reifenradius). */
  const kr0 = add(hu, mul(dA, 18)), b0 = add(kr0, mul(qA, off));
  const La = r1(L - 18), fs = ht ? 18 : 20, kh = ht ? 42 : 50, sd = kh + fw + 22, s = -off;
  const gabel = `<g transform="translate(${P(b0)}) rotate(${r1(lw * 180 / Math.PI - 90)})">
    <rect class="r-dunkel" x="${s - 36}" y="-8" width="72" height="9" rx="2"/>
    <rect class="r-dunkel2" x="-17" y="-15" width="34" height="16" rx="3"/>
    <rect class="r-knopf" x="-13" y="-23" width="26" height="9" rx="3"/><rect class="r-knopf" x="-6" y="-28" width="12" height="6" rx="2"/>
    <rect class="r-gold" x="${-fs}" y="${kh - 6}" width="${2 * fs}" height="${sd - kh + 8}"/>
    <rect class="r-standlicht" x="${-fs + 5}" y="${kh}" width="5" height="${sd - kh - 12}" rx="2.5"/>
    <rect class="r-standschatten" x="${fs - 8}" y="${kh}" width="6" height="${sd - kh - 12}" rx="3"/>
    <path class="r-dunkel" d="M${s - 24} 8C${s - 24} 2 ${s - 18} 0 ${s - 12} 0L16 -2C28 -2 34 6 34 16L34 ${kh - 12}C34 ${kh - 2} 27 ${kh} 16 ${kh}L-8 ${kh - 2}C${s + 10} ${kh - 8} ${s - 4} ${kh - 12} ${s - 12} ${kh - 14}C${s - 20} ${kh - 15} ${s - 24} ${kh - 20} ${s - 24} ${kh - 26}Z"/>
    <path class="r-glanz" d="M${s - 14} 5L16 3"/>
    <circle class="r-metall" cx="-24" cy="${kh / 2}" r="5"/><circle class="r-metall" cx="${s - 6}" cy="${kh / 2 - 4}" r="4.5"/>
    ${ht ? "" : `<path class="r-dunkel" d="M24 ${sd - 34}C26 ${sd - 44} 44 ${sd - 48} 50 ${sd - 34}C56 ${sd - 20} 56 ${sd + 8} 48 ${sd + 30}C42 ${sd + 48} 36 ${sd + 64} 30 ${sd + 80}L26 ${sd + 2}Z"/>`}
    <path class="r-dunkel" d="M-32 ${sd + 8}C-32 ${sd + 2} -27 ${sd} -20 ${sd}L20 ${sd}C27 ${sd} 32 ${sd + 2} 32 ${sd + 8}L31 ${sd + 96}L27 ${La - 72}C27 ${La - 46} 34 ${La - 36} 34 ${La}C34 ${La + 22} 18 ${La + 32} 0 ${La + 32}C-18 ${La + 32} -34 ${La + 22} -34 ${La}C-34 ${La - 36} -27 ${La - 46} -27 ${La - 72}L-31 ${sd + 96}Z"/>
    <path class="r-glanz" d="M-21 ${sd + 16}L-18 ${La - 74}"/><path class="r-kschatten" d="M24 ${sd + 16}L20 ${La - 74}"/>
    <path class="r-dekor" d="M9 ${sd + 44}L8 ${sd + 190}"/>
    <rect class="r-dichtung" x="-26" y="${sd - 11}" width="52" height="14" rx="4"/>
    <circle class="r-felgeninnen" cx="0" cy="${La}" r="25"/><circle class="r-metall" cx="0" cy="${La}" r="17"/><circle class="r-dunkel2" cx="0" cy="${La}" r="7"/>
    <rect class="r-zug" x="-8" y="${La + 29}" width="16" height="9" rx="3"/>
  </g>`;

  /* Sattelstuetze: Vario mit Aussenrohr, Dichtkopf und glaenzendem Standrohr;
     beim Dirt-Rad starr. Sattel mit Streben. */
  const pOben = Math.max(sr + 30, sattel - 170);
  const sattelPkt = [[-150, -20], [-144, -4], [-126, 8], [-60, 5], [40, -3], [138, -10], [164, -18], [154, -31], [40, -38], [-60, -37], [-128, -35]];
  const sitz = (ht || sattel - 62 < pOben + 12 ? rohr(st(sr + 6), st(sattel - 40), 30, 30, "r-dunkel2")
      : rohr(st(sr + 6), st(pOben), 36, 36, "r-dunkel2") + rohr(st(pOben - 2), st(pOben + 10), 40, 40, "r-dunkel")
        + rohr(st(pOben + 10), st(sattel - 62), 30, 30, "r-stuetze") + glanz(st(pOben + 10), st(sattel - 62), 30, 30))
    + rohr(st(sattel - 66), st(sattel - 40), 46, 36, "r-dunkel")
    + `<path class="r-streben" d="${zug([add(sa, [-98, -30]), add(sa, [-10, -38]), add(sa, [78, -30])])}"/>`
    + `<path class="r-sattel" d="${glatt(sattelPkt.map(p => [sa[0] + p[0], -(sa[1] + p[1])]), true)}"/>`
    + `<path class="r-schale" d="${weich([add(sa, [-146, -22]), add(sa, [-60, -34]), add(sa, [40, -35]), add(sa, [150, -26])])}"/>`
    + `<path class="r-glanz" d="${weich([add(sa, [-120, 4]), add(sa, [10, 2]), add(sa, [128, -8])])}"/>`;

  /* Cockpit: Steuersatz, Spacer, Vorbau, Lenker mit Rise, Bremsgriff,
     Schalthebel und die Leitungen, die vorn am Unterrohr im Rahmen verschwinden */
  const port = add(add(u1, mul(ud, -50)), mul(nrm(ud), 26));
  const cockpit = rohr(add(ho, mul(dA, -4)), add(sp1, mul(dA, 18)), 42, 42, "r-dunkel2")
    + rohr(add(sp1, mul(dA, 20)), add(sp1, mul(dA, -20)), 50, 50, "r-dunkel") + rohr(add(sp1, mul(dA, -20)), add(sp1, mul(dA, -26)), 40, 40, "r-dunkel2")
    + `<path class="r-leitung" d="${weich([add(gr, [40, -8]), add(add(ho, mul(qA, 96)), mul(dA, 30)), add(add(hu, mul(qA, off + 50)), mul(dA, 10)), add(kr0, mul(qA, off + 18))])}"/>`
    + `<path class="r-leitung" d="${weich([add(gr, [14, -24]), add(add(ho, mul(qA, 70)), mul(dA, 50)), add(port, mul(qA, 40)), port])}"/>`
    + `<path class="r-leitung" d="${weich([add(gr, [26, -20]), add(add(ho, mul(qA, 82)), mul(dA, 40)), add(add(port, mul(qA, 50)), mul(ud, -10)), add(port, mul(ud, -14))])}"/>`
    + rohr(sp1, ve, 44, 40, "r-dunkel") + glanz(sp1, ve, 44, 40) + C(ve, 30, "r-dunkel") + C(ve, 19, "r-metall")
    + C(add(ve, mul(qA, 20)), 4, "r-metall") + rohr(ve, gr, 30, 24, "r-metall")
    + rohr(add(gr, [16, -2]), add(gr, [50, 8]), 18, 14, "r-dunkel")
    + `<path class="r-hebel" d="${weich([add(gr, [22, -6]), add(gr, [62, -16]), add(gr, [88, -44])])}"/>`
    + rohr(add(gr, [2, -16]), add(gr, [26, -30]), 14, 10, "r-dunkel2") + C(gr, 21, "r-griff");

  /* Antrieb: 32er-Kettenblatt mit Fuehrung und Bashguard, 12-fach-Kassette
     10–51, Schaltwerk mit zwei Roellchen, Kette als S um beide Roellchen.
     Dirt: Singlespeed, 14er-Ritzel. Radien = Teilkreise der Zaehne. */
  const rk = 64.7, rz = ht ? 29 : 48.5, rp = 17;
  const tang = (c1, r1_, c2, r2, oben) => { const d = sub(c2, c1), l = len(d), u = mul(d, 1 / l), v = [-u[1], u[0]], s = (r1_ - r2) / l, c = Math.sqrt(1 - s * s);
    const nA = add(mul(u, s), mul(v, c)), nB = add(mul(u, s), mul(v, -c)), nn = (nA[1] > nB[1]) === oben ? nA : nB;
    return [add(c1, mul(nn, r1_)), add(c2, mul(nn, r2))]; };
  const ab = (a0, a1) => a1 < a0 ? a1 + 2 * Math.PI : a1;
  const [t1, t2] = tang([0, 0], rk, ax, rz, true);
  let kettePts, werk = "";
  if(ht){
    const [b1, b2] = tang([0, 0], rk, ax, rz, false);
    kettePts = [t1, t2].concat(bogen(ax, rz, winkel(ax, t2), ab(winkel(ax, t2), winkel(ax, b2))), [b1], bogen([0, 0], rk, winkel([0, 0], b1), ab(winkel([0, 0], b1), winkel([0, 0], t1))));
  } else {
    const jp1 = add(ax, [16, -(rz + 12 + rp)]), jp2 = add(jp1, [-12, -76]);
    const [b1, b2] = tang(jp2, rp, [0, 0], rk, false);
    kettePts = [t1, t2].concat(bogen(ax, rz, winkel(ax, t2), 1.5 * Math.PI), bogen(jp1, rp, .75 * Math.PI, -.1 * Math.PI),
      bogen(jp2, rp, .95 * Math.PI, ab(.95 * Math.PI, winkel(jp2, b1))), [b2], bogen([0, 0], rk, winkel([0, 0], b2), ab(winkel([0, 0], b2), winkel([0, 0], t1))));
    werk = `<path class="r-dunkel" d="${zug([add(ax, [-30, -20]), add(ax, [-50, -50]), add(jp1, [-8, 14]), add(jp1, [16, 22])])}Z"/>`
      + rohr(add(ax, [-10, -6]), add(ax, [-34, -30]), 28, 26, "r-dunkel")
      + rohr(jp1, jp2, 42, 40, "r-dunkel2") + glanz(jp1, jp2, 42, 40) + C(jp1, 7, "r-metall") + C(jp2, 7, "r-metall");
  }
  const kassette = ht ? C(ax, 32, "r-kassette-grund") + C(ax, 31, "r-kassette") + C(ax, 20, "r-dunkel2")
    : C(ax, 104, "r-kassette-grund") + [104, 95, 86, 77, 68, 59, 51, 43, 36, 29, 23].map(r => C(ax, r, "r-kassette")).join("") + C(ax, 16, "r-dunkel2");
  const kette = `<path class="r-kettengrund" d="${zug(kettePts)}"/><path class="r-kette" d="${zug(kettePts)}"/>`;
  const pedal = (p, fern) => {
    let pins = "";
    for(const dx of [-40, -14, 14, 40]) pins += `<rect class="r-pin" x="${r1(p[0] + dx - 3)}" y="${r1(-p[1] - 20)}" width="6" height="8"/><rect class="r-pin" x="${r1(p[0] + dx - 3)}" y="${r1(-p[1] + 12)}" width="6" height="8"/>`;
    return pins + `<rect class="${fern ? "r-dunkel2" : "r-pedal"}" x="${r1(p[0] - 54)}" y="${r1(-p[1] - 13)}" width="108" height="26" rx="9"/>` + C(p, 7, "r-metall");
  };
  const antriebHinten = rohr([0, 0], pf, 40, 28, "r-dunkel2") + pedal(pf, true);
  const kurbelVorn = C([0, 0], 66.5, "r-zaehne") + C([0, 0], 60, "r-blatt") + C([0, 0], 48, "r-dunkel2")
    + [0, 1, 2, 3].map(i => C(polar([0, 0], 34, i * Math.PI / 2 + .4), 7, "r-dunkel")).join("")
    + (ht ? "" : rohr(polar([0, 0], 80, 1.85), polar([0, 0], 80, 2.35), 20, 20, "r-dunkel") + `<path class="r-bash" d="${zug(bogen([0, 0], 76, -1.35, .15))}"/>`)
    + rohr([0, 0], pe, 44, 28, "r-dunkel") + glanz([0, 0], pe, 44, 28) + C([0, 0], 19, "r-metall") + C([0, 0], 8, "r-dunkel2") + pedal(pe, false);

  /* Fahrer: Beine und Arme ueber zwei Glieder zwischen festen Punkten
     (Huefte-Pedal, Schulter-Griff). Die Beinlaenge ergibt sich aus der
     Sattelhoehe -- unten ist das Knie wie beim Bikefit rund 30 Grad gebeugt.
     Gezeichnet als Trail-Fahrer: Helm mit Schirm, Brille, Gesicht im Profil,
     weites Trikot mit Licht und Schatten, Handschuhe um den Griff, Shorts
     ueber Knieschonern, Socken und Flat-Schuhe. Alle Masse in mm fuer 178 cm,
     skaliert mit der Koerpergroesse. */
  let fHinten = "", fVorn = "", kopfOben = 0;
  if(o.fahrer){
    const H = o.fahrer.h * 10, steh = !!o.fahrer.stehend, sk = H / 1780, s = v => v * sk;
    const ank = p => add(p, [-50, 72]);
    const gelenk = (a, b, la, lb, wahl) => {
      const d = Math.max(1, Math.min(len(sub(b, a)), la + lb - 2)), ex = unit(sub(b, a)), ey = nrm(ex);
      const x = (la * la - lb * lb + d * d) / (2 * d), y = Math.sqrt(Math.max(0, la * la - x * x)), m = add(a, mul(ex, x));
      return {g:wahl(add(m, mul(ey, y)), add(m, mul(ey, -y))), end:add(a, mul(ex, d))};
    };
    let huefte, Lo, Lu;
    if(steh){
      Lo = H * .245; Lu = H * .26;
      const a = ank(pe), w = .8 * (Lo + Lu), dx = -140 - a[0];
      huefte = [-140, a[1] + Math.sqrt(Math.max(0, w * w - dx * dx))];
    } else {
      huefte = add(sa, [-34, 94]);                     /* ueber den Sitzknochen, hinter der Sattelmitte */
      const d0 = len(sub(huefte, ank([0, -kurbel])));
      Lo = d0 / 1.932 * .97; Lu = d0 / 1.932 * 1.03;
    }
    const T = H * .30, Loa = H * .175, Lua = H * .205;
    let best = null;
    for(let g = steh ? 26 : 15; g <= (steh ? 46 : 80); g++){          /* stehend: Angriffshaltung, Oberkoerper vorn */
      const sp = polar(huefte, T, g * Math.PI / 180), dd = Math.abs(len(sub(gr, sp)) - (steh ? .9 : .975) * (Loa + Lua));
      if(!best || dd < best.dd) best = {g:g, s:sp, dd:dd};
    }
    const sch = best.s;
    const ell = gelenk(sch, gr, Loa, Lua, (a, b) => a[1] < b[1] ? a : b).g;
    const vorn = (a, b) => a[0] > b[0] ? a : b;
    const Q = pts => glatt(pts.map(p => [p[0], -p[1]]), true);
    /* Glied mit Muskel: Kontur um die Achse a->b. w0, wm, w1: Breite am
       Anfang, am Bauch (bei t) und am Ende; bv woelbt die linke Seite
       (Oberschenkel oben, Schienbein vorn), bh die rechte (Wade, Kniekehle). */
    const gliedD = (a, b, w0, wm, w1, bv, bh, t) => {
      const d = unit(sub(b, a)), q = nrm(d), m = add(a, mul(sub(b, a), t));
      return Q([add(a, mul(q, w0 / 2)), add(m, mul(q, wm / 2 + bv)), add(b, mul(q, w1 / 2)),
        add(b, mul(d, w1 * .42)), sub(b, mul(q, w1 / 2)), sub(m, mul(q, wm / 2 + bh)), sub(a, mul(q, w0 / 2)), sub(a, mul(d, w0 * .42))]);
    };
    const glied = (a, b, w0, wm, w1, bv, bh, t, k, x) => `<path${k ? ` class="${k}"` : ""}${x || ""} d="${gliedD(a, b, w0, wm, w1, bv, bh, t)}"/>`;
    let beinNr = 0;
    const linie = (pts, k) => `<path class="${k}" d="M${pts.map(P).join("L")}"/>`;
    /* Flat-Schuh am Pedal, in eigenen Koordinaten (x nach vorn, y nach unten,
       Pedalachse im Ursprung): Zehenkappe, Schnuerung, Kragen, helle Sohle */
    const SCHUH = `<path class="r-schuh" d="M-152 -14L96 -14C112 -14 119 -25 113 -37C105 -53 72 -61 40 -67L-22 -97C-40 -112 -78 -114 -100 -104C-127 -92 -150 -70 -158 -44C-162 -28 -160 -16 -152 -14Z"/>
      <path class="r-sohle" d="M-156 -13L98 -13C109 -13 116 -18 116 -25L-160 -25Z"/>
      <path class="r-schuhkappe" d="M60 -25C84 -26 104 -28 112 -34C106 -50 80 -58 52 -63C60 -52 62 -38 60 -25Z"/>
      <path class="r-naht" d="M20 -76L6 -60M38 -70L24 -55M54 -65L42 -51M-98 -103C-78 -95 -46 -93 -22 -97"/>`;
    const bein = p => {
      const kn = gelenk(huefte, ank(p), Lo, Lu, vorn), knie = kn.g, fuss = kn.end;
      const dS = unit(sub(fuss, knie)), dT = unit(sub(knie, huefte)), qS = nrm(dS), qT = nrm(dT);
      const sch0 = add(knie, mul(dT, -s(48))), sch1 = add(knie, mul(dS, s(150))), saum = add(knie, mul(dT, s(6)));
      return glied(knie, fuss, s(100), s(98), s(64), s(3), s(18), .28, "r-haut")
        + glied(add(fuss, mul(dS, -s(100))), fuss, s(76), s(74), s(72), 0, s(3), .5, "r-socke")
        + linie([add(add(fuss, mul(dS, -s(88))), mul(qS, s(37))), add(add(fuss, mul(dS, -s(88))), mul(qS, -s(37)))], "r-sockenrand")
        + `<g transform="translate(${r1(p[0])} ${r1(-p[1])}) scale(${r1(sk * 1000) / 1000})">${SCHUH}</g>`
        + glied(sch0, sch1, s(126), s(122), s(98), s(12), s(2), .3, "r-schoner")
        + `<path class="r-glanz" d="M${P(add(sch0, mul(qS, s(48))))}Q${P(add(knie, mul(qS, s(66))))} ${P(add(lerp(knie, sch1, .55), mul(qS, s(50))))}"/>`
        + (() => {
          /* Shorts mit Schatten an der Unterseite -- auf die Shorts zugeschnitten */
          const hd = gliedD(add(huefte, mul(dT, -s(24))), saum, s(184), s(162), s(136), s(12), s(8), .45), hc = id("hc" + beinNr++);
          return `<clipPath id="${hc}"><path d="${hd}"/></clipPath><path class="r-hose" d="${hd}"/>
            <path class="r-schatten" clip-path="url(#${hc})" d="${Q([add(huefte, mul(qT, -s(40))), add(lerp(huefte, saum, .5), mul(qT, -s(46))),
              add(saum, mul(qT, -s(34))), add(saum, mul(qT, -s(120))), add(huefte, mul(qT, -s(140)))])}"/>`;
        })()
        + linie([add(saum, mul(qT, s(62))), add(saum, mul(qT, -s(62)))], "r-saum");
    };
    /* Rumpf in eigenen Koordinaten: t laeuft von der Huefte (0) zur Schulter
       (1), s quer dazu in mm, positiv zum Ruecken. Weites Trikot: runder
       Ruecken, Brust, etwas Bauch. */
    const u = unit(sub(sch, huefte)), vB = nrm(u);
    const tp = (t, sv) => add(add(huefte, mul(u, t * T)), mul(vB, sv * sk));
    const RUMPF = [[-.02, 112], [.22, 100], [.48, 96], [.7, 108], [.88, 104], [1.0, 86], [1.08, 54], [1.13, 20], [1.11, -26],
                   [1.04, -66], [.9, -102], [.7, -104], [.48, -92], [.26, -94], [.06, -108], [-.05, -98]];
    const rumpf = Q(RUMPF.map(([t, sv]) => tp(t, sv)));
    /* Kopf: wird wie der Rest mit der Groesse skaliert und schaut leicht nach vorn-unten auf den Trail */
    const kopf = add(add(sch, mul(u, 236 * sk)), mul(vB, -46 * sk));   /* mit Hals dazwischen */
    const kipp = Math.max(4, Math.min(20, 12 + (45 - best.g) * .3));
    kopfOben = kopf[1] + 128 * sk;
    /* Punkt am Kopf (eigene Koordinaten, y nach unten) in Rad-Koordinaten */

function cockpitSvg(f){
  const S = f.schulter * 10, B = f.lenker, hy = 470, hand = B / 2 - 74, n = ++svgNr, id = s => "ck" + n + s;

        <span>${[f.reach ? `Reach ${f.reach - 10}–${f.reach + 10} mm` : "", f.sattelTief ? "" : tx("bei Specialized ", "Specialized ") + f.sp].filter(Boolean).join(" · ")}</span>

    <div class="fit-rad">${radSvg({masse:true, fahrer:{h:f.h, stehend:f.sattelTief}, reach:f.reach || 430,
      sattel:f.sattelTief ? 430 + f.gi * 28 : f.sattel, ohneSattelMass:f.sattelTief, kurbel:f.kurbel, vorbau:vm,
      lr:/^Mullet/.test(f.lr) ? "mx" : f.lrWert, sr:360 + f.gi * 28, hardtail:dirtRad})}
      ${dirtRad ? "" : `<p class="fit-rad-q">${tx(`Gezeichnet nach der Geometrie des Propain Spindrift 5 AL, Größe ${spindriftGroesse(f.reach || 430).g}`,

      ${f.vorbau ? kachel(i++, IC.vorbau, tx("Vorbau", "Stem"), `${f.vorbau[0]}–${f.vorbau[1]} mm`, null, tx("kürzer lenkt direkter", "shorter steers more directly")) : ""}

      ${kachel(i++, IC.stuetze, tx("Sattelstütze", "Seatpost"), f.hub ? tx("bis ", "up to ") + f.hub + " mm" : tx("fest", "rigid"), f.hub, f.hub ? tx("Hub der Variostütze", "Dropper post travel") : tx("Sattel bleibt unten — kein Dropper nötig", "Saddle stays down — no dropper needed"))}

        : kachel(i++, IC.sattel, tx("Sattelhöhe", "Saddle height"), f.sattel + " mm", f.sattel, tx("Tretlagermitte bis Satteloberkante", "Bottom bracket centre to top of saddle") + (f.ds.indexOf("dh") >= 0 ? tx(" — bergab tiefer", " — lower for descending") : ""))}

const bewegungAus = () => { try{ return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } };
/* Zahlen hochzaehlen: der Text bleibt, nur die Zahl darin laeuft */
function eiZaehlen(wurzel){
  if(!wurzel || bewegungAus()) return;
  Array.prototype.forEach.call(wurzel.querySelectorAll("[data-zaehl]"), el => {
    const ziel = +el.dataset.zaehl, text = el.textContent, t0 = performance.now() + 350, dauer = 900;
    if(!(ziel > 0) || text.indexOf(String(ziel)) < 0) return;
    const schritt = t => { const p = Math.max(0, Math.min(1, (t - t0) / dauer)), e = 1 - Math.pow(1 - p, 3);
      el.textContent = text.replace(String(ziel), String(Math.round(ziel * e)));
      if(p < 1 && el.isConnected) requestAnimationFrame(schritt); else el.textContent = text; };
    requestAnimationFrame(schritt);
  });
}
function konfetti(){
  if(bewegungAus()) return;
  const box = document.createElement("div");
  box.className = "konfetti"; box.setAttribute("aria-hidden", "true");
  const farben = ["#8a4dff", "#5b5bff", "#2f8cff", "#2ef29a", "#ffbe2e", "#ff4f7b", "#c2a6ff"];
  let h = "";
  for(let i = 0; i < 80; i++){
    const x = (Math.random() * 2 - 1) * 58, y = -(18 + Math.random() * 30), r = (Math.random() * 2 - 1) * 900;
    h += `<i style="--x:${x.toFixed(1)}vw;--y:${y.toFixed(1)}vh;--r:${r.toFixed(0)}deg;--d:${(1.7 + Math.random() * 1.3).toFixed(2)}s;--w:${(Math.random() * .18).toFixed(2)}s;background:${farben[i % farben.length]}${i % 3 ? "" : ";border-radius:50%;width:9px;height:9px"}"></i>`;
  }
  box.innerHTML = h;
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 3400);
}

   Anleitung nicht mehr. Ueberspringen geht jederzeit.

/* Eine Option steht nur zur Wahl, wenn es dafuer einen Rahmen gibt, der zur

const rahmenFuer = (w, feld) => katalog(quelleOf(slotOf("rahmen"))).some(t => eignung(t) >= 4 && (feld === "lr"
  ? (w === "mullet" ? t.lrV === "29" && t.lrH === "27.5" : t.lrV === w && t.lrH === w)
  : t.maxGabel > 0 && (w === "fully") === !!t.daempfer));

function eiSchritte(){
  if(ei.modus === "fit") return ["koerper", "masse", "fit"];
  return ["hallo", "ziel", "erfahrung", "disziplin"].concat(EI_FRAGEN, ["charakter", "koerper", "masse", "fit"],
    ei.ziel === "traum" ? ["budget", "vorlieben", "wuensche"] : [], ["fertig"]);
}
const eiOpt = (art, w, icon, t, s, an, tag, j) => `<button class="ei-opt" data-eiwahl="${art}|${w}" aria-pressed="${!!an}" style="--j:${j || 0}">
  <span class="eo-ic">${ic(icon, 24)}</span><span class="eo-t"><b>${t}</b><span>${s}</span>${tag ? `<i class="eo-tag">${tag}</i>` : ""}</span></button>`;
const eiWeiterBtn = (txt) => `<button class="btn wide gross" data-eiweiter="1">${txt || tx("Weiter", "Next")}</button>`;
const eiFit = () => fitRechnen({...koerper, groesse:koerper.groesse || 178});
function eiWert(k){
  if(k === "groesse") return koerper.groesse || 178;
  if(k === "fahrer") return plan.fahrer || 78;
  if(k === "budget") return plan.budget || 3500;
  const f = eiFit();
  return f ? f[k] : 0;
}
const eiFmt = (k, v) => k === "budget" ? eur(v) : zahlDe(v);
function eiRegler(k, l, u, hin, sch){
  const [min, max, st] = EI_BEREICH[k], w = eiWert(k);
  return `<div class="ei-regler">
    <div class="er-kopf"><label for="er-${k}">${l}${sch != null ? `<span class="er-sch" id="er-sch-${k}"${sch ? "" : " hidden"}>${tx("geschätzt", "estimated")}</span>` : ""}</label>
      <span class="er-wert"><output id="er-v-${k}" for="er-${k}">${eiFmt(k, w)}</output><small>${u}</small></span></div>
    <div class="er-reihe"><button class="er-pm" data-eistep="${k}|-${st}" aria-label="${tx(l + " weniger", l + " less")}">−</button>
      <input class="er" id="er-${k}" type="range" min="${min}" max="${max}" step="${st}" value="${w}" data-eik="${k}" style="--p:${((w - min) / (max - min) * 100).toFixed(1)}%">
      <button class="er-pm" data-eistep="${k}|${st}" aria-label="${tx(l + " mehr", l + " more")}">+</button></div>
    ${hin ? `<p class="er-h">${hin}</p>` : ""}</div>`;
}

  for(let i = 1; i < p.length; i++) if(lb <= p[i][0])
    return p[i-1][1] + (lb - p[i-1][0]) * (p[i][1] - p[i-1][1]) / (p[i][0] - p[i-1][0]);
  const a = p[p.length - 2], b = p[p.length - 1];
  return b[1] + (lb - b[0]) * (b[1] - a[1]) / (b[0] - a[0]);

const FED_ANLEITUNG_EN = `<div class="erk" style="margin-top:6px"><b>How to set it up</b>

        2. Check sag: stand on the bike in riding position; the rubber O-ring on the stanchion shows how far it sinks — that should be roughly the sag value.<br>
        3. Compression: first turn the knob fully closed (clockwise), then count the clicks back. “Middle” means half the number of clicks. In the diagram every tick is one click, the number says how far from the base setting. Cane Creek counts the other way, from fully open — the tile says so.<br>
        4. On the shock, LSC and HSC usually sit on the reservoir, the climb switch next to them. On descents the lever is always open, otherwise HSC and LSC don't work.<br>
        5. Rebound, your base value: many forks have a chart on the leg (clicks per air pressure). Otherwise: set the knob to fully fast (hare), roll off a kerb seated and then go slower click by click until the rear comes back once after landing and doesn't bob again. Same at the front with a firm push on the bar. The clicks in the rebound tile count from this base value. More air needs more rebound — check again after every pressure change.</div>
      <div class="erk"><b>Fine-tune after the first ride</b>

        · Harsh and bucking on roots and rocks → <b style="display:inline">HSC</b> 1 click out.<br>
        · Little grip in corners, feels dead → <b style="display:inline">LSC</b> 1–2 clicks out.<br>
        · Never uses full travel (O-ring) → 5 % less air.<br>
        · Shock bobs when pedalling → rear <b style="display:inline">LSC</b> in, or the climb switch to the middle position.<br>
        · Rear sags in compressions and berms, the bike feels sluggish → rear <b style="display:inline">LSC</b> 1–2 clicks in.<br>
        · Rear end bottoms out on drops → rear <b style="display:inline">HSC</b> 1 click in; if that's not enough: 5 % more air or a volume spacer.<br>
        · Rear wheel skips over braking bumps and rock gardens → rear <b style="display:inline">HSC</b> 1 click out, rebound 1–2 clicks faster.<br>
        · Front and rear should feel the same: if the rear feels much harder than the fork, first open the rear compression rather than closing the front.</div>
      <p class="hint" style="margin-top:8px">Starting values, no guarantee: the table on your fork and the manual take priority. Never pump beyond the

/* Feste Texte im HTML tragen beide Sprachen: data-t (Text), data-ta
   (aria-label), data-tt (title), jeweils "Deutsch|English" */
function festeTexte(){
  document.documentElement.lang = sprache;
  const w = s => { const i = s.indexOf("|"); return sprache === "en" ? s.slice(i + 1) : s.slice(0, i); };
  Array.prototype.forEach.call(document.querySelectorAll("[data-t]"), el => { el.textContent = w(el.dataset.t); });
  Array.prototype.forEach.call(document.querySelectorAll("[data-ta]"), el => el.setAttribute("aria-label", w(el.dataset.ta)));
  Array.prototype.forEach.call(document.querySelectorAll("[data-tt]"), el => el.setAttribute("title", w(el.dataset.tt)));
}
/* Sprache umstellen. Ausfuehrungen merken sich ihren Namen, darum wird der
   Zwischenspeicher geleert; ein offener Einstieg zeichnet sich neu, ein
   offenes Blatt (Menue) wird neu geoeffnet. */
function setzeSprache(s, nachher){
  if((s !== "de" && s !== "en") || s === sprache) return;
  sprache = s;
  try{ localStorage.setItem("mtb.sprache", s); }catch(e){}
  VARIANTEN.clear();
  festeTexte();
  zeichne();
  if($("modal").querySelector(".ei")) eiZeigen(true);
  else if(nachher) nachher();
}
/* Beim Start und bei jedem Wechsel (Ansicht, Modus, Profil) fliegen die
   Karten gestaffelt ein. Danach wieder aus -- sonst spielte jedes Neuzeichnen
   beim Bauen die Animation erneut ab. */
function einflug(){
  if(bewegungAus()) return;
  document.body.classList.add("einflug");
  clearTimeout(einflug.z); einflug.z = setTimeout(() => document.body.classList.remove("einflug"), 1400);
}
/* Wertung hochzaehlen statt springen, mit einem Puls am Ring */
function zaehle(el, ziel){
  const von = +el.dataset.w || 0;
  el.dataset.w = ziel;
  cancelAnimationFrame(el.raf || 0);
  if(von === ziel || bewegungAus()){ el.textContent = ziel; return; }
  const ring = el.closest(".ring-wrap");

  for(const s of SLOTS){

}

/* Dasselbe Teil in der Ausfuehrung, die zum Aufbau passt -- die aktuelle
   Wahl bleibt, wo sie passt. null, wenn nichts zu aendern ist. */
function passendeAusfuehrung(slotKey, t, b){
  if(!t || !t.v || !t.wahl) return null;
  const basis = rohTeil(quelleOf(slotOf(slotKey)), t.basisId || t.id);
  if(!basis || !basis.v) return null;
  const w = basis.v.map((d, i) => {
    const cur = t.wahl[i];
    if(d.o.length < 2 || optionPasst(slotKey, d, d.o[cur], b) !== false) return cur;
    let best = -1;
    d.o.forEach((o, j) => {
      if(optionPasst(slotKey, d, o, b) !== true) return;
      const f = GROESSTE[d.k];
      if(best < 0 || (f && o.s[f] > d.o[best].s[f])) best = j;
    });
    return best < 0 ? cur : best;
  });
  const v = varianteNachIndex(basis, w);
  if(v.id === t.id) return null;
  v.aenderung = basis.v.map((d, i) => w[i] !== t.wahl[i] ? dimName(d.k) + " " + d.o[t.wahl[i]].n + " → " + d.o[w[i]].n : "").filter(Boolean);
  return v;
}
/* Wofuer ein Rahmen gebaut ist: die Disziplin mit der hoechsten Eignung,
   bei Gleichstand die aktuell gewaehlte. null, wenn er ueberall gleich taugt. */
function rahmenDisziplin(r){
  if(!r || !r.e) return null;
  const max = Math.max.apply(null, DID.map(d => r.e[d] || 0));
  if(max < 4) return null;
  const beste = DID.filter(d => (r.e[d] || 0) === max);
  return sel.length === 1 && beste.indexOf(sel[0]) >= 0 ? sel[0] : beste[0];
}
/* Hinweis, wenn Rahmen und gewaehlte Disziplin nicht zusammengehoeren */
function diszHinweis(){
  if(modus === "traum" || !build.rahmen) return "";
  const r = findeTeil("rahmen", build.rahmen), d = rahmenDisziplin(r);
  if(!d || sel.some(x => (r.e[x] || 0) >= 4)) return "";
  return `<div class="mixbox w" style="margin-bottom:14px">${tx(`<b>Dein Rahmen ist für ${dLang(d)} gebaut,</b> die App bewertet
    gerade nach ${esc(selNamen())}. Dann gelten gute ${dLang(d)}-Teile als unpassend.`, `<b>Your frame is built for ${dLang(d)},</b> the app is currently rating for ${esc(selNamen())}. Then good ${dLang(d)} parts count as unsuitable.`)}
    <div style="margin-top:8px"><button class="btn sm" data-diszset="${d}">${tx(`Auf ${dLang(d)} umstellen`, `Switch to ${dLang(d)}`)}</button></div></div>`;
}
/* Vorschlaege fuer einen bestehenden Aufbau, in drei Sorten:
   - einstellen: dasselbe Teil, andere Ausfuehrung loest einen Konflikt
     (Gabel auf 140 mm stellen statt eine andere Gabel kaufen)
   - ersatz: das Teil passt nicht und laesst sich nicht umstellen -- Ersatz
     in derselben Klasse, nicht der billigste
   - upgrades: ein besseres Teil. Besser heisst: mindestens so hochwertig
     (Katalogpreis als Stufe) UND die Wertung steigt. Vorher reichte die
     Wertung allein, und fuer eine Fox 38 am Trailrad stand eine Gabel fuer
     ein Drittel des Preises als "Upgrade" da.
   Leere Plaetze sind kein Upgrade, und am eigenen Rad ist ein neuer Rahmen
   ein neues Rad. */
function upgrades(r){
  const einstellen = [], ersatz = [], vor = [];
  const fehlerAn = (res, k) => res.funde.filter(f => f.level === "fehler" && f.slots.indexOf(k) >= 0).length;
  for(const s of SLOTS){
    if(entfaellt(build, s.k) || !build[s.k]) continue;
    if(s.k === "rahmen" && modus !== "traum") continue;
    const jetzt = findeTeil(s.k, build[s.k]);
    if(!jetzt) continue;
    const fJetzt = fehlerAn(r, s.k);
    if(fJetzt){
      const pa = passendeAusfuehrung(s.k, jetzt, build);
      if(pa){
        const probe = {...build}; probe[s.k] = pa.id;
        const pr = bewerte(probe);
        if(fehlerAn(pr, s.k) < fJetzt){ einstellen.push({slot:s, teil:pa, jetzt:jetzt, d:pr.gesamt - r.gesamt, aenderung:pa.aenderung}); continue; }
      }
    }
    const qJetzt = grundpreis(jetzt);
    let besterErsatz = null;
    for(const kand of kandidaten(s.k, build)){
      if(basisVon(kand.id) === basisVon(jetzt.id)) continue;
      const probe = {...build}; probe[s.k] = kand.id;
      const pr = bewerte(probe);
      const d = pr.gesamt - r.gesamt;
      if(harteFehler(probe) > harteFehler(build)) continue;
      const qK = grundpreis(kand);
      const eintrag = {slot:s, teil:kand, jetzt:jetzt, d:d, mehr:preisVon(kand) - preisVon(jetzt), gd:(kand.g || 0) - (jetzt.g || 0)};
      if(fJetzt){
        /* Ersatz: behebt den Konflikt; unter denen das Teil, das der
           jetzigen Klasse am naechsten kommt */
        if(fehlerAn(pr, s.k) >= fJetzt) continue;
        const abstand = Math.abs(Math.log((qK || 1) / (qJetzt || 1))) - (d > 0 ? d / 1000 : 0);
        if(!besterErsatz || abstand < besterErsatz.abstand) besterErsatz = {...eintrag, abstand:abstand};
        continue;
      }
      if(d <= 0 || qK < qJetzt * 0.95) continue;                 /* kein Rueckschritt als Upgrade */
      if(plan.budget > 0 && pr.preis > plan.budget && pr.preis > r.preis) continue;
      vor.push(eintrag);
    }
    if(besterErsatz) ersatz.push(besterErsatz);
  }
  vor.sort((a, b) => b.d - a.d || a.mehr - b.mehr);
  const gesehen = {}, top = [];
  for(const v of vor){ if(gesehen[v.slot.k]) continue; gesehen[v.slot.k] = 1; top.push(v); if(top.length === 5) break; }
  return {einstellen:einstellen, ersatz:ersatz, upgrades:top, anzahl:einstellen.length + ersatz.length + top.length};
}

/* Solange eine Schublade offen ist, steht die Seite dahinter still. overflow:

   seiner Stelle festgenagelt und beim Schliessen dorthin zurueckgesetzt. */
let sperrY = 0, gesperrt = false;
function sperre(){
  if(gesperrt) return;
  gesperrt = true; sperrY = window.scrollY;
  const b = document.body.style;
  b.position = "fixed"; b.top = -sperrY + "px"; b.left = "0"; b.right = "0"; b.width = "100%";
}
function freigeben(){
  if(!gesperrt) return;
  gesperrt = false;
  const b = document.body.style;
  b.position = b.top = b.left = b.right = b.width = "";
  window.scrollTo(0, sperrY);
}
/* Wischen ausserhalb der Liste, oder ueber ihr Ende hinaus, geht nirgendwohin.
   Seitlich wischen in der Jahresleiste bleibt erlaubt. */
let wischX = 0, wischY = 0;
document.addEventListener("touchstart", e => {
  if(e.touches.length === 1){ wischX = e.touches[0].clientX; wischY = e.touches[0].clientY; }
}, {passive:true});
document.addEventListener("touchmove", e => {
  if(!gesperrt || e.touches.length !== 1) return;
  if(e.target.closest && e.target.closest('input[type="range"]')) return;
  const dx = e.touches[0].clientX - wischX, dy = e.touches[0].clientY - wischY;
  if(Math.abs(dx) > Math.abs(dy) && e.target.closest(".jl-reihe, .marken, .sortier, .deal-filt")) return;
  const liste = e.target.closest(".sheet-b, .ei-b");
  if(!liste || liste.scrollHeight <= liste.clientHeight + 1){ e.preventDefault(); return; }
  const oben = liste.scrollTop <= 0, unten = liste.scrollTop + liste.clientHeight >= liste.scrollHeight - 1;
  if((dy > 0 && oben) || (dy < 0 && unten)) e.preventDefault();
}, {passive:false});

function oeffneSlot(slotKey){

  const basis = bewerte(build);
  const wunsch = markenWunsch(slotKey);

     alle anderen in der, die zum Aufbau passt. */
  const curT = build[slotKey] ? findeTeil(slotKey, build[slotKey]) : null;

    const d = pr.gesamt - basis.gesamt;
    const istSel = !!curB && basisVon(t.id) === curB;
    let tag, gut, rang, gruende;

    if(slotKey === "rahmen"){

      const tausch = [...new Set([].concat(...fehler.map(f => f.slots)).filter(k => k !== "rahmen"))];
      const zuFrueh = t.seit && jahrAktiv() < t.seit;
      gut = !tausch.length && !zuFrueh;
      rang = zuFrueh ? 3 : tausch.length ? 1 + Math.min(1, tausch.length / 10) : warn.length ? 0.5 : 0;

          : warn.length ? `<span class="tag w">${tx("mit Abstrich", "with a catch")}</span>` : `<span class="tag ok">${tx("passt", "fits")}</span>`;
      gruende = fehler.concat(warn).slice(0,2).map(f =>

/* Sortieren ordnet nur die Karten im Blatt um -- nichts wird neu berechnet. */
let sortWahl = "empfohlen", markeWahl = "";
function sortieren(){
  const box = document.getElementById("opt-liste");
  if(!box) return;
  const els = Array.prototype.slice.call(box.children);
  els.forEach((el, i) => { if(el.dataset.i == null) el.dataset.i = i; });
  const k = sortWahl, num = (el, f) => +el.dataset[f] || 0;
  els.sort((a, b) => k === "preis" ? num(a, "p") - num(b, "p") || num(a, "i") - num(b, "i")
    : k === "gewicht" ? (num(a, "g") || 1e9) - (num(b, "g") || 1e9) || num(a, "i") - num(b, "i")
    : k === "rabatt" ? num(b, "r") - num(a, "r") || num(a, "p") - num(b, "p")
    : num(a, "i") - num(b, "i"));
  els.forEach(el => box.appendChild(el));
}

/* Foto verkleinern, bevor es in den Gerätespeicher geht. Ein Handyfoto hat
   schnell 4 MB; der Browser gibt einer Seite insgesamt nur etwa 5 MB. */
function fotoAufnehmen(datei, ziel){
  if(!datei) return;
  const wohin = ziel || {art:"rad"};
  const leser = new FileReader();
  leser.onload = function(ev){
    const bild = new Image();
    bild.onload = function(){
      const max = 1000;
      const f = Math.min(1, max / Math.max(bild.width, bild.height));
      const c = document.createElement("canvas");
      c.width = Math.round(bild.width * f); c.height = Math.round(bild.height * f);
      c.getContext("2d").drawImage(bild, 0, 0, c.width, c.height);
      let daten = c.toDataURL("image/jpeg", 0.72);
      if(daten.length > 1400000) daten = c.toDataURL("image/jpeg", 0.5);
      if(wohin.art === "topcap"){
        if(tcSpeichern(wohin.slot, {img:daten, marks:{}}) && $("fed-erg")) $("fed-erg").innerHTML = federErgebnisHtml();
        return;
      }
      fotos[modus] = daten;
      sichern();
      /* Beides neu zeichnen: die Schublade zeigt das Bild, die Liste dahinter
         das Vorschaubild in der Zeile. Vorher blieb die Liste stehen. */
      zeichne();
    };
    bild.onerror = function(){ alert(tx("Das Bild ließ sich nicht lesen. Versuch ein anderes Format.", "The image couldn't be read. Try a different format.")); };
    bild.src = ev.target.result;
  };
  leser.readAsDataURL(datei);
}

  if(tca){ tcAnsicht = tca.dataset.tcansicht; $("fed-erg").innerHTML = federErgebnisHtml(); return; }
  const tcm = T("[data-tcmark]");
  if(tcm){
    const slot = tcm.dataset.tcmark, d = tcLaden(slot), x = federRechnen()[slot];
    const offen = d && x ? knoepfeVon(x).filter(k => !(d.marks && d.marks[k])) : [];
    if(offen.length){
      const r = tcm.getBoundingClientRect();
      d.marks = d.marks || {};
      d.marks[offen[0]] = {x:Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)), y:Math.max(0, Math.min(1, (e.clientY - r.top) / r.height))};
      tcSpeichern(slot, d);
      $("fed-erg").innerHTML = federErgebnisHtml();
    }
    return;
  }
  const dz = T("[data-diszset]");
  if(dz){ sel = [dz.dataset.diszset]; sichern(); zeichne(); zeigeToast(tx("Disziplin auf " + dLang(sel[0]) + " gestellt.", "Discipline set to " + dLang(sel[0]) + ".")); return; }
  const ffa = T("[data-ff]");
  if(ffa){
    const q = ffa.dataset.ff.split("|");
    fprofil[q[0]] = q[1]; fSichern();
    fschritt++;
    if(fschritt > FFRAGEN.length){ fFragenOffen = false; fschritt = 0; }
    oeffneFederung(); return;
  }
  if(T("[data-ffweiter]")){ if(plan.fahrer > 0){ fschritt = 1; oeffneFederung(); } return; }
  if(T("[data-ffzurueck]")){ fschritt = Math.max(0, fschritt - 1); oeffneFederung(); return; }
  if(T("[data-ffneu]")){ fFragenOffen = true; fschritt = 0; oeffneFederung(); return; }
  const hi = T("[data-hilfe]");
  if(hi){
    const w = hi.dataset.hilfe;
    if(w === "start") oeffneEinstieg("voll");
    else if(w === "begriffe") oeffneBegriffe();
    else if(w === "score") oeffneScoreHilfe();
    else if(w === "leit"){
      leitAus = !leitAus; try{ localStorage.setItem("mtb.leit", leitAus ? "aus" : "an"); }catch(e){}
      view = "aufbau"; zeichne(); oeffneMenu();
    }
    return;
  }
  if(T("[data-ekkopie]")){ kopiere(einkaufText()); return; }
  if(T("[data-reset]")){
    setzeBau(modus === "traum" && profile.traum.length === 1 ? {...START} : leerBau());
    fotos[modus] = null; sel = ["trail"]; plan = {...PLAN_START, fahrer:plan.fahrer};
    if(modus === "markt") markt = JSON.parse(JSON.stringify(MARKT_START));
    jahrWahl[modus] = jahrStart(modus);
    sichern(); schliesse(); zeichne(); return;
  }
});

document.addEventListener("input", e => {
  const eik = e.target.closest && e.target.closest("[data-eik]");
  if(eik){ eiSetze(eik.dataset.eik, +eik.value, true); return; }
  const su = e.target.closest("[data-suche]");
  if(su){ suchText = su.value; filterAnwenden(); return; }
  const bf = e.target.closest("[data-betreiber]");
  if(bf){ betreiberLokal[bf.dataset.betreiber] = bf.value; sichern(); return; }
  const pn = e.target.closest("[data-profname]");
  if(pn){
    const p = profile[modus].find(x => x.id === pn.dataset.profname);
    if(p){ p.name = pn.value.replace(/\s+/g, " ").trim().slice(0, 40); sichern(); zeichne(); }
    return;
  }
  if(e.target.id === "lk-url"){
    const u = httpsNur(e.target.value), sf = $("lk-shop");
    if(sf) sf.placeholder = u ? shopAusLink(u) + " — erkannt" : "Shop — wird am Link erkannt";
    return;
  }
  const an = e.target.closest("[data-affnetz]");
  if(an){ aff[an.dataset.affnetz] = an.value.trim(); sichern(); zeichne(); return; }
  const md = e.target.closest("[data-mid]");
  if(md){
    if(!aff.mid) aff.mid = {};
    const w = md.value.trim();
    if(w) aff.mid[md.dataset.mid] = w; else delete aff.mid[md.dataset.mid];
    sichern(); zeichne(); return;
  }
  const mp = e.target.closest("[data-marktpreis]");
  if(mp){
    const v = parseInt(mp.value, 10);
    markt.preis = isNaN(v) || v < 0 ? 0 : v;
    sichern();
    /* Nur die Bewertung neu zeichnen waere schoener, aber zeichne() setzt das
       Feld neu und der Fokus ginge verloren. Deshalb gezielt aktualisieren. */
    const k = document.querySelector(".urteil");
    const m = marktWert(build);
    if(m && markt.preis > 0){ const u = preisUrteil(markt.preis, m); if(k){ k.className = "urteil " + u.k;
      k.querySelector(".kopf").textContent = u.kopf; k.querySelector(".zeile").textContent = u.txt; } else zeichne(); }
    else if(k) zeichne();
    return;
  }
  const pl = e.target.closest("[data-plan]");
  if(pl){
    const v = parseInt(pl.value, 10);
    plan[pl.dataset.plan] = isNaN(v) || v < 0 ? 0 : v;
    sichern(); zeichne();
    const btn = $("modal").querySelector(".sheet-f .btn.wide");
    if(btn && wizOffen()) btn.disabled = !(plan[pl.dataset.plan] > 0);
    if($("fed-erg")) $("fed-erg").innerHTML = federErgebnisHtml();     /* Federungsrechner live */
    const ffw = $("modal").querySelector("[data-ffweiter]");
    if(ffw) ffw.disabled = !(plan.fahrer > 0);
  }
});

function start(daten){
  /* Wer die App zum ersten Mal oeffnet, bekommt die Startauswahl */
  let erstesMal = false;
  /* Das Onboarding kommt beim ersten Oeffnen -- auch fuer alle, die die App
     schon vorher hatten, einmal: seit der Sprachwahl und den Vorlieben fragt es
     mehr, als die alte Startauswahl wusste */
  try{ erstesMal = !localStorage.getItem("mtb.einstieg2"); }catch(e){}
  laden();
  if(/^#betreiber$/i.test(location.hash)){
    linkVerwaltung = true; sichern();
    try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
    setTimeout(() => zeigeToast("Betreiber-Modus an — unter ⋮ stehen Impressum, Links und Netzwerk."), 400);
  }
  if(daten && daten.builds){
    builds = daten.builds; modus = daten.modus || modus; 
    fotos = daten.fotos || fotos;
    sel = daten.sel || sel; plan = daten.plan || plan; markt = daten.markt || markt;
    aff = daten.aff || aff; view = daten.view || view;
    build = builds[modus];
  }
  festeTexte();
  zeichne();
  liveLaden();
  if(erstesMal && !daten && !linkVerwaltung) setTimeout(() => { if(!$("modal").firstElementChild) oeffneEinstieg("voll"); }, 250);
  else einflug();
}

      $("mini").tabIndex = document.body.classList.contains("klein") ? 0 : -1;
