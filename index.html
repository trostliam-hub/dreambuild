/* ═══════════ 12 · Aktualisieren ═══════════
   Neue Fassungen werden im Hintergrund erkannt, aber erst geladen, wenn man den
   Knopf drueckt -- so springt die App nie mitten im Bauen um.

   Erkannt wird ueber einen Versionsvergleich: im Worker-Skript steht der
   Stempel der letzten Veroeffentlichung, hier in APP_VERSION der Stempel dieser
   Seite. Das Skript wird dabei am Browser-Cache vorbei geholt; genau dieser
   Cache hat beim Testen schon einmal eine alte Fassung ausgeliefert, obwohl
   der Server die neue hatte.

   Beim Aktualisieren werden die App-Caches geleert und die Seite unter einer
   neuen Adresse geladen. Der Umweg ueber die Adresse ist Absicht: iOS haelt
   Home-Bildschirm-Apps sonst gern auf dem alten Stand fest. Aufbauten, Fotos
   und Einstellungen liegen im localStorage und bleiben unberuehrt. */
function versionText(v){
  const m = /^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})$/.exec(v || "");
  return m ? (sprache === "en" ? m[3] + "/" + m[2] + "/" + m[1] + ", " + m[4] + ":" + m[5] : m[3] + "." + m[2] + "." + m[1] + ", " + m[4] + ":" + m[5] + " Uhr") : tx("Entwicklungsstand", "development build");
}
function zeigeToast(txt, ms){
  const t = $("toast"); if(!t) return;
  t.textContent = txt; t.hidden = false;
  clearTimeout(zeigeToast.z); zeigeToast.z = setTimeout(() => { t.hidden = true; }, ms || 3200);
}
/* Weggetippt heisst: fuer diese Version und diese Sitzung Ruhe. Beim naechsten
   Start oder bei einer noch neueren Version ploppt es wieder auf. */
let serverStand = null;
function zeigeUpdate(){
  let weg = null;
  try{ weg = sessionStorage.getItem("mtb.updweg"); }catch(e){}
  const pop = $("upd-pop");
  if(pop) pop.hidden = !updateDa || weg === serverStand;
  Array.prototype.forEach.call(document.querySelectorAll(".app-stand .btn"),
    x => { x.textContent = updateDa ? "Neue Version laden" : "App aktualisieren"; });
}
async function serverVersion(){
  const txt = await fetch("mtb-sw.js?pruef=" + Date.now(), {cache:"no-store"}).then(r => {
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  });
  /* Der Cache-Praefix ist intern und bleibt "dreambuild-": aeltere installierte
     Fassungen suchen genau danach und zeigen sonst kein Update mehr an. */
  const m = /var CACHE = '(?:dreambuild|crankscore)-([^']+)'/.exec(txt);
  return m ? m[1] : null;
}
function updateWeg(){
  try{ sessionStorage.setItem("mtb.updweg", serverStand || ""); }catch(e){}
  zeigeUpdate();
}
async function updatePruefen(){
  if(APP_VERSION === "entwicklung") return;
  try{
    const v = await serverVersion();
    serverStand = v;
    updateDa = !!v && v !== APP_VERSION;
    zeigeUpdate();
  }catch(e){ /* offline -- dann eben beim naechsten Mal */ }
}
async function appAktualisieren(){
  const knopf = document.querySelector("#upd-pop:not([hidden]) .btn") || document.querySelector(".app-stand .btn");
  if(knopf) knopf.classList.add("laedt");
  let v = null;
  try{ v = await serverVersion(); }
  catch(e){
    if(knopf) knopf.classList.remove("laedt");
    zeigeToast(tx("Kein Netz — die App läuft weiter offline. Später nochmal versuchen.", "No connection — the app keeps working offline. Try again later."));
    return;
  }
  if(v && v === APP_VERSION){
    if(knopf) knopf.classList.remove("laedt");
    updateDa = false; zeigeUpdate();
    zeigeToast(tx("Du hast die neueste Version (", "You have the latest version (") + versionText(APP_VERSION) + ").");
    return;
  }
  try{
    sessionStorage.setItem("mtb.frisch", v || "");
    if(window.caches){ const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); }
    const reg = navigator.serviceWorker ? await navigator.serviceWorker.getRegistration() : null;
    if(reg){ try{ await reg.update(); }catch(e){} }
  }catch(e){}
  location.replace(location.pathname + "?v=" + encodeURIComponent(v || Date.now()));
}

try{
  /* Nachgeschaut wird beim Start, bei jeder Rueckkehr in die App und stuendlich --
     unabhaengig davon, ob sich der Worker registrieren liess. Der Vergleich
     braucht ihn nicht, und ohne diese Trennung bliebe der Hinweis stumm, sobald
     die Registrierung einmal scheitert. */
  let swReg = null;
  const schau = function(){
    if(swReg) swReg.update().catch(function(){});
    updatePruefen();
  };
  if("serviceWorker" in navigator && window.top === window.self
     && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")
     && document.querySelector('link[rel="manifest"]')){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("mtb-sw.js", {updateViaCache:"none"}).then(function(reg){
        swReg = reg;
        reg.update().catch(function(){});
        /* Uebernimmt ein neuer Worker, wird nur der Hinweis gezeigt --
           geladen wird erst auf Knopfdruck. */
        navigator.serviceWorker.addEventListener("controllerchange", function(){ updatePruefen(); });
      }).catch(function(){});
    });
  }
  window.addEventListener("load", updatePruefen);
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible") schau();
  });
  setInterval(schau, 3600000);
  /* Nach dem Aktualisieren: Bescheid geben und die Adresse wieder aufraeumen */
  const frisch = sessionStorage.getItem("mtb.frisch");
  if(frisch !== null){
    sessionStorage.removeItem("mtb.frisch");
    setTimeout(() => zeigeToast(tx("Aktualisiert — Version vom ", "Updated — version of ") + versionText(APP_VERSION) + "."), 400);
  }
  if(/[?&]v=/.test(location.search)) history.replaceState(null, "", location.pathname);
}catch(e){}
